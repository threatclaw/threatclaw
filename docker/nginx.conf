# ThreatClaw — Hardened Nginx Reverse Proxy
# HTTPS termination + security headers + rate limiting + attack mitigation
#
# Single entry point: https://<hostname>/
# All other ports are closed. Core and dashboard are internal only.

# ── Rate limiting zones ──
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=webhook:10m rate=100r/s;

# ── Connection limits ──
limit_conn_zone $binary_remote_addr zone=addr:10m;

# ── Hide nginx version everywhere ──
server_tokens off;

# ── Redirect HTTP → HTTPS ──
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # ── HTTP-on-HTTPS error page ──
    error_page 497 /400.html;
    location = /400.html {
        root /usr/share/nginx/error-pages;
        internal;
    }

    # ══════════════════════════════════════════════════════════
    #  TLS HARDENING
    # ══════════════════════════════════════════════════════════

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Only TLS 1.2 and 1.3 — no SSLv3, TLS 1.0, TLS 1.1
    ssl_protocols TLSv1.2 TLSv1.3;

    # Strong ciphers only — AEAD ciphers preferred, no RC4/3DES/MD5
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers on;

    # ECDH curve
    ssl_ecdh_curve secp384r1;

    # Session resumption (performance + security)
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;  # Disable for forward secrecy

    # OCSP stapling (if using real CA certs)
    # ssl_stapling on;
    # ssl_stapling_verify on;

    # ══════════════════════════════════════════════════════════
    #  SECURITY HEADERS
    # ══════════════════════════════════════════════════════════

    # HSTS — force HTTPS for 1 year, include subdomains
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Prevent clickjacking — only allow framing from same origin
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # XSS protection (legacy browsers)
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer policy — don't leak full URL to external sites
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content Security Policy — whitelist allowed sources
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' wss: ws:; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

    # Permissions policy — disable browser features we don't need
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

    # Prevent caching of sensitive pages
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;

    # Don't expose what powers the backend
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    # ══════════════════════════════════════════════════════════
    #  ANTI-ATTACK PROTECTIONS
    # ══════════════════════════════════════════════════════════

    # Max request body size (prevent upload bombs). Must stay >= the osquery
    # endpoint cap (16 MB in webhook_ingest.rs) so full DC/VDI host snapshots
    # are not rejected at the proxy with 413 before reaching the core.
    client_max_body_size 20m;

    # Slowloris protection — close slow connections. The header timeout stays
    # tight (10s) since headers are tiny. The BODY and send timeouts are raised
    # to 120s: an endpoint agent on a poor link (high RTT / packet loss) needs
    # time to stream a multi-MB host snapshot upload; 10s cut those POSTs off
    # mid-body, so the largest hosts (DC/VDI) could never sync.
    client_body_timeout 120s;
    client_header_timeout 10s;
    send_timeout 120s;
    keepalive_timeout 30s;

    # Max connections per IP
    limit_conn addr 50;

    # Buffer overflow protection
    # client_body_buffer_size : 16k is safe (POST body size matters more for
    # attacks; client_max_body_size=20m is the real gate — raised from 10m
    # so full DC/VDI host snapshots reach the 16 MB osquery endpoint instead
    # of being cut off with 413 at the edge).
    # client_header_buffer_size / large_client_header_buffers: the original
    # 1k / 2×1k = 2 KB ceiling was too small for JWT session cookies
    # (600-900 B) + standard browser headers (User-Agent, Accept*, Sec-Fetch-*
    # etc.) which together exceed 2 KB and made nginx return 400, surfacing
    # as Next.js "This page couldn't load" during SPA navigation.
    # 4k / 4×8k matches nginx defaults and is sufficient without relaxing
    # any meaningful attack-surface constraint (header bombs are capped well
    # below this threshold in practice).
    client_body_buffer_size 16k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 8k;

    # ══════════════════════════════════════════════════════════
    #  CUSTOM ERROR PAGES
    # ══════════════════════════════════════════════════════════

    ssi on;
    error_page 400 401 403 404 429 500 502 503 504 /error.html;
    location = /error.html {
        ssi on;
        root /usr/share/nginx/error-pages;
        internal;
    }

    # ══════════════════════════════════════════════════════════
    #  ROUTES
    # ══════════════════════════════════════════════════════════

    # ── Error page assets ──
    location /error-assets/ {
        alias /usr/share/nginx/error-pages/;
        access_log off;
        add_header Cache-Control "public, max-age=86400";
    }

    # ── Login rate limit (anti brute force) ──
    location /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://threatclaw-dashboard:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Next.js static chunks ──
    # Two reasons for the dedicated location:
    #
    # 1. Hash-named chunks are immutable, so a long-lived public
    #    Cache-Control is safe and avoids re-downloading the same
    #    bundle on every page navigation. The global no-store /
    #    no-cache (set above for the sensitive HTML routes) gets
    #    overridden here.
    #
    # 2. When the build rotates (redeploy / container restart), the
    #    browser still asks for old chunk hashes that no longer exist
    #    on disk. Next.js answers those with its default 404 page,
    #    whose body is `text/html`. The browser then blocks the
    #    <script src=...> via X-Content-Type-Options: nosniff and
    #    surfaces Next's generic "This page couldn't load" until the
    #    user signs out and back in. We intercept the 404 here and
    #    return an empty body so the script load fails cleanly — a
    #    single hard reload (or the framework's stale-chunk recovery)
    #    then picks up the new buildId without manual gymnastics.
    location /_next/static/ {
        proxy_pass http://threatclaw-dashboard:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "public, max-age=31536000, immutable" always;

        proxy_intercept_errors on;
        error_page 404 = @stale_chunk;
    }

    location @stale_chunk {
        add_header Cache-Control "no-store" always;
        return 404 "";
    }

    # ══════════════════════════════════════════════════════════
    #  INGESTION → CORE DIRECT (Phase 2b-ii)
    # ══════════════════════════════════════════════════════════
    # Agent/webhook ingestion bypasses the Next.js proxy hop (the measured
    # ~50%-404-under-concurrency bottleneck) and goes straight nginx → core.
    # Auth is unchanged vs the dashboard path: nginx attaches the gateway Bearer
    # (rendered from ${TC_AUTH_TOKEN} by envsubst at boot), and the core still
    # validates the per-source x-webhook-token in the handler. These agent routes
    # carry no dashboard session by design (machine accounts). nginx forwards the
    # client's x-webhook-token, user-agent and gzip body (Content-Encoding)
    # untouched by default; we only add the Bearer + standard proxy headers.

    # High-volume webhook ingestion (prefix → beats the catch-all `/`).
    location /api/tc/webhook/ingest/ {
        limit_req zone=webhook burst=200 nodelay;
        limit_req_status 429;
        # FRONT-M1 : l'agent envoie parfois le token en query string (?token=)
        # en repli ; sans ceci il finirait en clair dans les access logs nginx.
        access_log off;
        proxy_pass http://threatclaw-core:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "Bearer ${TC_AUTH_TOKEN}";
        proxy_request_buffering off;   # stream large osquery snapshots, no disk spool
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 120s;
    }

    # Agent control endpoints (exact set — a regex, so it wins over the catch-all
    # and is placed before the blocking regexes further down).
    location ~ ^/api/tc/agent/(enroll|manifest|install\.sh|install\.ps1|uninstall\.sh|uninstall\.ps1)$ {
        limit_req zone=webhook burst=50 nodelay;
        limit_req_status 429;
        proxy_pass http://threatclaw-core:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "Bearer ${TC_AUTH_TOKEN}";
        proxy_read_timeout 120s;
    }

    # ── Everything else → Dashboard (Next.js handles app routing + session auth) ──
    # The dashboard still proxies the remaining /api/tc/* (user routes, with the
    # session cookie) and /api/ollama; pages go straight to Next.js. Only the
    # ingestion paths above are carved out to the core.
    location / {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://threatclaw-dashboard:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    # ══════════════════════════════════════════════════════════
    #  BLOCKED PATHS — attack surface reduction
    # ══════════════════════════════════════════════════════════

    # Block dotfiles (config leaks)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Block common exploit paths
    location ~* ^/(wp-admin|wp-login|wordpress|phpmyadmin|admin|cgi-bin|xmlrpc\.php) {
        deny all;
        return 404;
    }

    # Block script extensions that shouldn't exist
    location ~* \.(php|asp|aspx|jsp|cgi|pl)$ {
        deny all;
        return 404;
    }

    # Block SQL injection attempts in URL
    location ~* (union.*select|insert.*into|delete.*from|drop.*table|update.*set) {
        deny all;
        return 403;
    }
}
