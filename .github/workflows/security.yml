name: Security Scan

# Hard dependency-vulnerability gate. Runs on every push to main and on PRs so a
# newly-disclosed advisory turns the build red and blocks merge/release — not just
# the weekly scheduled scan. Ignores with rationale live in .cargo/audit.toml.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'  # Mondays at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Hard gate: any RUSTSEC advisory not listed in .cargo/audit.toml fails the
      # build. No `|| true`. Replaces the old per-package wasmtime/ring/argon2
      # check (the global gate covers those and everything else).
      - name: cargo audit (RUSTSEC, blocking)
        run: cargo audit

      # osv-scanner reads the OSV database (GHSA included) — coverage cargo-audit
      # (RUSTSEC-only) lacks. This is what would have caught the openssl HIGH that
      # RUSTSEC missed. Ignores with rationale live in osv-scanner.toml.
      - name: Install osv-scanner
        run: |
          curl -sSL https://github.com/google/osv-scanner/releases/download/v2.4.0/osv-scanner_linux_amd64 -o /usr/local/bin/osv-scanner
          chmod +x /usr/local/bin/osv-scanner

      - name: osv-scanner (GHSA/OSV, Cargo, blocking)
        run: osv-scanner --lockfile Cargo.lock --config osv-scanner.toml

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      # Dashboard npm dependencies — fail on high/critical. Moderate and below
      # are reported by the weekly scan but do not block.
      - name: npm audit (dashboard, high+, blocking)
        working-directory: dashboard
        run: npm audit --audit-level=high
