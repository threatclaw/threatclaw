# cargo-audit configuration
# Most advisories below are in OPTIONAL features (libsql, bedrock, import) not
# enabled in the default production build (default = ["postgres", "html-to-markdown"]).
# Exceptions are flagged inline (rsa: default build, no upstream fix).
# Default-build rustls-webpki is 0.103.13 (patched). Full rationale in deny.toml.

[advisories]
ignore = [
    # rustls-webpki 0.101.x / 0.102.x — transitive via aws-smithy (bedrock)
    # and libsql. Default build uses rustls-webpki 0.103.13 which is patched.
    "RUSTSEC-2026-0049",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",

    # rustls-webpki CRL-parsing panic — same optional-feature transitives as
    # 0049/0098/0099. Default build uses 0.103.13 which is patched.
    "RUSTSEC-2026-0104",

    # Unmaintained transitives via libsql (optional feature).
    "RUSTSEC-2025-0141",  # bincode 1.x
    "RUSTSEC-2025-0134",  # rustls-pemfile 2.2.0

    # fxhash via wasmtime profiling. Unmaintained, not a CVE.
    "RUSTSEC-2025-0057",

    # rsa Marvin timing sidechannel — DEFAULT BUILD (jsonwebtoken PS256
    # client-assertion for Microsoft Graph cert auth). No fixed upstream
    # version exists. Server-side, low-frequency signing of our own assertions
    # (not attacker-paced); private key is the app's MS cert. Accepted pending
    # an upstream rsa fix or a move off RSA client-assertion.
    "RUSTSEC-2023-0071",

    # paste — proc-macro, unmaintained (not a CVE). Transitive, no fix path.
    "RUSTSEC-2024-0436",
]
