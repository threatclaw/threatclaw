title: Renamed MegaSync Execution
id: 643bdcac-8b82-49f4-9fd9-25a90b929f3b
status: test
description: Detects the execution of a renamed MegaSync.exe as seen used by ransomware families like Nefilim, Sodinokibi,
  Pysa, and Conti.
references:
- https://redcanary.com/blog/rclone-mega-extortion/
author: Sittikorn S
date: 2021-06-22
tags:
- attack.stealth
- attack.t1218
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.OriginalFileName: megasync.exe
  filter:
    data.Image|endswith: \megasync.exe
  condition: selection and not filter
falsepositives:
- Software that illegally integrates MegaSync in a renamed form
- Administrators that have renamed MegaSync
level: high
