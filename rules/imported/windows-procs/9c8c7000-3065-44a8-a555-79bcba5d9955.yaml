title: MSDT Execution Via Answer File
id: 9c8c7000-3065-44a8-a555-79bcba5d9955
status: test
description: 'Detects execution of "msdt.exe" using an answer file which is simulating the legitimate way of calling msdt
  via "pcwrun.exe" (For example from the compatibility tab).

  '
references:
- https://lolbas-project.github.io/lolbas/Binaries/Msdt/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-06-13
tags:
- attack.stealth
- attack.t1218
- attack.execution
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.Image|endswith: \msdt.exe
    data.CommandLine|contains: ' -af '
  filter_main_pcwrun:
    data.ParentImage|endswith: \pcwrun.exe
  condition: selection and not 1 of filter_main_*
falsepositives:
- Possible undocumented parents of "msdt" other than "pcwrun".
level: high
