title: WMI Backdoor Exchange Transport Agent
id: 797011dc-44f4-4e6f-9f10-a8ceefbe566b
status: test
description: Detects a WMI backdoor in Exchange Transport Agents via WMI event filters
references:
- https://twitter.com/cglyer/status/1182389676876980224
- https://twitter.com/cglyer/status/1182391019633029120
author: Florian Roth (Nextron Systems)
date: 2019-10-11
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1546.003
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.ParentImage|endswith: \EdgeTransport.exe
  filter_conhost:
    data.Image: C:\Windows\System32\conhost.exe
  filter_oleconverter:
    data.Image|startswith: C:\Program Files\Microsoft\Exchange Server\
    data.Image|endswith: \Bin\OleConverter.exe
  condition: selection and not 1 of filter_*
falsepositives:
- Unknown
level: critical
