title: Proxy Execution Via Wuauclt.EXE
id: af77cf95-c469-471c-b6a0-946c685c4798
status: test
description: Detects the use of the Windows Update Client binary (wuauclt.exe) for proxy execution.
references:
- https://dtm.uk/wuauclt/
- https://blog.malwarebytes.com/threat-intelligence/2022/01/north-koreas-lazarus-apt-leverages-windows-update-client-github-in-latest-campaign/
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research), Florian Roth (Nextron Systems), Sreeman, FPT.EagleEye
  Team
date: 2020-10-12
tags:
- attack.stealth
- attack.t1218
- attack.execution
logsource:
  category: osquery
  product: sysmon
detection:
  selection_img:
  - Image|endswith: \wuauclt.exe
  - OriginalFileName: wuauclt.exe
  selection_cli:
    data.CommandLine|contains|all:
    - UpdateDeploymentProvider
    - RunHandlerComServer
  filter_main_generic:
    data.CommandLine|contains: ' /UpdateDeploymentProvider UpdateDeploymentProvider.dll '
  filter_main_wuaueng:
    data.CommandLine|contains: ' wuaueng.dll '
  filter_main_uus:
    data.CommandLine|contains:
    - :\Windows\UUS\Packages\Preview\amd64\updatedeploy.dll /ClassId
    - :\Windows\UUS\amd64\UpdateDeploy.dll /ClassId
  filter_main_winsxs:
    data.CommandLine|contains|all:
    - :\Windows\WinSxS\
    - '\UpdateDeploy.dll /ClassId '
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
