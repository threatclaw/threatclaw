title: Root Certificate Installed From Susp Locations
id: 5f6a601c-2ecb-498b-9c33-660362323afa
status: test
description: Adversaries may install a root certificate on a compromised system to avoid warnings when connecting to adversary
  controlled web servers.
references:
- https://www.microsoft.com/security/blog/2022/09/07/profiling-dev-0270-phosphorus-ransomware-operations/
- https://learn.microsoft.com/en-us/powershell/module/pki/import-certificate?view=windowsserver2022-ps
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-09-09
tags:
- attack.defense-impairment
- attack.t1553.004
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.CommandLine|contains|all:
    - Import-Certificate
    - ' -FilePath '
    - Cert:\LocalMachine\Root
    data.CommandLine|contains:
    - \AppData\Local\Temp\
    - :\Windows\TEMP\
    - \Desktop\
    - \Downloads\
    - \Perflogs\
    - :\Users\Public\
  condition: selection
falsepositives:
- Unlikely
level: high
