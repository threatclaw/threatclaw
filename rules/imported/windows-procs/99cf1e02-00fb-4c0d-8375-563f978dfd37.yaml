title: Deny Service Access Using Security Descriptor Tampering Via Sc.EXE
id: 99cf1e02-00fb-4c0d-8375-563f978dfd37
status: test
description: Detects suspicious DACL modifications to deny access to a service that affects critical trustees. This can be
  used to hide services or make them unstoppable.
references:
- https://www.sans.org/blog/red-team-tactics-hiding-windows-services/
- https://itconnect.uw.edu/tools-services-support/it-systems-infrastructure/msinf/other-help/understanding-sddl-syntax/
- https://learn.microsoft.com/en-us/windows/win32/secauthz/sid-strings
author: Jonhnathan Ribeiro, oscd.community
date: 2020-10-16
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1543.003
logsource:
  category: osquery
  product: sysmon
detection:
  selection_sc:
  - Image|endswith: \sc.exe
  - OriginalFileName: sc.exe
  selection_sdset:
    data.CommandLine|contains|all:
    - sdset
    - D;
  selection_trustee:
    data.CommandLine|contains:
    - ;IU
    - ;SU
    - ;BA
    - ;SY
    - ;WD
  condition: all of selection_*
falsepositives:
- Unknown
level: high
