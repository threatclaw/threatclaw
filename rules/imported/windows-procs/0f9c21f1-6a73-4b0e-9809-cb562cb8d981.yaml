title: Potential Privilege Escalation via Service Permissions Weakness
id: 0f9c21f1-6a73-4b0e-9809-cb562cb8d981
status: test
description: Detect modification of services configuration (ImagePath, FailureCommand and ServiceDLL) in registry by processes
  with Medium integrity level
references:
- https://speakerdeck.com/heirhabarov/hunting-for-privilege-escalation-in-windows-environment
- https://pentestlab.blog/2017/03/31/insecure-registry-permissions/
author: Teymur Kheirkhabarov
date: 2019-10-26
tags:
- attack.persistence
- attack.privilege-escalation
- attack.execution
- attack.stealth
- attack.t1574.011
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.IntegrityLevel:
    - Medium
    - S-1-16-8192
    data.CommandLine|contains|all:
    - ControlSet
    - services
    data.CommandLine|contains:
    - \ImagePath
    - \FailureCommand
    - \ServiceDll
  condition: selection
falsepositives:
- Unknown
level: high
