title: Suspicious Child Process of AspNetCompiler
id: 9ccba514-7cb6-4c5c-b377-700758f2f120
status: test
description: Detects potentially suspicious child processes of "aspnet_compiler.exe".
references:
- https://lolbas-project.github.io/lolbas/Binaries/Aspnet_Compiler/
- https://ijustwannared.team/2020/08/01/the-curious-case-of-aspnet_compiler-exe/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-08-14
tags:
- attack.execution
- attack.stealth
- attack.t1127
logsource:
  category: osquery
  product: sysmon
detection:
  selection_parent:
    data.ParentImage|endswith: \aspnet_compiler.exe
  selection_child:
  - Image|endswith:
    - \calc.exe
    - \notepad.exe
  - Image|contains:
    - \Users\Public\
    - \AppData\Local\Temp\
    - \AppData\Local\Roaming\
    - :\Temp\
    - :\Windows\Temp\
    - :\Windows\System32\Tasks\
    - :\Windows\Tasks\
  condition: all of selection_*
falsepositives:
- Unknown
level: high
