title: Invoke-Obfuscation CLIP+ Launcher
id: b222df08-0e07-11eb-adc1-0242ac120002
status: test
description: Detects Obfuscated use of Clip.exe to execute PowerShell
references:
- https://github.com/SigmaHQ/sigma/issues/1009
author: Jonathan Cheong, oscd.community
date: 2020-10-13
tags:
- attack.stealth
- attack.t1027
- attack.execution
- attack.t1059.001
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.CommandLine|contains|all:
    - cmd
    - '&&'
    - 'clipboard]::'
    - -f
    data.CommandLine|contains:
    - /c
    - /r
  condition: selection
falsepositives:
- Unknown
level: high
