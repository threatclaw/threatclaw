title: Suspicious Splwow64 Without Params
id: 1f1a8509-2cbb-44f5-8751-8e1571518ce2
status: test
description: Detects suspicious Splwow64.exe process without any command line parameters
references:
- https://twitter.com/sbousseaden/status/1429401053229891590?s=12
author: Florian Roth (Nextron Systems)
date: 2021-08-23
tags:
- attack.stealth
- attack.t1202
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.Image|endswith: \splwow64.exe
    data.CommandLine|endswith: splwow64.exe
  condition: selection
falsepositives:
- Unknown
level: high
