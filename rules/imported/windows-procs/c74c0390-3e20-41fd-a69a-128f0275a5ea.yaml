title: Cab File Extraction Via Wusa.EXE From Potentially Suspicious Paths
id: c74c0390-3e20-41fd-a69a-128f0275a5ea
status: test
description: 'Detects the execution of the "wusa.exe" (Windows Update Standalone Installer) utility to extract ".cab" files
  using the "/extract" argument from potentially suspicious paths.

  '
references:
- https://web.archive.org/web/20180331144337/https://www.fireeye.com/blog/threat-research/2018/03/sanny-malware-delivery-method-updated-in-recently-observed-attacks.html
- https://www.echotrail.io/insights/search/wusa.exe/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-05
tags:
- attack.execution
logsource:
  category: osquery
  product: sysmon
detection:
  selection_root:
    data.Image|endswith: \wusa.exe
    data.CommandLine|contains: '/extract:'
  selection_paths:
    data.CommandLine|contains:
    - :\PerfLogs\
    - :\Users\Public\
    - :\Windows\Temp\
    - \Appdata\Local\Temp\
  condition: all of selection_*
falsepositives:
- Unknown
level: high
