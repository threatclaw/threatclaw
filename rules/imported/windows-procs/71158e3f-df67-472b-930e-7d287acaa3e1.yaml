title: Execution Of Non-Existing File
id: 71158e3f-df67-472b-930e-7d287acaa3e1
status: test
description: Checks whether the image specified in a process creation event is not a full, absolute path (caused by process
  ghosting or other unorthodox methods to start a process)
references:
- https://pentestlaboratories.com/2021/12/08/process-ghosting/
author: Max Altgelt (Nextron Systems)
date: 2021-12-09
tags:
- attack.stealth
logsource:
  category: osquery
  product: sysmon
detection:
  image_absolute_path:
    data.Image|contains: \
  filter_null:
    data.Image: null
  filter_empty:
    data.Image:
    - '-'
    - ''
  filter_4688:
  - Image:
    - System
    - Registry
    - MemCompression
    - vmmem
  - CommandLine:
    - Registry
    - MemCompression
    - vmmem
  condition: not image_absolute_path and not 1 of filter*
falsepositives:
- Unknown
level: high
