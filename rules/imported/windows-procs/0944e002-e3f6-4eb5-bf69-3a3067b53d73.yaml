title: PowerShell Set-Acl On Windows Folder
id: 0944e002-e3f6-4eb5-bf69-3a3067b53d73
status: test
description: Detects PowerShell scripts to set the ACL to a file in the Windows folder
references:
- https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.security/set-acl?view=powershell-5.1
- https://github.com/redcanaryco/atomic-red-team/blob/74438b0237d141ee9c99747976447dc884cb1a39/atomics/T1505.005/T1505.005.md
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-10-18
tags:
- attack.stealth
logsource:
  category: osquery
  product: sysmon
detection:
  selection_img:
  - OriginalFileName:
    - PowerShell.EXE
    - pwsh.dll
  - Image|endswith:
    - \powershell.exe
    - \pwsh.exe
  selection_cmdlet:
    data.CommandLine|contains|all:
    - 'Set-Acl '
    - '-AclObject '
  selection_paths:
    data.CommandLine|contains:
    - -Path "C:\Windows
    - -Path 'C:\Windows
    - -Path %windir%
    - -Path $env:windir
  selection_permissions:
    data.CommandLine|contains:
    - FullControl
    - Allow
  condition: all of selection_*
falsepositives:
- Unknown
level: high
