title: PrintBrm ZIP Creation of Extraction
id: cafeeba3-01da-4ab4-b6c4-a31b1d9730c7
status: test
description: Detects the execution of the LOLBIN PrintBrm.exe, which can be used to create or extract ZIP files. PrintBrm.exe
  should not be run on a normal workstation.
references:
- https://lolbas-project.github.io/lolbas/Binaries/PrintBrm/
author: frack113
date: 2022-05-02
tags:
- attack.command-and-control
- attack.stealth
- attack.t1105
- attack.t1564.004
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.Image|endswith: \PrintBrm.exe
    data.CommandLine|contains|all:
    - ' -f'
    - .zip
  condition: selection
falsepositives:
- Unknown
level: high
