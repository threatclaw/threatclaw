title: ImagingDevices Unusual Parent/Child Processes
id: f11f2808-adb4-46c0-802a-8660db50fa99
status: test
description: Detects unusual parent or children of the ImagingDevices.exe (Windows Contacts) process as seen being used with
  Bumblebee activity
references:
- https://thedfirreport.com/2022/09/26/bumblebee-round-two/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-09-27
tags:
- attack.execution
- attack.stealth
logsource:
  category: osquery
  product: sysmon
detection:
  selection_parent:
    data.ParentImage|endswith:
    - \WmiPrvSE.exe
    - \svchost.exe
    - \dllhost.exe
    data.Image|endswith: \ImagingDevices.exe
  selection_child:
    data.ParentImage|endswith: \ImagingDevices.exe
  condition: 1 of selection_*
falsepositives:
- Unknown
level: high
