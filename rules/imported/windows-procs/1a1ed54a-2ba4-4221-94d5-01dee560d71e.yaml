title: Renamed CreateDump Utility Execution
id: 1a1ed54a-2ba4-4221-94d5-01dee560d71e
status: test
description: Detects uses of a renamed legitimate createdump.exe LOLOBIN utility to dump process memory
references:
- https://www.crowdstrike.com/blog/overwatch-exposes-aquatic-panda-in-possession-of-log-4-shell-exploit-tools/
- https://twitter.com/bopin2020/status/1366400799199272960
author: Florian Roth (Nextron Systems)
date: 2022-09-20
tags:
- attack.stealth
- attack.t1036
- attack.t1003.001
- attack.credential-access
logsource:
  category: osquery
  product: sysmon
detection:
  selection_pe:
    data.OriginalFileName: FX_VER_INTERNALNAME_STR
  selection_cli:
  - CommandLine|contains|all:
    - ' -u '
    - ' -f '
    - .dmp
  - CommandLine|contains|all:
    - ' --full '
    - ' --name '
    - .dmp
  filter:
    data.Image|endswith: \createdump.exe
  condition: 1 of selection_* and not filter
falsepositives:
- Command lines that use the same flags
level: high
