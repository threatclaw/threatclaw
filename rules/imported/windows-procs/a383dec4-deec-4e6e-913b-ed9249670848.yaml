title: Potential Signing Bypass Via Windows Developer Features
id: a383dec4-deec-4e6e-913b-ed9249670848
status: test
description: Detects when a user enable developer features such as "Developer Mode" or "Application Sideloading". Which allows
  the user to install untrusted packages.
references:
- Internal Research
- https://www.sentinelone.com/labs/inside-malicious-windows-apps-for-malware-deployment/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-11
tags:
- attack.stealth
logsource:
  category: osquery
  product: sysmon
detection:
  selection_img:
  - Image|endswith: \SystemSettingsAdminFlows.exe
  - OriginalFileName: SystemSettingsAdminFlows.EXE
  selection_flag:
    data.CommandLine|contains: TurnOnDeveloperFeatures
  selection_options:
    data.CommandLine|contains:
    - DeveloperUnlock
    - EnableSideloading
  condition: all of selection_*
falsepositives:
- Unknown
level: high
