title: Execution via WorkFolders.exe
id: 0bbc6369-43e3-453d-9944-cae58821c173
status: test
description: Detects using WorkFolders.exe to execute an arbitrary control.exe
references:
- https://twitter.com/elliotkillick/status/1449812843772227588
author: Maxime Thiebaut (@0xThiebaut)
date: 2021-10-21
tags:
- attack.stealth
- attack.t1218
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.Image|endswith: \control.exe
    data.ParentImage|endswith: \WorkFolders.exe
  filter:
    data.Image: C:\Windows\System32\control.exe
  condition: selection and not filter
falsepositives:
- Legitimate usage of the uncommon Windows Work Folders feature.
level: high
