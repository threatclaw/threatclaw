title: File Explorer Folder Opened Using Explorer Folder Shortcut Via Shell
id: c3d76afc-93df-461e-8e67-9b2bad3f2ac4
status: test
description: 'Detects the initial execution of "cmd.exe" which spawns "explorer.exe" with the appropriate command line arguments
  for opening the "My Computer" folder.

  '
references:
- https://ss64.com/nt/shell.html
author: '@Kostastsale'
date: 2022-12-22
tags:
- attack.discovery
- attack.t1135
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.ParentImage|endswith:
    - \cmd.exe
    - \powershell.exe
    - \pwsh.exe
    data.Image|endswith: \explorer.exe
    data.CommandLine|contains: shell:mycomputerfolder
  condition: selection
falsepositives:
- Unknown
level: high
