title: Suspicious Service DACL Modification Via Set-Service Cmdlet
id: a95b9b42-1308-4735-a1af-abb1c5e6f5ac
status: test
description: Detects suspicious DACL modifications via the "Set-Service" cmdlet using the "SecurityDescriptorSddl" flag (Only
  available with PowerShell 7) that can be used to hide services or make them unstopable
references:
- https://www.sans.org/blog/red-team-tactics-hiding-windows-services/
- https://learn.microsoft.com/pt-br/windows/win32/secauthz/sid-strings
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-10-18
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1543.003
logsource:
  category: osquery
  product: sysmon
detection:
  selection_img:
  - Image|endswith: \pwsh.exe
  - OriginalFileName: pwsh.dll
  selection_sddl_flag:
    data.CommandLine|contains:
    - '-SecurityDescriptorSddl '
    - '-sd '
  selection_set_service:
    data.CommandLine|contains|all:
    - 'Set-Service '
    - D;;
    data.CommandLine|contains:
    - ;;;IU
    - ;;;SU
    - ;;;BA
    - ;;;SY
    - ;;;WD
  condition: all of selection_*
falsepositives:
- Unknown
level: high
