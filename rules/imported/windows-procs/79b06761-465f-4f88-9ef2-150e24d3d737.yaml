title: Potential SysInternals ProcDump Evasion
id: 79b06761-465f-4f88-9ef2-150e24d3d737
status: test
description: Detects uses of the SysInternals ProcDump utility in which ProcDump or its output get renamed, or a dump file
  is moved or copied to a different name
references:
- https://twitter.com/mrd0x/status/1480785527901204481
author: Florian Roth (Nextron Systems)
date: 2022-01-11
tags:
- attack.stealth
- attack.t1036
- attack.t1003.001
- attack.credential-access
logsource:
  category: osquery
  product: sysmon
detection:
  selection_1:
    data.CommandLine|contains:
    - copy procdump
    - move procdump
  selection_2:
    data.CommandLine|contains|all:
    - 'copy '
    - '.dmp '
    data.CommandLine|contains:
    - 2.dmp
    - lsass
    - out.dmp
  selection_3:
    data.CommandLine|contains:
    - copy lsass.exe_
    - move lsass.exe_
  condition: 1 of selection_*
falsepositives:
- False positives are expected in cases in which ProcDump just gets copied to a different directory without any renaming
level: high
