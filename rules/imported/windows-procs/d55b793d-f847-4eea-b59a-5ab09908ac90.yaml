title: Suspicious Child Process Of Veeam Dabatase
id: d55b793d-f847-4eea-b59a-5ab09908ac90
status: test
description: Detects suspicious child processes of the Veeam service process. This could indicate potential RCE or SQL Injection.
references:
- https://labs.withsecure.com/publications/fin7-target-veeam-servers
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-05-04
tags:
- attack.initial-access
- attack.persistence
- attack.privilege-escalation
logsource:
  category: osquery
  product: sysmon
detection:
  selection_parent:
    data.ParentImage|endswith: \sqlservr.exe
    data.ParentCommandLine|contains: VEEAMSQL
  selection_child_1:
    data.Image|endswith:
    - \cmd.exe
    - \powershell.exe
    - \pwsh.exe
    - \wsl.exe
    - \wt.exe
    data.CommandLine|contains:
    - '-ex '
    - bypass
    - cscript
    - DownloadString
    - http://
    - https://
    - mshta
    - regsvr32
    - rundll32
    - wscript
    - 'copy '
  selection_child_2:
    data.Image|endswith:
    - \net.exe
    - \net1.exe
    - \netstat.exe
    - \nltest.exe
    - \ping.exe
    - \tasklist.exe
    - \whoami.exe
  condition: selection_parent and 1 of selection_child_*
level: critical
