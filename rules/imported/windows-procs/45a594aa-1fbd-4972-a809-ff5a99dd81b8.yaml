title: Run PowerShell Script from ADS
id: 45a594aa-1fbd-4972-a809-ff5a99dd81b8
status: test
description: Detects PowerShell script execution from Alternate Data Stream (ADS)
references:
- https://github.com/p0shkatz/Get-ADS/blob/1c3a3562e713c254edce1995a7d9879c687c7473/Get-ADS.ps1
author: Sergey Soldatov, Kaspersky Lab, oscd.community
date: 2019-10-30
tags:
- attack.stealth
- attack.t1564.004
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.ParentImage|endswith:
    - \powershell.exe
    - \pwsh.exe
    data.Image|endswith:
    - \powershell.exe
    - \pwsh.exe
    data.CommandLine|contains|all:
    - Get-Content
    - -Stream
  condition: selection
falsepositives:
- Unknown
level: high
