title: Wab/Wabmig Unusual Parent Or Child Processes
id: 63d1ccc0-2a43-4f4b-9289-361b308991ff
status: test
description: Detects unusual parent or children of the wab.exe (Windows Contacts) and Wabmig.exe (Microsoft Address Book Import
  Tool) processes as seen being used with bumblebee activity
references:
- https://thedfirreport.com/2022/08/08/bumblebee-roasts-its-way-to-domain-admin/
- https://symantec-enterprise-blogs.security.com/blogs/threat-intelligence/bumblebee-loader-cybercrime
- https://thedfirreport.com/2022/09/26/bumblebee-round-two/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-12
tags:
- attack.execution
- attack.stealth
logsource:
  category: osquery
  product: sysmon
detection:
  selection_parent:
    data.ParentImage|endswith:
    - \WmiPrvSE.exe
    - \svchost.exe
    - \dllhost.exe
    data.Image|endswith:
    - \wab.exe
    - \wabmig.exe
  selection_child:
    data.ParentImage|endswith:
    - \wab.exe
    - \wabmig.exe
  condition: 1 of selection_*
falsepositives:
- Unknown
level: high
