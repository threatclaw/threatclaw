title: LOL-Binary Copied From System Directory
id: f5d19838-41b5-476c-98d8-ba8af4929ee2
status: test
description: 'Detects a suspicious copy operation that tries to copy a known LOLBIN from system (System32, SysWOW64, WinSxS)
  directories to another on disk in order to bypass detections based on locations.

  '
references:
- https://www.hybrid-analysis.com/sample/8da5b75b6380a41eee3a399c43dfe0d99eeefaa1fd21027a07b1ecaa4cd96fdd?environmentId=120
- https://web.archive.org/web/20180331144337/https://www.fireeye.com/blog/threat-research/2018/03/sanny-malware-delivery-method-updated-in-recently-observed-attacks.html
- https://thedfirreport.com/2023/08/28/html-smuggling-leads-to-domain-wide-ransomware/
- https://www.virustotal.com/gui/file/14e722855605ba78dc1d21153f0e1be90e7528149f2cd2d7d6eba8ef27534bdc/behavior
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-08-29
tags:
- attack.stealth
- attack.t1036.003
logsource:
  category: osquery
  product: sysmon
detection:
  selection_tools_cmd:
    data.Image|endswith: \cmd.exe
    data.CommandLine|contains: 'copy '
  selection_tools_pwsh:
    data.Image|endswith:
    - \powershell.exe
    - \pwsh.exe
    data.CommandLine|contains:
    - copy-item
    - ' copy '
    - 'cpi '
    - ' cp '
  selection_tools_other:
  - Image|endswith:
    - \robocopy.exe
    - \xcopy.exe
  - OriginalFileName:
    - robocopy.exe
    - XCOPY.EXE
  selection_target_path:
    data.CommandLine|contains:
    - \System32
    - \SysWOW64
    - \WinSxS
  selection_target_lolbin:
    data.CommandLine|contains:
    - \bitsadmin.exe
    - \calc.exe
    - \certutil.exe
    - \cmdl32.exe
    - \cscript.exe
    - \mshta.exe
    - \rundll32.exe
    - \wscript.exe
    - \ie4uinit.exe
  condition: 1 of selection_tools_* and all of selection_target_*
falsepositives:
- Unknown
level: high
