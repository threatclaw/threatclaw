title: HackTool - SharpWSUS/WSUSpendu Execution
id: b0ce780f-10bd-496d-9067-066d23dc3aa5
status: test
description: 'Detects the execution of SharpWSUS or WSUSpendu, utilities that allow for lateral movement through WSUS.

  Windows Server Update Services (WSUS) is a critical component of Windows systems and is frequently configured in a way that
  allows an attacker to circumvent internal networking limitations.

  '
references:
- https://labs.nettitude.com/blog/introducing-sharpwsus/
- https://github.com/nettitude/SharpWSUS
- https://web.archive.org/web/20210512154016/https://github.com/AlsidOfficial/WSUSpendu/blob/master/WSUSpendu.ps1
author: '@Kostastsale, Nasreddine Bencherchali (Nextron Systems)'
date: 2022-10-07
tags:
- attack.execution
- attack.lateral-movement
- attack.t1210
logsource:
  category: osquery
  product: sysmon
detection:
  selection_wsuspendu_inject:
    data.CommandLine|contains: ' -Inject '
  selection_wsuspendu_payload:
    data.CommandLine|contains:
    - ' -PayloadArgs '
    - ' -PayloadFile '
  selection_sharpwsus_commands:
    data.CommandLine|contains:
    - ' approve '
    - ' create '
    - ' check '
    - ' delete '
  selection_sharpwsus_flags:
    data.CommandLine|contains:
    - ' /payload:'
    - ' /payload='
    - ' /updateid:'
    - ' /updateid='
  condition: all of selection_wsuspendu_* or all of selection_sharpwsus_*
falsepositives:
- Unknown
level: high
