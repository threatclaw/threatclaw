title: SQLite Chromium Profile Data DB Access
id: 24c77512-782b-448a-8950-eddb0785fc71
status: test
description: Detect usage of the "sqlite" binary to query databases in Chromium-based browsers for potential data stealing.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/84d9edaaaa2c5511144521b0e4af726d1c7276ce/atomics/T1539/T1539.md#atomic-test-2---steal-chrome-cookies-windows
- https://blog.cyble.com/2022/04/21/prynt-stealer-a-new-info-stealer-performing-clipper-and-keylogger-activities/
author: TropChaud
date: 2022-12-19
tags:
- attack.credential-access
- attack.t1539
- attack.t1555.003
- attack.collection
- attack.t1005
logsource:
  category: osquery
  product: sysmon
detection:
  selection_sql:
  - Product: SQLite
  - Image|endswith:
    - \sqlite.exe
    - \sqlite3.exe
  selection_chromium:
    data.CommandLine|contains:
    - \User Data\
    - \Opera Software\
    - \ChromiumViewer\
  selection_data:
    data.CommandLine|contains:
    - Login Data
    - Cookies
    - Web Data
    - History
    - Bookmarks
  condition: all of selection_*
falsepositives:
- Unknown
level: high
