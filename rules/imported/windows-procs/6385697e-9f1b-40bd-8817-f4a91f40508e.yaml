title: PowerShell Base64 Encoded Invoke Keyword
id: 6385697e-9f1b-40bd-8817-f4a91f40508e
status: test
description: Detects UTF-8 and UTF-16 Base64 encoded powershell 'Invoke-' calls
references:
- https://thedfirreport.com/2022/05/09/seo-poisoning-a-gootloader-story/
author: pH-T (Nextron Systems), Harjot Singh, @cyb3rjy0t
date: 2022-05-20
tags:
- attack.execution
- attack.stealth
- attack.t1059.001
- attack.t1027
logsource:
  category: osquery
  product: sysmon
detection:
  selection_img:
  - Image|endswith:
    - \powershell.exe
    - \pwsh.exe
  - OriginalFileName:
    - PowerShell.EXE
    - pwsh.dll
  selection_cli_enc:
    data.CommandLine|contains: ' -e'
  selection_cli_invoke:
    data.CommandLine|contains:
    - SQBuAHYAbwBrAGUALQ
    - kAbgB2AG8AawBlAC0A
    - JAG4AdgBvAGsAZQAtA
    - SW52b2tlL
    - ludm9rZS
    - JbnZva2Ut
  condition: all of selection_*
falsepositives:
- Unknown
level: high
