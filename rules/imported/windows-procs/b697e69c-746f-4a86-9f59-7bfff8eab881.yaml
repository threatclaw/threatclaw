title: UAC Bypass Using Disk Cleanup
id: b697e69c-746f-4a86-9f59-7bfff8eab881
status: test
description: Detects the pattern of UAC Bypass using scheduled tasks and variable expansion of cleanmgr.exe (UACMe 34)
references:
- https://github.com/hfiref0x/UACME
author: Christian Burkard (Nextron Systems)
date: 2021-08-30
tags:
- attack.privilege-escalation
- attack.t1548.002
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.CommandLine|endswith: '"\system32\cleanmgr.exe /autoclean /d C:'
    data.ParentCommandLine: C:\Windows\system32\svchost.exe -k netsvcs -p -s Schedule
    data.IntegrityLevel:
    - High
    - System
    - S-1-16-16384
    - S-1-16-12288
  condition: selection
falsepositives:
- Unknown
level: high
