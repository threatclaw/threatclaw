title: Potential CommandLine Obfuscation Using Unicode Characters From Suspicious Image
id: 584bca0f-3608-4402-80fd-4075ff6072e3
status: test
description: 'Detects potential commandline obfuscation using unicode characters.

  Adversaries may attempt to make an executable or file difficult to discover or analyze by encrypting, encoding, or otherwise
  obfuscating its contents on the system or in transit.

  '
references:
- https://www.wietzebeukema.nl/blog/windows-command-line-obfuscation
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1027/T1027.md#atomic-test-6---dlp-evasion-via-sensitive-data-in-vba-macro-over-http
author: frack113, Florian Roth (Nextron Systems), Josh Nickels
date: 2024-09-02
tags:
- attack.stealth
- attack.t1027
logsource:
  category: osquery
  product: sysmon
detection:
  selection_img:
    data.Image|endswith:
    - \cmd.exe
    - \cscript.exe
    - \powershell.exe
    - \powershell_ise.exe
    - \pwsh.exe
    - \wscript.exe
    data.OriginalFileName:
    - Cmd.EXE
    - cscript.exe
    - PowerShell.EXE
    - PowerShell_ISE.EXE
    - pwsh.dll
    - wscript.exe
  selection_special_chars:
    data.CommandLine|contains:
    - ˣ
    - ˪
    - ˢ
    - ∕
    - ⁄
    - ―
    - —
    -  
    - ¯
    - ®
    - ¶
    - ⠀
  condition: all of selection_*
falsepositives:
- Unknown
level: high
