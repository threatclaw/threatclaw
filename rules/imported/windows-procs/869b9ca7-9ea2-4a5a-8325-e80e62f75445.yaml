title: Suspicious Child Process Of SQL Server
id: 869b9ca7-9ea2-4a5a-8325-e80e62f75445
status: test
description: Detects suspicious child processes of the SQLServer process. This could indicate potential RCE or SQL Injection.
references:
- Internal Research
author: FPT.EagleEye Team, wagga
date: 2020-12-11
tags:
- attack.t1505.003
- attack.t1190
- attack.initial-access
- attack.persistence
- attack.privilege-escalation
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.ParentImage|endswith: \sqlservr.exe
    data.Image|endswith:
    - \bash.exe
    - \bitsadmin.exe
    - \cmd.exe
    - \netstat.exe
    - \nltest.exe
    - \ping.exe
    - \powershell.exe
    - \pwsh.exe
    - \regsvr32.exe
    - \rundll32.exe
    - \sh.exe
    - \systeminfo.exe
    - \tasklist.exe
    - \wsl.exe
  filter_optional_datev:
    data.ParentImage|startswith: C:\Program Files\Microsoft SQL Server\
    data.ParentImage|endswith: DATEV_DBENGINE\MSSQL\Binn\sqlservr.exe
    data.Image: C:\Windows\System32\cmd.exe
    data.CommandLine|startswith: '"C:\Windows\system32\cmd.exe" '
  condition: selection and not 1 of filter_optional_*
level: high
