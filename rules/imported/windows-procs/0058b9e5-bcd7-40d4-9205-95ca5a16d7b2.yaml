title: UAC Bypass Using Windows Media Player - Process
id: 0058b9e5-bcd7-40d4-9205-95ca5a16d7b2
status: test
description: Detects the pattern of UAC Bypass using Windows Media Player osksupport.dll (UACMe 32)
references:
- https://github.com/hfiref0x/UACME
author: Christian Burkard (Nextron Systems)
date: 2021-08-23
tags:
- attack.privilege-escalation
- attack.t1548.002
logsource:
  category: osquery
  product: sysmon
detection:
  selection_img_1:
    data.Image: C:\Program Files\Windows Media Player\osk.exe
  selection_img_2:
    data.Image: C:\Windows\System32\cmd.exe
    data.ParentCommandLine: '"C:\Windows\system32\mmc.exe" "C:\Windows\system32\eventvwr.msc" /s'
  selection_integrity:
    data.IntegrityLevel:
    - High
    - System
    - S-1-16-16384
    - S-1-16-12288
  condition: 1 of selection_img_* and selection_integrity
falsepositives:
- Unknown
level: high
