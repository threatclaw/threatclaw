title: Potential LethalHTA Technique Execution
id: ed5d72a6-f8f4-479d-ba79-02f6a80d7471
status: test
description: Detects potential LethalHTA technique where the "mshta.exe" is spawned by an "svchost.exe" process
references:
- https://codewhitesec.blogspot.com/2018/07/lethalhta.html
author: Markus Neis
date: 2018-06-07
tags:
- attack.stealth
- attack.t1218.005
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.ParentImage|endswith: \svchost.exe
    data.Image|endswith: \mshta.exe
  condition: selection
falsepositives:
- Unknown
level: high
