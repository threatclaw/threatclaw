title: Python Function Execution Security Warning Disabled In Excel
id: 023c654f-8f16-44d9-bb2b-00ff36a62af9
status: test
description: 'Detects changes to the registry value "PythonFunctionWarnings" that would prevent any warnings or alerts from
  showing when Python functions are about to be executed.

  Threat actors could run malicious code through the new Microsoft Excel feature that allows Python to run within the spreadsheet.

  '
references:
- https://support.microsoft.com/en-us/office/data-security-and-python-in-excel-33cc88a4-4a87-485e-9ff9-f35958278327
author: '@Kostastsale'
date: 2023-08-22
tags:
- attack.defense-impairment
- attack.t1685
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.CommandLine|contains|all:
    - \Microsoft\Office\
    - \Excel\Security
    - PythonFunctionWarnings
    data.CommandLine|contains: ' 0'
  condition: selection
falsepositives:
- Unknown
level: high
