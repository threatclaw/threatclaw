title: Suspicious Schtasks Execution AppData Folder
id: c5c00f49-b3f9-45a6-997e-cfdecc6e1967
status: test
description: Detects the creation of a schtask that executes a file from C:\Users\<USER>\AppData\Local
references:
- https://thedfirreport.com/2022/02/21/qbot-and-zerologon-lead-to-full-domain-compromise/
author: pH-T (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
date: 2022-03-15
tags:
- attack.privilege-escalation
- attack.execution
- attack.persistence
- attack.t1053.005
- attack.t1059.001
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.Image|endswith: \schtasks.exe
    data.CommandLine|contains|all:
    - /Create
    - /RU
    - /TR
    - C:\Users\
    - \AppData\Local\
    data.CommandLine|contains:
    - NT AUT
    - ' SYSTEM '
  filter:
    data.ParentImage|contains|all:
    - \AppData\Local\Temp\
    - TeamViewer_.exe
    data.Image|endswith: \schtasks.exe
    data.CommandLine|contains: /TN TVInstallRestore
  condition: selection and not filter
falsepositives:
- Unknown
level: high
