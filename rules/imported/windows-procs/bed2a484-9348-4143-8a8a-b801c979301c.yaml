title: Webshell Detection With Command Line Keywords
id: bed2a484-9348-4143-8a8a-b801c979301c
status: test
description: Detects certain command line parameters often used during reconnaissance activity via web shells
references:
- https://www.fireeye.com/blog/threat-research/2013/08/breaking-down-the-china-chopper-web-shell-part-ii.html
- https://unit42.paloaltonetworks.com/bumblebee-webshell-xhunt-campaign/
- https://www.huntress.com/blog/threat-advisory-oh-no-cleo-cleo-software-actively-being-exploited-in-the-wild
author: Florian Roth (Nextron Systems), Jonhnathan Ribeiro, Anton Kutepov, oscd.community, Chad Hudson, Matt Anderson
date: 2017-01-01
tags:
- attack.persistence
- attack.discovery
- attack.t1505.003
- attack.t1018
- attack.t1033
- attack.t1087
logsource:
  category: osquery
  product: sysmon
detection:
  selection_webserver_image:
    data.ParentImage|endswith:
    - \w3wp.exe
    - \php-cgi.exe
    - \nginx.exe
    - \httpd.exe
    - \caddy.exe
    - \ws_tomcatservice.exe
  selection_webserver_characteristics_tomcat1:
    data.ParentImage|endswith:
    - \java.exe
    - \javaw.exe
    data.ParentImage|contains:
    - -tomcat-
    - \tomcat
  selection_webserver_characteristics_tomcat2:
    data.ParentImage|endswith:
    - \java.exe
    - \javaw.exe
    data.CommandLine|contains:
    - catalina.jar
    - CATALINA_HOME
  selection_susp_net_utility:
    data.OriginalFileName:
    - net.exe
    - net1.exe
    data.CommandLine|contains:
    - ' user '
    - ' use '
    - ' group '
  selection_susp_ping_utility:
    data.OriginalFileName: ping.exe
    data.CommandLine|contains: ' -n '
  selection_susp_change_dir:
    data.CommandLine|contains:
    - '&cd&echo'
    - 'cd /d '
  selection_susp_wmic_utility:
    data.OriginalFileName: wmic.exe
    data.CommandLine|contains: ' /node:'
  selection_susp_powershell_cli:
    data.Image|endswith:
    - \cmd.exe
    - \powershell.exe
    - \pwsh.exe
    data.CommandLine|contains:
    - ' -enc '
    - ' -EncodedCommand '
    - ' -w hidden '
    - ' -windowstyle hidden'
    - .WebClient).Download
  selection_susp_misc_discovery_binaries:
  - Image|endswith:
    - \dsquery.exe
    - \find.exe
    - \findstr.exe
    - \ipconfig.exe
    - \netstat.exe
    - \nslookup.exe
    - \pathping.exe
    - \quser.exe
    - \schtasks.exe
    - \systeminfo.exe
    - \tasklist.exe
    - \tracert.exe
    - \ver.exe
    - \wevtutil.exe
    - \whoami.exe
  - OriginalFileName:
    - dsquery.exe
    - find.exe
    - findstr.exe
    - ipconfig.exe
    - netstat.exe
    - nslookup.exe
    - pathping.exe
    - quser.exe
    - schtasks.exe
    - sysinfo.exe
    - tasklist.exe
    - tracert.exe
    - ver.exe
    - VSSADMIN.EXE
    - wevtutil.exe
    - whoami.exe
  selection_susp_misc_discovery_commands:
    data.CommandLine|contains:
    - ' Test-NetConnection '
    - dir \
  condition: 1 of selection_webserver_* and 1 of selection_susp_*
falsepositives:
- Unknown
level: high
