title: Suspicious Explorer Process with Whitespace Padding - ClickFix/FileFix
id: 3ae9974a-eb09-4044-8e70-8980a50c12c8
status: experimental
description: 'Detects process creation with suspicious whitespace padding followed by a ''#'' character, which may indicate
  ClickFix or FileFix techniques used to conceal malicious commands from visual inspection.

  ClickFix and FileFix are social engineering attack techniques where adversaries distribute phishing documents or malicious
  links that deceive users into opening the Windows Run dialog box or File Explorer search bar.

  The victims are then instructed to paste commands from their clipboard, which contain extensive whitespace padding using
  various Unicode space characters to push the actual malicious command far to the right, effectively hiding it from immediate
  view.

  '
references:
- https://expel.com/blog/cache-smuggling-when-a-picture-isnt-a-thousand-words/
- https://mrd0x.com/filefix-clickfix-alternative/
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-11-04
tags:
- attack.execution
- attack.stealth
- attack.t1204.004
- attack.t1027.010
logsource:
  category: osquery
  product: sysmon
detection:
  selection_explorer:
    data.ParentImage|endswith: \explorer.exe
    data.CommandLine|contains: '#'
  selection_space_variation:
    data.CommandLine|contains:
    -             
    -             
    -             
    -             
    -             
    -             
    -             
    -             
    -             
    -             
    -             
    -             
    - '            '
  condition: all of selection_*
falsepositives:
- Unknown
level: high
