title: Suspicious Usage Of ShellExec_RunDLL
id: d87bd452-6da1-456e-8155-7dc988157b7d
status: test
description: Detects suspicious usage of the ShellExec_RunDLL function to launch other commands as seen in the the raspberry-robin
  attack
references:
- https://redcanary.com/blog/raspberry-robin/
- https://www.microsoft.com/en-us/security/blog/2022/10/27/raspberry-robin-worm-part-of-larger-ecosystem-facilitating-pre-ransomware-activity/
- https://github.com/SigmaHQ/sigma/issues/1009
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-09-01
tags:
- attack.stealth
logsource:
  category: osquery
  product: sysmon
detection:
  selection_openasrundll:
    data.CommandLine|contains: ShellExec_RunDLL
  selection_suspcli:
    data.CommandLine|contains:
    - \Desktop\
    - \Temp\
    - \Users\Public\
    - comspec
    - iex
    - Invoke-
    - msiexec
    - odbcconf
    - regsvr32
  condition: all of selection_*
falsepositives:
- Unknown
level: high
