title: PUA - 3Proxy Execution
id: f38a82d2-fba3-4781-b549-525efbec8506
status: test
description: Detects the use of 3proxy, a tiny free proxy server
references:
- https://github.com/3proxy/3proxy
- https://blog.talosintelligence.com/2022/09/lazarus-three-rats.html
author: Florian Roth (Nextron Systems)
date: 2022-09-13
tags:
- attack.command-and-control
- attack.t1572
logsource:
  category: osquery
  product: sysmon
detection:
  selection_img:
    data.Image|endswith: \3proxy.exe
  selection_pe:
    data.Description: 3proxy - tiny proxy server
  selection_params:
    data.CommandLine|contains: .exe -i127.0.0.1 -p
  condition: 1 of selection_*
falsepositives:
- Administrative activity
level: high
