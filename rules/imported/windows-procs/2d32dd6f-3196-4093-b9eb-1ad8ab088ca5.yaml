title: Suspicious Response File Execution Via Odbcconf.EXE
id: 2d32dd6f-3196-4093-b9eb-1ad8ab088ca5
status: test
description: Detects execution of "odbcconf" with the "-f" flag in order to load a response file with a non-".rsp" extension.
references:
- https://learn.microsoft.com/en-us/sql/odbc/odbcconf-exe?view=sql-server-ver16
- https://lolbas-project.github.io/lolbas/Binaries/Odbcconf/
- https://www.trendmicro.com/en_us/research/17/h/backdoor-carrying-emails-set-sights-on-russian-speaking-businesses.html
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-05-22
tags:
- attack.stealth
- attack.t1218.008
logsource:
  category: osquery
  product: sysmon
detection:
  selection_img:
  - Image|endswith: \odbcconf.exe
  - OriginalFileName: odbcconf.exe
  selection_cli:
    data.CommandLine|contains: ' -f '
  filter_main_rsp_ext:
    data.CommandLine|contains: .rsp
  filter_main_runonce_odbc:
    data.ParentImage: C:\Windows\System32\runonce.exe
    data.Image: C:\Windows\System32\odbcconf.exe
    data.CommandLine|contains: .exe /E /F "C:\WINDOWS\system32\odbcconf.tmp"
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Unlikely
level: high
