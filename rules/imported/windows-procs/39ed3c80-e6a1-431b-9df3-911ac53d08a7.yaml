title: UAC Bypass Using NTFS Reparse Point - Process
id: 39ed3c80-e6a1-431b-9df3-911ac53d08a7
status: test
description: Detects the pattern of UAC Bypass using NTFS reparse point and wusa.exe DLL hijacking (UACMe 36)
references:
- https://github.com/hfiref0x/UACME
author: Christian Burkard (Nextron Systems)
date: 2021-08-30
tags:
- attack.privilege-escalation
- attack.t1548.002
logsource:
  category: osquery
  product: sysmon
detection:
  selection1:
    data.CommandLine|startswith: '"C:\Windows\system32\wusa.exe"  /quiet C:\Users\'
    data.CommandLine|endswith: \AppData\Local\Temp\update.msu
    data.IntegrityLevel:
    - High
    - System
    - S-1-16-16384
    - S-1-16-12288
  selection2:
    data.ParentCommandLine: '"C:\Windows\system32\dism.exe" /online /quiet /norestart /add-package /packagepath:"C:\Windows\system32\pe386"
      /ignorecheck'
    data.IntegrityLevel:
    - High
    - System
    data.CommandLine|contains|all:
    - C:\Users\
    - \AppData\Local\Temp\
    - \dismhost.exe {
    data.Image|endswith: \DismHost.exe
  condition: 1 of selection*
falsepositives:
- Unknown
level: high
