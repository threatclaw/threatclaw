title: Python Spawning Pretty TTY on Windows
id: 480e7e51-e797-47e3-8d72-ebfce65b6d8d
status: test
description: Detects python spawning a pretty tty
references:
- https://www.volexity.com/blog/2022/06/02/zero-day-exploitation-of-atlassian-confluence/
author: Nextron Systems
date: 2022-06-03
tags:
- attack.execution
- attack.t1059
logsource:
  category: osquery
  product: sysmon
detection:
  selection_img:
    data.Image|endswith:
    - python.exe
    - python3.exe
    - python2.exe
  selection_cli_1:
    data.CommandLine|contains|all:
    - import pty
    - .spawn(
  selection_cli_2:
    data.CommandLine|contains: from pty import spawn
  condition: selection_img and 1 of selection_cli_*
falsepositives:
- Unknown
level: high
