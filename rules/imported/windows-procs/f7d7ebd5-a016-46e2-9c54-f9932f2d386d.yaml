title: Potential RDP Tunneling Via SSH
id: f7d7ebd5-a016-46e2-9c54-f9932f2d386d
status: test
description: Execution of ssh.exe to perform data exfiltration and tunneling through RDP
references:
- https://www.absolomb.com/2018-01-26-Windows-Privilege-Escalation-Guide/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-10-12
tags:
- attack.command-and-control
- attack.t1572
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.Image|endswith: \ssh.exe
    data.CommandLine|contains: :3389
  condition: selection
falsepositives:
- Unknown
level: high
