title: Regedit as Trusted Installer
id: 883835a7-df45-43e4-bf1d-4268768afda4
status: test
description: Detects a regedit started with TrustedInstaller privileges or by ProcessHacker.exe
references:
- https://twitter.com/1kwpeter/status/1397816101455765504
author: Florian Roth (Nextron Systems)
date: 2021-05-27
tags:
- attack.privilege-escalation
- attack.t1548
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.Image|endswith: \regedit.exe
    data.ParentImage|endswith:
    - \TrustedInstaller.exe
    - \ProcessHacker.exe
  condition: selection
falsepositives:
- Unlikely
level: high
