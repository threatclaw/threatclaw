title: DumpStack.log Defender Evasion
id: 4f647cfa-b598-4e12-ad69-c68dd16caef8
status: test
description: Detects the use of the filename DumpStack.log to evade Microsoft Defender
references:
- https://twitter.com/mrd0x/status/1479094189048713219
author: Florian Roth (Nextron Systems)
date: 2022-01-06
tags:
- attack.defense-impairment
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.Image|endswith: \DumpStack.log
  selection_download:
    data.CommandLine|contains: ' -o DumpStack.log'
  condition: 1 of selection*
falsepositives:
- Unknown
level: critical
