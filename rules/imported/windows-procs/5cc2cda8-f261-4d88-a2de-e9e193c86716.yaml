title: Suspicious Processes Spawned by WinRM
id: 5cc2cda8-f261-4d88-a2de-e9e193c86716
status: test
description: Detects suspicious processes including shells spawnd from WinRM host process
references:
- Internal Research
author: Andreas Hunkeler (@Karneades), Markus Neis
date: 2021-05-20
tags:
- attack.t1190
- attack.initial-access
- attack.persistence
- attack.privilege-escalation
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.ParentImage|endswith: \wsmprovhost.exe
    data.Image|endswith:
    - \cmd.exe
    - \sh.exe
    - \bash.exe
    - \powershell.exe
    - \pwsh.exe
    - \wsl.exe
    - \schtasks.exe
    - \certutil.exe
    - \whoami.exe
    - \bitsadmin.exe
  condition: selection
falsepositives:
- Legitimate WinRM usage
level: high
