title: User Shell Folders Registry Modification via CommandLine
id: 8f3ab69a-aa22-4943-aa58-e0a52fdf6818
status: experimental
description: 'Detects modifications to User Shell Folders registry values via reg.exe or PowerShell, which could indicate
  persistence attempts.

  Attackers may modify User Shell Folders registry values to point to malicious executables or scripts that will be executed
  during startup.

  This technique is often used to maintain persistence on a compromised system by ensuring that malicious payloads are executed
  automatically.

  '
references:
- https://www.welivesecurity.com/en/eset-research/muddywater-snakes-riverbank/
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2026-01-05
tags:
- attack.persistence
- attack.privilege-escalation
- attack.defense-impairment
- attack.t1547.001
- attack.t1112
logsource:
  category: osquery
  product: sysmon
detection:
  selection_img:
  - Image|endswith:
    - \powershell.exe
    - \pwsh.exe
    - \reg.exe
  - OriginalFileName:
    - powershell.exe
    - pwsh.dll
    - reg.exe
  selection_cli_action:
    data.CommandLine|contains:
    - ' add '
    - New-ItemProperty
    - Set-ItemProperty
    - 'si '
  selection_cli_paths_root:
    data.CommandLine|contains:
    - \Software\Microsoft\Windows\CurrentVersion\Explorer\Shell Folders
    - \Software\Microsoft\Windows\CurrentVersion\Explorer\User Shell Folders
  selection_cli_paths_suffix:
    data.CommandLine|contains: Startup
  condition: all of selection_*
falsepositives:
- Usage of reg.exe or PowerShell to modify User Shell Folders for legitimate purposes; but rare.
level: high
