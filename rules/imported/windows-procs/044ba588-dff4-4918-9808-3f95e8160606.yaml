title: Copy .DMP/.DUMP Files From Remote Share Via Cmd.EXE
id: 044ba588-dff4-4918-9808-3f95e8160606
status: test
description: Detects usage of the copy builtin cmd command to copy files with the ".dmp"/".dump" extension from a remote share
references:
- https://thedfirreport.com/2022/09/26/bumblebee-round-two/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-09-27
tags:
- attack.credential-access
logsource:
  category: osquery
  product: sysmon
detection:
  selection_img:
  - Image|endswith: \cmd.exe
  - OriginalFileName: Cmd.Exe
  selection_cli:
    data.CommandLine|contains|all:
    - 'copy '
    - ' \\\\'
    data.CommandLine|contains:
    - .dmp
    - .dump
    - .hdmp
  condition: all of selection_*
falsepositives:
- Unknown
level: high
