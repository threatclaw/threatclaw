title: Windows Shell/Scripting Processes Spawning Suspicious Programs
id: 3a6586ad-127a-4d3b-a677-1e6eacdf8fde
status: test
description: Detects suspicious child processes of a Windows shell and scripting processes such as wscript, rundll32, powershell,
  mshta...etc.
references:
- https://mgreen27.github.io/posts/2018/04/02/DownloadCradle.html
author: Florian Roth (Nextron Systems), Tim Shelton
date: 2018-04-06
tags:
- attack.execution
- attack.stealth
- attack.t1059.005
- attack.t1059.001
- attack.t1218
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.ParentImage|endswith:
    - \mshta.exe
    - \powershell.exe
    - \pwsh.exe
    - \rundll32.exe
    - \cscript.exe
    - \wscript.exe
    - \wmiprvse.exe
    - \regsvr32.exe
    data.Image|endswith:
    - \schtasks.exe
    - \nslookup.exe
    - \certutil.exe
    - \bitsadmin.exe
    - \mshta.exe
  filter_ccmcache:
    data.CurrentDirectory|contains: \ccmcache\
  filter_amazon:
    data.ParentCommandLine|contains:
    - \Program Files\Amazon\WorkSpacesConfig\Scripts\setup-scheduledtask.ps1
    - \Program Files\Amazon\WorkSpacesConfig\Scripts\set-selfhealing.ps1
    - \Program Files\Amazon\WorkSpacesConfig\Scripts\check-workspacehealth.ps1
    - \nessus_
  filter_nessus:
    data.CommandLine|contains: \nessus_
  filter_sccm_install:
    data.ParentImage|endswith: \mshta.exe
    data.Image|endswith: \mshta.exe
    data.ParentCommandLine|contains|all:
    - C:\MEM_Configmgr_
    - \splash.hta
    - '{1E460BD7-F1C3-4B2E-88BF-4E770A288AF5}'
    data.CommandLine|contains|all:
    - C:\MEM_Configmgr_
    - \SMSSETUP\BIN\
    - \autorun.hta
    - '{1E460BD7-F1C3-4B2E-88BF-4E770A288AF5}'
  condition: selection and not 1 of filter_*
falsepositives:
- Administrative scripts
- Microsoft SCCM
level: high
