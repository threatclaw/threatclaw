title: Suspicious PowerShell Parent Process
id: 754ed792-634f-40ae-b3bc-e0448d33f695
status: test
description: Detects a suspicious or uncommon parent processes of PowerShell
references:
- https://speakerdeck.com/heirhabarov/hunting-for-powershell-abuse?slide=26
author: Teymur Kheirkhabarov, Harish Segar
date: 2020-03-20
tags:
- attack.execution
- attack.t1059.001
logsource:
  category: osquery
  product: sysmon
detection:
  selection_parent:
  - ParentImage|contains: tomcat
  - ParentImage|endswith:
    - \amigo.exe
    - \browser.exe
    - \chrome.exe
    - \firefox.exe
    - \httpd.exe
    - \iexplore.exe
    - \jbosssvc.exe
    - \microsoftedge.exe
    - \microsoftedgecp.exe
    - \MicrosoftEdgeSH.exe
    - \mshta.exe
    - \nginx.exe
    - \outlook.exe
    - \php-cgi.exe
    - \regsvr32.exe
    - \rundll32.exe
    - \safari.exe
    - \services.exe
    - \sqlagent.exe
    - \sqlserver.exe
    - \sqlservr.exe
    - \vivaldi.exe
    - \w3wp.exe
  selection_powershell:
  - Image|endswith:
    - \powershell.exe
    - \pwsh.exe
  - CommandLine|contains:
    - /c powershell
    - /c pwsh
  - Description: Windows PowerShell
  - Product: PowerShell Core 6
  - OriginalFileName:
    - PowerShell.EXE
    - pwsh.dll
  condition: all of selection_*
falsepositives:
- Other scripts
level: high
