title: Suspicious Scheduled Task Creation Involving Temp Folder
id: 39019a4e-317f-4ce3-ae63-309a8c6b53c5
status: test
description: Detects the creation of scheduled tasks that involves a temporary folder and runs only once
references:
- https://discuss.elastic.co/t/detection-and-response-for-hafnium-activity/266289/3
author: Florian Roth (Nextron Systems)
date: 2021-03-11
tags:
- attack.privilege-escalation
- attack.execution
- attack.persistence
- attack.t1053.005
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.Image|endswith: \schtasks.exe
    data.CommandLine|contains|all:
    - ' /create '
    - ' /sc once '
    - \Temp\
  condition: selection
falsepositives:
- Administrative activity
- Software installation
level: high
