title: Forfiles.EXE Child Process Masquerading
id: f53714ec-5077-420e-ad20-907ff9bb2958
status: test
description: 'Detects the execution of "forfiles" from a non-default location, in order to potentially spawn a custom "cmd.exe"
  from the current working directory.

  '
references:
- https://www.hexacorn.com/blog/2023/12/31/1-little-known-secret-of-forfiles-exe/
author: Nasreddine Bencherchali (Nextron Systems), Anish Bogati
date: 2024-01-05
tags:
- attack.stealth
- attack.t1036
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.ParentCommandLine|endswith:
    - .exe
    - .exe"
    data.Image|endswith: \cmd.exe
    data.CommandLine|startswith: /c echo "
  filter_main_parent_not_sys:
    data.ParentImage|contains:
    - :\Windows\System32\
    - :\Windows\SysWOW64\
    data.ParentImage|endswith: \forfiles.exe
    data.Image|contains:
    - :\Windows\System32\
    - :\Windows\SysWOW64\
    data.Image|endswith: \cmd.exe
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
