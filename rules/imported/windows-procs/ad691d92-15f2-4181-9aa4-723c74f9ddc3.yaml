title: Potential Defense Evasion Via Right-to-Left Override
id: ad691d92-15f2-4181-9aa4-723c74f9ddc3
status: test
description: 'Detects the presence of the "u202+E" character, which causes a terminal, browser, or operating system to render
  text in a right-to-left sequence.

  This character is used as an obfuscation and masquerading techniques by adversaries to trick users into opening malicious
  files.

  '
references:
- https://redcanary.com/blog/right-to-left-override/
- https://www.malwarebytes.com/blog/news/2014/01/the-rtlo-method
- https://unicode-explorer.com/c/202E
- https://tria.ge/241015-l98snsyeje/behavioral2
- https://unprotect.it/technique/right-to-left-override-rlo-extension-spoofing/
author: Micah Babinski, @micahbabinski, Swachchhanda Shrawan Poudel (Nextron Systems), Luc Génaux
date: 2023-02-15
tags:
- attack.stealth
- attack.t1036.002
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.CommandLine|contains:
    - \u202e
    - '[U+202E]'
    - ‮
  condition: selection
falsepositives:
- Commandlines that contains scriptures such as arabic or hebrew might make use of this character
level: high
