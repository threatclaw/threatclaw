title: Modify User Shell Folders Startup Value
id: 9c226817-8dc9-46c2-a58d-66655aafd7dc
status: test
description: 'Detect modification of the User Shell Folders registry values for Startup or Common Startup which could indicate
  persistence attempts.

  Attackers may modify User Shell Folders registry keys to point to malicious executables or scripts that will be executed
  during startup.

  This technique is often used to maintain persistence on a compromised system by ensuring that the malicious payload is executed
  automatically.

  '
references:
- https://github.com/redcanaryco/atomic-red-team/blob/9e5b12c4912c07562aec7500447b11fa3e17e254/atomics/T1547.001/T1547.001.md
- https://www.welivesecurity.com/en/eset-research/muddywater-snakes-riverbank/
author: frack113, Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2022-10-01
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1547.001
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.TargetObject|contains:
    - SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\User Shell Folders
    - SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Shell Folders
    data.TargetObject|endswith:
    - \Common Startup
    - \Startup
  filter_main_details_null:
    data.Details: null
  filter_main_programdata_startup:
    data.Details|contains:
    - C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Startup
    - '%ProgramData%\Microsoft\Windows\Start Menu\Programs\Startup'
  filter_main_userprofile_startup_1:
    data.Details|contains:
    - '%USERPROFILE%\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup'
    - '%%USERPROFILE%%\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup'
  filter_main_userprofile_startup_2:
    data.Details|contains|all:
    - C:\Users\
    - \AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
