title: Windows Binaries Write Suspicious Extensions
id: b8fd0e93-ff58-4cbd-8f48-1c114e342e62
status: test
description: Detects Windows executables that write files with suspicious extensions
references:
- Internal Research
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-12
tags:
- attack.stealth
- attack.t1036
logsource:
  category: osquery
  product: sysmon
detection:
  selection_generic:
    data.Image|endswith:
    - \csrss.exe
    - \lsass.exe
    - \RuntimeBroker.exe
    - \sihost.exe
    - \smss.exe
    - \wininit.exe
    - \winlogon.exe
    data.TargetFilename|endswith:
    - .bat
    - .dll
    - .exe
    - .hta
    - .iso
    - .ps1
    - .txt
    - .vbe
    - .vbs
  selection_special:
    data.Image|endswith:
    - \dllhost.exe
    - \rundll32.exe
    - \svchost.exe
    data.TargetFilename|endswith:
    - .bat
    - .hta
    - .iso
    - .ps1
    - .vbe
    - .vbs
  filter_main_AppLockerPolicyTest:
    data.Image: C:\Windows\System32\dllhost.exe
    data.TargetFilename|contains|all:
    - :\Users\
    - \AppData\Local\Temp\__PSScriptPolicyTest_
    data.TargetFilename|endswith: .ps1
  filter_main_script_gpo_machine:
    data.Image: C:\Windows\system32\svchost.exe
    data.TargetFilename|contains|all:
    - C:\Windows\System32\GroupPolicy\DataStore\
    - \sysvol\
    - \Policies\
    - \Machine\Scripts\Startup\
    data.TargetFilename|endswith:
    - .ps1
    - .bat
  filter_main_clipchamp:
    data.Image: C:\Windows\system32\svchost.exe
    data.TargetFilename|contains|all:
    - C:\Program Files\WindowsApps\Clipchamp
    - .ps1
  filter_main_powershell_preview:
    data.Image:
    - C:\Windows\system32\svchost.exe
    - C:\Windows\SysWOW64\svchost.exe
    data.TargetFilename|startswith:
    - C:\Program Files\WindowsApps\Microsoft.PowerShellPreview
    - C:\Program Files (x86)\WindowsApps\Microsoft.PowerShellPreview
    data.TargetFilename|endswith: .ps1
  condition: 1 of selection_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
