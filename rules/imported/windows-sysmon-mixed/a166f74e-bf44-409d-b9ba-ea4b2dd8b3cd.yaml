title: Macro Enabled In A Potentially Suspicious Document
id: a166f74e-bf44-409d-b9ba-ea4b2dd8b3cd
status: test
description: Detects registry changes to Office trust records where the path is located in a potentially suspicious location
references:
- https://twitter.com/inversecos/status/1494174785621819397
- Internal Research
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-06-21
tags:
- attack.persistence
- attack.defense-impairment
- attack.t1112
logsource:
  category: osquery
  product: sysmon
detection:
  selection_value:
    data.TargetObject|contains: \Security\Trusted Documents\TrustRecords
  selection_paths:
    data.TargetObject|contains:
    - /AppData/Local/Microsoft/Windows/INetCache/
    - /AppData/Local/Temp/
    - /PerfLogs/
    - C:/Users/Public/
    - file:///D:/
    - file:///E:/
  condition: all of selection_*
falsepositives:
- Unlikely
level: high
