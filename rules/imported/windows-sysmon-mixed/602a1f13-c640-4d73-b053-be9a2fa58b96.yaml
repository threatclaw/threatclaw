title: HackTool - Powerup Write Hijack DLL
id: 602a1f13-c640-4d73-b053-be9a2fa58b96
status: test
description: 'Powerup tool''s Write Hijack DLL exploits DLL hijacking for privilege escalation.

  In it''s default mode, it builds a self deleting .bat file which executes malicious command.

  The detection rule relies on creation of the malicious bat file (debug.bat by default).

  '
references:
- https://powersploit.readthedocs.io/en/latest/Privesc/Write-HijackDll/
author: Subhash Popuri (@pbssubhash)
date: 2021-08-21
tags:
- attack.persistence
- attack.privilege-escalation
- attack.execution
- attack.stealth
- attack.t1574.001
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.Image|endswith:
    - \powershell.exe
    - \pwsh.exe
    data.TargetFilename|endswith: .bat
  condition: selection
falsepositives:
- Any powershell script that creates bat files
level: high
