title: UAC Bypass Using Windows Media Player - File
id: 68578b43-65df-4f81-9a9b-92f32711a951
status: test
description: Detects the pattern of UAC Bypass using Windows Media Player osksupport.dll (UACMe 32)
references:
- https://github.com/hfiref0x/UACME
author: Christian Burkard (Nextron Systems)
date: 2021-08-23
tags:
- attack.privilege-escalation
- attack.t1548.002
logsource:
  category: osquery
  product: sysmon
detection:
  selection1:
    data.TargetFilename|startswith: C:\Users\
    data.TargetFilename|endswith: \AppData\Local\Temp\OskSupport.dll
  selection2:
    data.Image: C:\Windows\system32\DllHost.exe
    data.TargetFilename: C:\Program Files\Windows Media Player\osk.exe
  condition: 1 of selection*
falsepositives:
- Unknown
level: high
