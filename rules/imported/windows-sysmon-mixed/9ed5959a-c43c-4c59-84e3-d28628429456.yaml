title: UAC Bypass Using Iscsicpl - ImageLoad
id: 9ed5959a-c43c-4c59-84e3-d28628429456
status: test
description: Detects the "iscsicpl.exe" UAC bypass technique that leverages a DLL Search Order hijacking technique to load
  a custom DLL's from temp or a any user controlled location in the users %PATH%
references:
- https://github.com/hackerhouse-opensource/iscsicpl_bypassUAC
- https://twitter.com/wdormann/status/1547583317410607110
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-17
tags:
- attack.privilege-escalation
- attack.t1548.002
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.Image: C:\Windows\SysWOW64\iscsicpl.exe
    data.ImageLoaded|endswith: \iscsiexe.dll
  filter:
    data.ImageLoaded|contains|all:
    - C:\Windows\
    - iscsiexe.dll
  condition: selection and not filter
falsepositives:
- Unknown
level: high
