title: Suspicious Printer Driver Empty Manufacturer
id: e0813366-0407-449a-9869-a2db1119dc41
status: test
description: Detects a suspicious printer driver installation with an empty Manufacturer value
references:
- https://twitter.com/SBousseaden/status/1410545674773467140
author: Florian Roth (Nextron Systems)
date: 2020-07-01
tags:
- attack.persistence
- attack.privilege-escalation
- attack.execution
- attack.stealth
- attack.t1574
- cve.2021-1675
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.TargetObject|contains|all:
    - \Control\Print\Environments\Windows x64\Drivers
    - \Manufacturer
    data.Details: (Empty)
  filter_cutepdf:
    data.TargetObject|contains: \CutePDF Writer v4.0\
  filter_vnc:
    data.TargetObject|contains:
    - \VNC Printer (PS)\
    - \VNC Printer (UD)\
  filter_pdf24:
    data.TargetObject|contains: \Version-3\PDF24\
  condition: selection and not 1 of filter_*
falsepositives:
- Alerts on legitimate printer drivers that do not set any more details in the Manufacturer value
level: high
