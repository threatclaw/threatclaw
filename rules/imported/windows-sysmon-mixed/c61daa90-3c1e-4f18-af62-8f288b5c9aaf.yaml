title: Uncommon File Creation By Mysql Daemon Process
id: c61daa90-3c1e-4f18-af62-8f288b5c9aaf
status: test
description: 'Detects the creation of files with scripting or executable extensions by Mysql daemon.

  Which could be an indicator of "User Defined Functions" abuse to download malware.

  '
references:
- https://asec.ahnlab.com/en/58878/
- https://www.trustwave.com/en-us/resources/blogs/spiderlabs-blog/honeypot-recon-mysql-malware-infection-via-user-defined-functions-udf/
author: Joseph Kamau
date: 2024-05-27
tags:
- attack.stealth
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.Image|endswith:
    - \mysqld.exe
    - \mysqld-nt.exe
    data.TargetFilename|endswith:
    - .bat
    - .dat
    - .dll
    - .exe
    - .ps1
    - .psm1
    - .vbe
    - .vbs
  condition: selection
falsepositives:
- Unknown
level: high
