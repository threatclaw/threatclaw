title: Suspicious Space Characters in RunMRU Registry Path - ClickFix
id: 7a1b4c5e-8f3d-4b9a-7c2e-1f4a5b8c6d9e
status: experimental
description: 'Detects the occurrence of numerous space characters in RunMRU registry paths, which may indicate execution via
  phishing lures using clickfix techniques to hide malicious commands in the Windows Run dialog box from naked eyes.

  '
references:
- https://expel.com/blog/cache-smuggling-when-a-picture-isnt-a-thousand-words/
- https://github.com/JohnHammond/recaptcha-phish
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-11-04
tags:
- attack.execution
- attack.stealth
- attack.t1204.004
- attack.t1027.010
logsource:
  category: osquery
  product: sysmon
detection:
  selection_key:
    data.TargetObject|contains: \Software\Microsoft\Windows\CurrentVersion\Explorer\RunMRU\
    data.Details|contains: '#'
  selection_space_variation:
    data.Details|contains:
    -             
    -             
    -             
    -             
    -             
    -             
    -             
    -             
    -             
    -             
    -             
    -             
    - '            '
  condition: all of selection_*
falsepositives:
- Unlikely
level: high
