title: PowerShell as a Service in Registry
id: 4a5f5a5e-ac01-474b-9b4e-d61298c9df1d
status: test
description: Detects that a powershell code is written to the registry as a service.
references:
- https://speakerdeck.com/heirhabarov/hunting-for-powershell-abuse
author: oscd.community, Natalia Shornikova
date: 2020-10-06
tags:
- attack.execution
- attack.t1569.002
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.TargetObject|contains: \Services\
    data.TargetObject|endswith: \ImagePath
    data.Details|contains:
    - powershell
    - pwsh
  condition: selection
falsepositives:
- Unknown
level: high
