title: Hijack Legit RDP Session to Move Laterally
id: 52753ea4-b3a0-4365-910d-36cff487b789
status: test
description: Detects the usage of tsclient share to place a backdoor on the RDP source machine's startup folder
references:
- Internal Research
author: Samir Bousseaden
date: 2019-02-21
tags:
- attack.command-and-control
- attack.t1219.002
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.Image|endswith: \mstsc.exe
    data.TargetFilename|contains: \Microsoft\Windows\Start Menu\Programs\Startup\
  condition: selection
falsepositives:
- Unlikely
level: high
