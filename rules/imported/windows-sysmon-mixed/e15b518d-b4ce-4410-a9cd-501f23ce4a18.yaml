title: Suspicious Creation with Colorcpl
id: e15b518d-b4ce-4410-a9cd-501f23ce4a18
status: test
description: Once executed, colorcpl.exe will copy the arbitrary file to c:\windows\system32\spool\drivers\color\
references:
- https://twitter.com/eral4m/status/1480468728324231172?s=20
author: frack113
date: 2022-01-21
tags:
- attack.stealth
- attack.t1564
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.Image|endswith: \colorcpl.exe
  filter_ext:
    data.TargetFilename|endswith:
    - .icm
    - .gmmp
    - .cdmp
    - .camp
  condition: selection and not 1 of filter_*
falsepositives:
- Unknown
level: high
