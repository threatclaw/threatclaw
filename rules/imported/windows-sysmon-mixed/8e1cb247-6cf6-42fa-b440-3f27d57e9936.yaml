title: Potential Persistence Via Microsoft Office Add-In
id: 8e1cb247-6cf6-42fa-b440-3f27d57e9936
status: test
description: Detects potential persistence activity via startup add-ins that load when Microsoft Office starts (.wll/.xll
  are simply .dll fit for Word or Excel).
references:
- Internal Research
- https://labs.withsecure.com/publications/add-in-opportunities-for-office-persistence
- https://github.com/redcanaryco/atomic-red-team/blob/4ae9580a1a8772db87a1b6cdb0d03e5af231e966/atomics/T1137.006/T1137.006.md
author: NVISO
date: 2020-05-11
tags:
- attack.persistence
- attack.t1137.006
logsource:
  category: osquery
  product: sysmon
detection:
  selection_wlldropped:
    data.TargetFilename|contains: \Microsoft\Word\Startup\
    data.TargetFilename|endswith: .wll
  selection_xlldropped:
    data.TargetFilename|contains: \Microsoft\Excel\Startup\
    data.TargetFilename|endswith: .xll
  selection_xladropped:
    data.TargetFilename|contains: Microsoft\Excel\XLSTART\
    data.TargetFilename|endswith: .xlam
  selection_generic:
    data.TargetFilename|contains: \Microsoft\Addins\
    data.TargetFilename|endswith:
    - .xlam
    - .xla
    - .ppam
  condition: 1 of selection_*
falsepositives:
- Legitimate add-ins
level: high
