title: Creation of a Local Hidden User Account by Registry
id: 460479f3-80b7-42da-9c43-2cc1d54dbccd
status: test
description: Sysmon registry detection of a local hidden user account.
references:
- https://twitter.com/SBousseaden/status/1387530414185664538
author: Christian Burkard (Nextron Systems)
date: 2021-05-03
tags:
- attack.persistence
- attack.t1136.001
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.TargetObject|contains: \SAM\SAM\Domains\Account\Users\Names\
    data.TargetObject|endswith: $\(Default)
    data.Image|endswith: \lsass.exe
  condition: selection
falsepositives:
- Unknown
level: high
