title: UAC Bypass Abusing Winsat Path Parsing - File
id: 155dbf56-e0a4-4dd0-8905-8a98705045e8
status: test
description: Detects the pattern of UAC Bypass using a path parsing issue in winsat.exe (UACMe 52)
references:
- https://github.com/hfiref0x/UACME
author: Christian Burkard (Nextron Systems)
date: 2021-08-30
tags:
- attack.privilege-escalation
- attack.t1548.002
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.TargetFilename|startswith: C:\Users\
    data.TargetFilename|endswith:
    - \AppData\Local\Temp\system32\winsat.exe
    - \AppData\Local\Temp\system32\winmm.dll
  condition: selection
falsepositives:
- Unknown
level: high
