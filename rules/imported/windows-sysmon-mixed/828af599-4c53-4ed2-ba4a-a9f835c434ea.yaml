title: Fax Service DLL Search Order Hijack
id: 828af599-4c53-4ed2-ba4a-a9f835c434ea
status: test
description: The Fax service attempts to load ualapi.dll, which is non-existent. An attacker can then (side)load their own
  malicious DLL using this service.
references:
- https://windows-internals.com/faxing-your-way-to-system/
author: NVISO
date: 2020-05-04
tags:
- attack.privilege-escalation
- attack.persistence
- attack.execution
- attack.stealth
- attack.t1574.001
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.Image|endswith: \fxssvc.exe
    data.ImageLoaded|endswith: ualapi.dll
  filter:
    data.ImageLoaded|startswith: C:\Windows\WinSxS\
  condition: selection and not filter
falsepositives:
- Unlikely
level: high
