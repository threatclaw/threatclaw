title: System Control Panel Item Loaded From Uncommon Location
id: 2b140a5c-dc02-4bb8-b6b1-8bdb45714cde
status: test
description: 'Detects image load events of system control panel items (.cpl) from uncommon or non-system locations that may
  indicate DLL sideloading or other abuse techniques.

  '
references:
- https://www.hexacorn.com/blog/2024/01/06/1-little-known-secret-of-fondue-exe/
- https://www.hexacorn.com/blog/2024/01/01/1-little-known-secret-of-hdwwiz-exe/
- https://github.com/mhaskar/FsquirtCPLPoC
- https://securelist.com/sidewinder-apt/114089/
author: Anish Bogati
date: 2024-01-09
tags:
- attack.persistence
- attack.privilege-escalation
- attack.execution
- attack.stealth
- attack.t1574.001
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.ImageLoaded|endswith:
    - \appwiz.cpl
    - \bthprops.cpl
    - \hdwwiz.cpl
  filter_main_legit_location:
    data.ImageLoaded|startswith:
    - C:\Windows\Prefetch\
    - C:\Windows\System32\
    - C:\Windows\SysWOW64\
    - C:\Windows\WinSxS\
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
