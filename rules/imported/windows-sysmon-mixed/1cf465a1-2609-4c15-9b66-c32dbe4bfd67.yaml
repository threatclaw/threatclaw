title: Legitimate Application Writing Files In Uncommon Location
id: 1cf465a1-2609-4c15-9b66-c32dbe4bfd67
status: experimental
description: 'Detects legitimate applications writing any type of file to uncommon or suspicious locations that are not typical
  for application data storage or execution.

  Adversaries may leverage legitimate applications (Living off the Land Binaries - LOLBins) to drop or download malicious
  files to uncommon locations on the system to evade detection by security solutions.

  '
references:
- https://lolbas-project.github.io/#/download
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-12-10
tags:
- attack.stealth
- attack.t1218
- attack.command-and-control
- attack.t1105
logsource:
  category: osquery
  product: sysmon
detection:
  selection_img:
    data.Image|endswith:
    - \eqnedt32.exe
    - \wordpad.exe
    - \wordview.exe
    - \cmdl32.exe
    - \certutil.exe
    - \certoc.exe
    - \CertReq.exe
    - \bitsadmin.exe
    - \Desktopimgdownldr.exe
    - \esentutl.exe
    - \expand.exe
    - \extrac32.exe
    - \replace.exe
    - \mshta.exe
    - \ftp.exe
    - \Ldifde.exe
    - \RdrCEF.exe
    - \hh.exe
    - \finger.exe
    - \findstr.exe
  selection_locations:
    data.TargetFilename|contains:
    - :\Perflogs
    - :\ProgramData\
    - :\Temp\
    - :\Users\Public\
    - :\Windows\
    - \$Recycle.Bin\
    - \AppData\Local\
    - \AppData\Roaming\
    - \Contacts\
    - \Desktop\
    - \Favorites\
    - \Favourites\
    - \inetpub\wwwroot\
    - \Music\
    - \Pictures\
    - \Start Menu\Programs\Startup\
    - \Users\Default\
    - \Videos\
  condition: all of selection_*
falsepositives:
- Unknown
level: high
