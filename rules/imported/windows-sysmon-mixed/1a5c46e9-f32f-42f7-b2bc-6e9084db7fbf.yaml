title: Trust Access Disable For VBApplications
id: 1a5c46e9-f32f-42f7-b2bc-6e9084db7fbf
status: test
description: Detects registry changes to Microsoft Office "AccessVBOM" to a value of "1" which disables trust access for VBA
  on the victim machine and lets attackers execute malicious macros without any Microsoft Office warnings.
references:
- https://twitter.com/inversecos/status/1494174785621819397
- https://www.mcafee.com/blogs/other-blogs/mcafee-labs/zloader-with-a-new-infection-technique/
- https://securelist.com/scarcruft-surveilling-north-korean-defectors-and-human-rights-activists/105074/
author: Trent Liffick (@tliffick), Nasreddine Bencherchali (Nextron Systems)
date: 2020-05-22
tags:
- attack.persistence
- attack.defense-impairment
- attack.t1112
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.TargetObject|endswith: \Security\AccessVBOM
    data.Details: DWORD (0x00000001)
  condition: selection
falsepositives:
- Unlikely
level: high
