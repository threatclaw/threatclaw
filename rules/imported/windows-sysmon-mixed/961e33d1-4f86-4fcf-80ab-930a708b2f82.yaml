title: Potential Persistence Via Excel Add-in - Registry
id: 961e33d1-4f86-4fcf-80ab-930a708b2f82
status: test
description: Detect potential persistence via the creation of an excel add-in (XLL) file to make it run automatically when
  Excel is started.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/4ae9580a1a8772db87a1b6cdb0d03e5af231e966/atomics/T1137.006/T1137.006.md
- https://labs.withsecure.com/publications/add-in-opportunities-for-office-persistence
author: frack113
date: 2023-01-15
tags:
- attack.persistence
- attack.t1137.006
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.TargetObject|contains: Software\Microsoft\Office\
    data.TargetObject|endswith: \Excel\Options
    data.Details|startswith: '/R '
    data.Details|endswith: .xll
  condition: selection
falsepositives:
- Unknown
level: high
