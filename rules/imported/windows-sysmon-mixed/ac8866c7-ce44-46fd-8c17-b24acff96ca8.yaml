title: HybridConnectionManager Service Installation - Registry
id: ac8866c7-ce44-46fd-8c17-b24acff96ca8
status: test
description: Detects the installation of the Azure Hybrid Connection Manager service to allow remote code execution from Azure
  function.
references:
- https://twitter.com/Cyb3rWard0g/status/1381642789369286662
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research)
date: 2021-04-12
tags:
- attack.resource-development
- attack.t1608
logsource:
  category: osquery
  product: sysmon
detection:
  selection1:
    data.TargetObject|contains: \Services\HybridConnectionManager
  selection2:
    data.EventType: SetValue
    data.Details|contains: Microsoft.HybridConnectionManager.Listener.exe
  condition: selection1 or selection2
falsepositives:
- Unknown
level: high
