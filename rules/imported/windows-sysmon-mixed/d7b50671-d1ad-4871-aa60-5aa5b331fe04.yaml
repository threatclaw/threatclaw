title: Suspicious File Creation In Uncommon AppData Folder
id: d7b50671-d1ad-4871-aa60-5aa5b331fe04
status: test
description: Detects the creation of suspicious files and folders inside the user's AppData folder but not inside any of the
  common and well known directories (Local, Romaing, LocalLow). This method could be used as a method to bypass detection
  who exclude the AppData folder in fear of FPs
references:
- Internal Research
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-05
tags:
- attack.execution
- attack.stealth
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.TargetFilename|startswith: C:\Users\
    data.TargetFilename|contains: \AppData\
    data.TargetFilename|endswith:
    - .bat
    - .cmd
    - .cpl
    - .dll
    - .exe
    - .hta
    - .iso
    - .lnk
    - .msi
    - .ps1
    - .psm1
    - .scr
    - .vbe
    - .vbs
  filter_main:
    data.TargetFilename|startswith: C:\Users\
    data.TargetFilename|contains:
    - \AppData\Local\
    - \AppData\LocalLow\
    - \AppData\Roaming\
  condition: selection and not filter_main
falsepositives:
- Unlikely
level: high
