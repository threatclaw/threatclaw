title: Suspicious Binaries and Scripts in Public Folder
id: b447f7de-1e53-4cbf-bfb4-f1f6d0b04e4e
status: experimental
description: Detects the creation of a file with a suspicious extension in the public folder, which could indicate potential
  malicious activity.
references:
- https://intel.thedfirreport.com/events/view/30032
- https://intel.thedfirreport.com/eventReports/view/70
- https://thedfirreport.com/2025/01/27/cobalt-strike-and-a-pair-of-socks-lead-to-lockbit-ransomware/
author: The DFIR Report
date: 2025-01-23
tags:
- attack.execution
- attack.t1204
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.TargetFilename|contains: :\Users\Public\
    data.TargetFilename|endswith:
    - .bat
    - .dll
    - .exe
    - .hta
    - .js
    - .ps1
    - .vbe
    - .vbs
  condition: selection
falsepositives:
- Administrators deploying legitimate binaries to public folders.
level: high
