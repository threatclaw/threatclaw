title: Potential Credential Dumping Via LSASS SilentProcessExit Technique
id: 55e29995-75e7-451a-bef0-6225e2f13597
status: test
description: Detects changes to the Registry in which a monitor program gets registered to dump the memory of the lsass.exe
  process
references:
- https://www.deepinstinct.com/2021/02/16/lsass-memory-dumps-are-stealthier-than-ever-before-part-2/
- https://oddvar.moe/2018/04/10/persistence-using-globalflags-in-image-file-execution-options-hidden-from-autoruns-exe/
author: Florian Roth (Nextron Systems)
date: 2021-02-26
tags:
- attack.credential-access
- attack.t1003.001
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.TargetObject|contains: Microsoft\Windows NT\CurrentVersion\SilentProcessExit\lsass.exe
  condition: selection
falsepositives:
- Unlikely
level: critical
