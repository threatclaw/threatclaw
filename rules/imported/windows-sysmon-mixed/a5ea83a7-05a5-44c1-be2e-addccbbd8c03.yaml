title: UAC Bypass With Fake DLL
id: a5ea83a7-05a5-44c1-be2e-addccbbd8c03
status: test
description: Attempts to load dismcore.dll after dropping it
references:
- https://steemit.com/utopian-io/@ah101/uac-bypassing-utility
author: oscd.community, Dmitry Uchakin
date: 2020-10-06
tags:
- attack.persistence
- attack.privilege-escalation
- attack.execution
- attack.stealth
- attack.t1548.002
- attack.t1574.001
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.Image|endswith: \dism.exe
    data.ImageLoaded|endswith: \dismcore.dll
  filter:
    data.ImageLoaded: C:\Windows\System32\Dism\dismcore.dll
  condition: selection and not filter
falsepositives:
- Actions of a legitimate telnet client
level: high
