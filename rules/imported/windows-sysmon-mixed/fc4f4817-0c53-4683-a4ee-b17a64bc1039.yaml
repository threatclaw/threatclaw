title: Suspicious Desktopimgdownldr Target File
id: fc4f4817-0c53-4683-a4ee-b17a64bc1039
status: test
description: Detects a suspicious Microsoft desktopimgdownldr file creation that stores a file to a suspicious location or
  contains a file with a suspicious extension
references:
- https://labs.sentinelone.com/living-off-windows-land-a-new-native-file-downldr/
- https://twitter.com/SBousseaden/status/1278977301745741825
author: Florian Roth (Nextron Systems)
date: 2020-07-03
tags:
- attack.command-and-control
- attack.t1105
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.Image|endswith: \svchost.exe
    data.TargetFilename|contains: \Personalization\LockScreenImage\
  filter1:
    data.TargetFilename|contains: C:\Windows\
  filter2:
    data.TargetFilename|contains:
    - .jpg
    - .jpeg
    - .png
  condition: selection and not filter1 and not filter2
falsepositives:
- False positives depend on scripts and administrative tools used in the monitored environment
level: high
