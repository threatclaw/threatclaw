title: Change the Fax Dll
id: 9e3357ba-09d4-4fbd-a7c5-ad6386314513
status: test
description: Detect possible persistence using Fax DLL load when service restart
references:
- https://twitter.com/dottor_morte/status/1544652325570191361
- https://raw.githubusercontent.com/RiccardoAncarani/talks/master/F-Secure/unorthodox-lateral-movement.pdf
author: frack113
date: 2022-07-17
tags:
- attack.persistence
- attack.defense-impairment
- attack.t1112
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.TargetObject|contains|all:
    - \Software\Microsoft\Fax\Device Providers\
    - \ImageName
  filter:
    data.Details: '%systemroot%\system32\fxst30.dll'
  condition: selection and not filter
falsepositives:
- Unknown
level: high
