title: Suspicious Volume Shadow Copy Vssapi.dll Load
id: 37774c23-25a1-4adb-bb6d-8bb9fd59c0f8
status: test
description: Detects the image load of VSS DLL by uncommon executables
references:
- https://github.com/ORCx41/DeleteShadowCopies
author: frack113
date: 2022-10-31
tags:
- attack.impact
- attack.t1490
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.ImageLoaded|endswith: \vssapi.dll
  filter_main_windows:
  - Image:
    - C:\Windows\explorer.exe
    - C:\Windows\ImmersiveControlPanel\SystemSettings.exe
  - Image|startswith:
    - C:\Windows\System32\
    - C:\Windows\SysWOW64\
    - C:\Windows\Temp\{
    - C:\Windows\WinSxS\
    - C:\$WinREAgent\Scratch\
  filter_main_program_files:
    data.Image|startswith:
    - C:\Program Files\
    - C:\Program Files (x86)\
  filter_main_null_image:
    data.Image: null
  filter_optional_programdata_packagecache:
    data.Image|startswith: C:\ProgramData\Package Cache\
  filter_optional_avira:
    data.Image|contains|all:
    - \temp\is-
    - \avira_system_speedup.tmp
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: high
