title: Registry Entries For Azorult Malware
id: f7f9ab88-7557-4a69-b30e-0a8f91b3a0e7
status: test
description: Detects the presence of a registry key created during Azorult execution
references:
- https://www.trendmicro.com/vinfo/us/threat-encyclopedia/malware/trojan.win32.azoruit.a
author: Trent Liffick
date: 2020-05-08
tags:
- attack.persistence
- attack.execution
- attack.defense-impairment
- attack.t1112
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.EventID:
    - 12
    - 13
    data.TargetObject|contains: SYSTEM\
    data.TargetObject|endswith: \services\localNETService
  condition: selection
falsepositives:
- Unknown
level: critical
