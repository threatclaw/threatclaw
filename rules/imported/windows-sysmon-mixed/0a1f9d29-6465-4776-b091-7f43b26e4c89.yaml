title: Prefetch File Deleted
id: 0a1f9d29-6465-4776-b091-7f43b26e4c89
status: test
description: Detects the deletion of a prefetch file which may indicate an attempt to destroy forensic evidence
references:
- Internal Research
- https://www.group-ib.com/blog/hunting-for-ttps-with-prefetch-files/
author: Cedric MAURUGEON
date: 2021-09-29
tags:
- attack.stealth
- attack.t1070.004
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.TargetFilename|contains: :\Windows\Prefetch\
    data.TargetFilename|endswith: .pf
  filter_main_svchost:
    data.Image|endswith: :\windows\system32\svchost.exe
    data.User|contains:
    - AUTHORI
    - AUTORI
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
