title: UAC Bypass Abusing Winsat Path Parsing - Registry
id: 6597be7b-ac61-4ac8-bef4-d3ec88174853
status: test
description: Detects the pattern of UAC Bypass using a path parsing issue in winsat.exe (UACMe 52)
references:
- https://github.com/hfiref0x/UACME
author: Christian Burkard (Nextron Systems)
date: 2021-08-30
tags:
- attack.privilege-escalation
- attack.t1548.002
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.TargetObject|contains: \Root\InventoryApplicationFile\winsat.exe|
    data.TargetObject|endswith: \LowerCaseLongPath
    data.Details|startswith: c:\users\
    data.Details|endswith: \appdata\local\temp\system32\winsat.exe
  condition: selection
falsepositives:
- Unknown
level: high
