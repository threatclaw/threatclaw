title: Potential AutoLogger Sessions Tampering
id: f37b4bce-49d0-4087-9f5b-58bffda77316
status: test
description: 'Detects tampering with autologger trace sessions which is a technique used by attackers to disable logging.

  The AutoLogger event tracing session records events up that occur early in the operating system boot process.

  Applications and device drivers can use the AutoLogger session to capture traces before the user logs in, and also used
  by security solutions as telemetry source.

  Adversaries may disable these sessions to evade detection and prevent security monitoring of early boot activities and system
  events.

  '
references:
- https://twitter.com/MichalKoczwara/status/1553634816016498688
- https://thedfirreport.com/2021/10/18/icedid-to-xinglocker-ransomware-in-24-hours/
- https://i.blackhat.com/EU-21/Wednesday/EU-21-Teodorescu-Veni-No-Vidi-No-Vici-Attacks-On-ETW-Blind-EDRs.pdf
- https://learn.microsoft.com/en-us/windows/win32/etw/configuring-and-starting-an-autologger-session
- https://blog.palantir.com/tampering-with-windows-event-tracing-background-offense-and-defense-4be7ac62ac63
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-01
tags:
- attack.defense-impairment
- attack.t1685.001
logsource:
  category: osquery
  product: sysmon
detection:
  selection_main:
    data.TargetObject|contains: \Control\WMI\Autologger\
  selection_values:
    data.TargetObject|contains:
    - \EventLog-
    - \Defender
    data.TargetObject|endswith:
    - \Enabled
    - \Start
    data.Details: DWORD (0x00000000)
  filter_main_wevtutil:
    data.Image: C:\Windows\system32\wevtutil.exe
  filter_main_defender:
    data.Image|startswith:
    - C:\ProgramData\Microsoft\Windows Defender\Platform\
    - C:\Program Files\Windows Defender\
    - C:\Program Files (x86)\Windows Defender\
    data.Image|endswith: \MsMpEng.exe
    data.TargetObject|contains:
    - \DefenderApiLogger\
    - \DefenderAuditLogger\
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
