title: Suspicious Network Connection Binary No CommandLine
id: 20384606-a124-4fec-acbb-8bd373728613
status: test
description: Detects suspicious network connections made by a well-known Windows binary run with no command line parameters
references:
- https://redcanary.com/blog/raspberry-robin/
author: Florian Roth (Nextron Systems)
date: 2022-07-03
tags:
- attack.stealth
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.Initiated: 'true'
    data.Image|endswith:
    - \regsvr32.exe
    - \rundll32.exe
    - \dllhost.exe
    data.CommandLine|endswith:
    - \regsvr32.exe
    - \rundll32.exe
    - \dllhost.exe
  filter_no_cmdline:
    data.CommandLine: ''
  filter_null:
    data.CommandLine: null
  condition: selection and not 1 of filter*
falsepositives:
- Unknown
level: high
