title: Potential DLL Sideloading Via VMware Xfer
id: 9313dc13-d04c-46d8-af4a-a930cc55d93b
status: test
description: Detects loading of a DLL by the VMware Xfer utility from the non-default directory which may be an attempt to
  sideload arbitrary DLL
references:
- https://www.sentinelone.com/labs/lockbit-ransomware-side-loads-cobalt-strike-beacon-with-legitimate-vmware-utility/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-02
tags:
- attack.privilege-escalation
- attack.persistence
- attack.execution
- attack.stealth
- attack.t1574.001
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.Image|endswith: \VMwareXferlogs.exe
    data.ImageLoaded|endswith: \glib-2.0.dll
  filter:
    data.ImageLoaded|startswith: C:\Program Files\VMware\
  condition: selection and not filter
falsepositives:
- Unlikely
level: high
