title: VBScript Payload Stored in Registry
id: 46490193-1b22-4c29-bdd6-5bf63907216f
status: test
description: Detects VBScript content stored into registry keys as seen being used by UNC2452 group
references:
- https://www.microsoft.com/security/blog/2021/03/04/goldmax-goldfinder-sibot-analyzing-nobelium-malware/
author: Florian Roth (Nextron Systems)
date: 2021-03-05
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1547.001
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.TargetObject|contains: Software\Microsoft\Windows\CurrentVersion
    data.Details|contains:
    - 'vbscript:'
    - 'jscript:'
    - mshtml,
    - RunHTMLApplication
    - Execute(
    - CreateObject
    - window.close
  filter:
    data.TargetObject|contains: Software\Microsoft\Windows\CurrentVersion\Run
  filter_dotnet:
    data.Image|endswith: \msiexec.exe
    data.TargetObject|contains: \SOFTWARE\Microsoft\Windows\CurrentVersion\Installer\UserData\
    data.Details|contains:
    - \Microsoft.NET\Primary Interop Assemblies\Microsoft.mshtml.dll
    - <\Microsoft.mshtml,fileVersion=
    - _mshtml_dll_
    - <\Microsoft.mshtml,culture=
  condition: selection and not 1 of filter*
falsepositives:
- Unknown
level: high
