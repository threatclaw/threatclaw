title: LSASS Process Memory Dump Files
id: a5a2d357-1ab8-4675-a967-ef9990a59391
status: test
description: Detects creation of files with names used by different memory dumping tools to create a memory dump of the LSASS
  process memory, which contains user credentials.
references:
- https://www.google.com/search?q=procdump+lsass
- https://medium.com/@markmotig/some-ways-to-dump-lsass-exe-c4a75fdc49bf
- https://github.com/elastic/detection-rules/blob/c76a39796972ecde44cb1da6df47f1b6562c9770/rules/windows/credential_access_lsass_memdump_file_created.toml
- https://www.whiteoaksecurity.com/blog/attacks-defenses-dumping-lsass-no-mimikatz/
- https://github.com/helpsystems/nanodump
- https://github.com/CCob/MirrorDump
- https://github.com/safedv/RustiveDump/blob/1a9b026b477587becfb62df9677cede619d42030/src/main.rs#L35
- https://github.com/ricardojoserf/NativeDump/blob/01d8cd17f31f51f5955a38e85cd3c83a17596175/NativeDump/Program.cs#L258
author: Florian Roth (Nextron Systems)
date: 2021-11-15
tags:
- attack.credential-access
- attack.t1003.001
logsource:
  category: osquery
  product: sysmon
detection:
  selection_1:
    data.TargetFilename|endswith:
    - \Andrew.dmp
    - \Coredump.dmp
    - \lsass.dmp
    - \lsass.rar
    - \lsass.zip
    - \NotLSASS.zip
    - \PPLBlade.dmp
    - \rustive.dmp
  selection_2:
    data.TargetFilename|contains:
    - \lsass_2
    - \lsassdmp
    - \lsassdump
  selection_3:
    data.TargetFilename|contains|all:
    - \lsass
    - .dmp
  selection_4:
    data.TargetFilename|contains: SQLDmpr
    data.TargetFilename|endswith: .mdmp
  selection_5:
    data.TargetFilename|contains:
    - \nanodump
    - \proc_
    data.TargetFilename|endswith: .dmp
  condition: 1 of selection_*
falsepositives:
- Unknown
level: high
