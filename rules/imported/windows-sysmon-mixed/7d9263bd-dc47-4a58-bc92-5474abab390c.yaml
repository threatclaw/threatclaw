title: Change Winevt Channel Access Permission Via Registry
id: 7d9263bd-dc47-4a58-bc92-5474abab390c
status: test
description: Detects tampering with the "ChannelAccess" registry key in order to change access to Windows event channel.
references:
- https://app.any.run/tasks/77b2e328-8f36-46b2-b2e2-8a80398217ab/
- https://learn.microsoft.com/en-us/windows/win32/api/winevt/
- https://itconnect.uw.edu/tools-services-support/it-systems-infrastructure/msinf/other-help/understanding-sddl-syntax/
author: frack113
date: 2022-09-17
tags:
- attack.defense-impairment
- attack.t1685.001
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.TargetObject|contains: \Microsoft\Windows\CurrentVersion\WINEVT\Channels\
    data.TargetObject|endswith: \ChannelAccess
    data.Details|contains:
    - (A;;0x1;;;LA)
    - (A;;0x1;;;SY)
    - (A;;0x5;;;BA)
  filter_main_trustedinstaller:
    data.Image: C:\Windows\servicing\TrustedInstaller.exe
  filter_main_tiworker:
    data.Image|startswith: C:\Windows\WinSxS\
    data.Image|endswith: \TiWorker.exe
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
