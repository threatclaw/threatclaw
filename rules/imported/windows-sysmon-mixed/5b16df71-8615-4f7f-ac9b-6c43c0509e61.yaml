title: Hide Schedule Task Via Index Value Tamper
id: 5b16df71-8615-4f7f-ac9b-6c43c0509e61
status: test
description: 'Detects when the "index" value of a scheduled task is modified from the registry

  Which effectively hides it from any tooling such as "schtasks /query" (Read the referenced link for more information about
  the effects of this technique)

  '
references:
- https://blog.qualys.com/vulnerabilities-threat-research/2022/06/20/defending-against-scheduled-task-attacks-in-windows-environments
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-26
tags:
- attack.defense-impairment
- attack.t1685
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.TargetObject|contains|all:
    - \SOFTWARE\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\Tree\
    - Index
    data.Details: DWORD (0x00000000)
  condition: selection
falsepositives:
- Unlikely
level: high
