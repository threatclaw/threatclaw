title: WerFault LSASS Process Memory Dump
id: c3e76af5-4ce0-4a14-9c9a-25ceb8fda182
status: test
description: Detects WerFault creating a dump file with a name that indicates that the dump file could be an LSASS process
  memory, which contains user credentials
references:
- https://github.com/helpsystems/nanodump
author: Florian Roth (Nextron Systems)
date: 2022-06-27
tags:
- attack.credential-access
- attack.t1003.001
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    data.Image: C:\WINDOWS\system32\WerFault.exe
    data.TargetFilename|contains:
    - \lsass
    - lsass.exe
  condition: selection
falsepositives:
- Unknown
level: high
