title: PowerShell Set-Acl On Windows Folder - PsScript
id: 3bf1d859-3a7e-44cb-8809-a99e066d3478
status: test
description: Detects PowerShell scripts to set the ACL to a file in the Windows folder
references:
- https://github.com/redcanaryco/atomic-red-team/blob/74438b0237d141ee9c99747976447dc884cb1a39/atomics/T1505.005/T1505.005.md
- https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.security/set-acl?view=powershell-5.1
author: frack113, Nasreddine Bencherchali (Nextron Systems)
date: 2023-07-18
tags:
- attack.defense-impairment
- attack.t1222
logsource:
  category: osquery
  product: powershell
detection:
  selection_cmdlet:
    data.ScriptBlockText|contains|all:
    - 'Set-Acl '
    - '-AclObject '
  selection_paths:
    data.ScriptBlockText|contains:
    - -Path "C:\Windows
    - -Path "C:/Windows
    - -Path 'C:\Windows
    - -Path 'C:/Windows
    - -Path C:\\Windows
    - -Path C:/Windows
    - -Path $env:windir
    - -Path "$env:windir
    - -Path '$env:windir
  selection_permissions:
    data.ScriptBlockText|contains:
    - FullControl
    - Allow
  condition: all of selection_*
falsepositives:
- Unknown
level: high
