title: PowerShell ShellCode
id: 16b37b70-6fcf-4814-a092-c36bd3aafcbd
status: test
description: Detects Base64 encoded Shellcode
references:
- https://twitter.com/cyb3rops/status/1063072865992523776
author: David Ledbetter (shellcode), Florian Roth (Nextron Systems)
date: 2018-11-17
tags:
- attack.privilege-escalation
- attack.stealth
- attack.t1055
- attack.execution
- attack.t1059.001
logsource:
  category: osquery
  product: powershell
detection:
  selection:
    data.ScriptBlockText|contains:
    - OiCAAAAYInlM
    - OiJAAAAYInlM
  condition: selection
falsepositives:
- Unknown
level: high
