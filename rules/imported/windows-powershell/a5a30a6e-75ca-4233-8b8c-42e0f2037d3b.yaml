title: Invoke-Obfuscation Via Use Rundll32 - PowerShell
id: a5a30a6e-75ca-4233-8b8c-42e0f2037d3b
status: test
description: Detects Obfuscated Powershell via use Rundll32 in Scripts
references:
- https://github.com/SigmaHQ/sigma/issues/1009
author: Nikita Nazarov, oscd.community
date: 2019-10-08
tags:
- attack.stealth
- attack.t1027
- attack.execution
- attack.t1059.001
logsource:
  category: osquery
  product: powershell
detection:
  selection_4104:
    data.ScriptBlockText|contains|all:
    - '&&'
    - rundll32
    - shell32.dll
    - shellexec_rundll
    data.ScriptBlockText|contains:
    - value
    - invoke
    - comspec
    - iex
  condition: selection_4104
falsepositives:
- Unknown
level: high
