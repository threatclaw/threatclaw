rule: ps-obfusc-003

positive:
  - description: WebClient DownloadString
    event:
      commandline: "powershell -c \"(New-Object Net.WebClient).DownloadString('http://x/y')\""
  - description: DownloadFile to disk
    event:
      commandline: 'powershell.exe (New-Object Net.WebClient).DownloadFile($url, $dest)'
  - description: DownloadData in memory
    event:
      commandline: 'powershell.exe $client = New-Object WebClient; $client.DownloadData($url)'

negative:
  - description: Use of Invoke-WebRequest (caught by ps-obfusc-004 instead)
    event:
      commandline: 'powershell.exe Invoke-WebRequest -Uri http://x -OutFile out.bin'
  - description: Plain PowerShell command
    event:
      commandline: 'powershell.exe Get-Service'
  - description: Curl alias on a different platform
    event:
      commandline: 'curl http://x/y.bin'
