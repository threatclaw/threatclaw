rule: sysmon-schtasks-suspect

positive:
  - description: schtasks running encoded PowerShell every minute
    event:
      commandline: 'schtasks /create /sc minute /mo 1 /tn "Updater" /tr "powershell -enc QQBkAGQ=" /ru SYSTEM'
  - description: schtasks pointing to a binary in Public folder
    event:
      commandline: 'schtasks /create /sc onlogon /tn "Service" /tr "C:\Users\Public\svc.exe"'
  - description: schtasks calling rundll32 with /create
    event:
      commandline: 'schtasks /create /tn "Helper" /tr "rundll32.exe C:\ProgramData\help.dll,Run"'

negative:
  - description: schtasks creating a legit task in Program Files
    event:
      commandline: 'schtasks /create /tn "Backup" /tr "C:\Program Files\Veeam\agent.exe" /sc daily'
  - description: schtasks query only
    event:
      commandline: 'schtasks /query'
