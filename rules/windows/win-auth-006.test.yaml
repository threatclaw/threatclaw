rule: win-auth-006
positive:
  - description: A user account was created (4720)
    event:
      channel: Security
      eventid: '4720'
      data:
        TargetUserName: backdoor
        SubjectUserName: administrator
negative:
  - description: A different account event (4722 enabled) — not creation
    event:
      channel: Security
      eventid: '4722'
      data:
        TargetUserName: alice
  - description: Command line that happens to contain "4720" (the old false positive)
    event:
      commandline: 'net helpmsg 4720'
