title: PowerShell Reverse Shell
id: ps-obfusc-020
status: stable
description: |
  Detects PowerShell reverse shell patterns
references:
  - https://attack.mitre.org/techniques/T1059/001/
author: ThreatClaw
date: 2026-06-14
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: process
detection:
  selection:
    'commandline|contains':
      - TCPClient
      - Net.Sockets
      - IO.StreamReader
      - GetStream()
      - Nishang
      - powercat
  condition: selection
falsepositives:
  - Unknown
level: critical
