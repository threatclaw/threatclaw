title: User Account Created
id: win-auth-006
status: stable
description: |
  Detects creation of a Windows user account (Event 4720). Rewritten from the legacy
  bare-token form to the real eventid on the Security channel. Persistence /
  account-manipulation visibility; a SOC reviews unexpected account creations.
references:
  - https://attack.mitre.org/techniques/T1136/001/
author: ThreatClaw
date: 2026-06-29
tags:
  - attack.persistence
  - attack.t1136.001
logsource:
  category: osquery
  product: windows
  service: security
detection:
  selection:
    channel: Security
    eventid: '4720'
  condition: selection
falsepositives:
  - Routine provisioning / IT account creation. Correlate with the actor (SubjectUserName) and change tickets.
level: medium
