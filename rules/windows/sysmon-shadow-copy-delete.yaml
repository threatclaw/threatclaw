title: Volume Shadow Copy Deletion (Ransomware Pre-Encryption)
id: sysmon-shadow-copy-delete
status: stable
description: |
  Detects the deletion of volume shadow copies, a near-universal step
  performed by ransomware affiliates immediately before encryption to
  prevent file recovery. The behaviour is observed in LockBit, Akira,
  BlackBasta, RansomHub, Medusa and most active affiliate playbooks.
  Three primary mechanisms are covered: `vssadmin delete shadows`,
  `wmic shadowcopy delete`, and `wbadmin delete catalog`.
references:
  - https://attack.mitre.org/techniques/T1490/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_vssadmin_shadowcopy_deletion.yml
author: ThreatClaw
date: 2026-06-14
tags:
  - attack.impact
  - attack.t1490
logsource:
  category: osquery
  product: sysmon
detection:
  selection_vssadmin:
    'commandline|contains':
      - vssadmin
      - 'wmic shadowcopy'
      - 'Get-WmiObject Win32_ShadowCopy'
      - 'wbadmin delete catalog'
  selection_action:
    'commandline|contains':
      - delete
      - Delete
  condition: selection_vssadmin and selection_action
falsepositives:
  - Backup administrator running scheduled storage cleanup (rare on
    user endpoints; common only on backup server out of business
    hours).
level: critical
