rule: win-auth-001
positive:
  - description: TGS (4769) with RC4 for a service SPN — Kerberoasting
    event:
      channel: Security
      eventid: '4769'
      data:
        ServiceName: 'MSSQLSvc/sql01.interstellar.local:1433'
        TicketEncryptionType: '0x17'
negative:
  - description: TGS with AES256 (modern client, legitimate)
    event:
      channel: Security
      eventid: '4769'
      data:
        ServiceName: 'host/dc01'
        TicketEncryptionType: '0x12'
  - description: Command line that happens to contain "4769" (the old false positive)
    event:
      commandline: 'wevtutil qe Security /q:"*[System[(EventID=4769)]]"'
