title: Windows Event Log Cleared
id: sysmon-eventlog-clear
status: stable
description: |
  Detects the wiping of Windows event logs through `wevtutil cl` or
  the PowerShell `Clear-EventLog` / `ClearLog` API. Log clearing is
  almost never legitimate on production endpoints and is one of the
  most reliable post-compromise signals in ransomware playbooks.
references:
  - https://attack.mitre.org/techniques/T1070/001/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_susp_eventlog_clear.yml
author: ThreatClaw
date: 2026-06-14
tags:
  - attack.defense_evasion
  - attack.t1070.001
logsource:
  category: process
detection:
  selection_wevt:
    'commandline|contains':
      - 'wevtutil cl '
      - 'wevtutil clear-log'
      - 'wevtutil sl '
  selection_ps:
    'commandline|contains':
      - 'Clear-EventLog'
      - 'Remove-EventLog'
      - 'EventLogSession'
      - 'ClearLog'
  condition: selection_wevt or selection_ps
falsepositives:
  - Lab / jump-box rotation scripts; allowlist by host.
level: high
