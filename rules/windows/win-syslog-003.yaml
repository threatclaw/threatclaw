title: Sysmon Process Create With Downloader-Cradle Command Line
id: win-syslog-003
status: stable
description: |
  Detects a Sysmon Process Create event whose command line carries
  a classic in-memory downloader cradle: a download primitive
  followed by an execution primitive on the same line. Every
  serious offensive framework lands its second stage this way
  because it never touches disk, defeating naive AV signatures.

  We require the download token (`DownloadString`, `Invoke-WebRequest`,
  `Net.WebClient`, `curl`, `wget`) AND the execution token
  (`IEX`, `Invoke-Expression`, `& {`, `start-process`) together in
  the same `CommandLine:` field. Each side individually is too
  noisy (legitimate package management uses curl; Invoke-Expression
  is sometimes legitimate) but the combination is rarely benign.
references:
  - https://attack.mitre.org/techniques/T1105/
  - https://attack.mitre.org/techniques/T1059/001/
author: ThreatClaw
date: 2026-06-17
tags:
  - attack.command_and_control
  - attack.execution
  - attack.t1105
  - attack.t1059.001
logsource:
  category: syslog
detection:
  program:
    ident: Microsoft-Windows-Sysmon
  process_create:
    'message|contains':
      - 'Process Create:'
  download_token:
    'message|contains':
      - 'DownloadString'
      - 'Invoke-WebRequest'
      - 'Net.WebClient'
      - 'curl '
      - 'wget '
      - 'BitsTransfer'
  exec_token:
    'message|contains':
      - 'IEX'
      - 'Invoke-Expression'
      - 'iex '
      - 'iex('
      - 'start-process'
      - 'Start-Process'
  condition: program and process_create and download_token and exec_token
falsepositives:
  - Some vendor installers self-fetch in-memory. Tag by parent
    process / installer hash once the vendor pattern is confirmed.
level: critical
