title: PowerShell Download Cradle
id: ps-obfusc-003
status: stable
description: |
  Detects PowerShell command lines that invoke the .NET WebClient
  download primitives — `DownloadString`, `DownloadFile`,
  `DownloadData`, or constructing `Net.WebClient` directly. This is
  the canonical download cradle used by fileless droppers to pull a
  staged payload into memory before piping into Invoke-Expression.
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1105/
author: ThreatClaw
date: 2026-06-14
tags:
  - attack.execution
  - attack.t1059.001
  - attack.t1105
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    commandline|contains:
      - 'DownloadString'
      - 'DownloadFile'
      - 'DownloadData'
      - 'Net.WebClient'
      - 'WebClient'
  condition: selection
falsepositives:
  - Software installers and update routines using WebClient legitimately.
  - Build pipelines that reference WebClient samples in documentation.
level: high
