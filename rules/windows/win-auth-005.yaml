title: Pass-the-Hash — NTLM Network Logon
id: win-auth-005
status: stable
description: |
  Detects an NTLM network logon (Event 4624, LogonType 3, AuthenticationPackage
  NTLM) — the on-wire shape of a pass-the-hash lateral movement. Rewritten from the
  legacy bare-token form (matched "4624" in any command line) to the real eventid +
  fields on the Security channel. A separate workflow correlates source IP / account
  to flag the malicious cases vs benign NTLM.
references:
  - https://attack.mitre.org/techniques/T1550/002/
author: ThreatClaw
date: 2026-06-29
tags:
  - attack.lateral_movement
  - attack.t1550.002
logsource:
  category: osquery
  product: windows
  service: security
detection:
  selection:
    channel: Security
    eventid: '4624'
    'data.LogonType': '3'
    'data.AuthenticationPackageName': 'NTLM'
  condition: selection
falsepositives:
  - Legacy apps / non-domain hosts that still authenticate with NTLM over the network. Baseline and scope exceptions to known sources.
level: high
