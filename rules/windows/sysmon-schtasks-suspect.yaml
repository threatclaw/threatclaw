title: Suspicious Scheduled Task Creation
id: sysmon-schtasks-suspect
status: stable
description: |
  Detects `schtasks /create` invocations whose action points to a
  scripting host, LOLBin, or a binary stored under a writable user
  / temp / public folder. This is the dominant persistence step in
  affiliate playbooks (Akira, RansomHub, BlackBasta) and the longest-
  running APT technique (PlugX, ShadowPad). Real RMM-driven tasks
  should be allowlisted by parent process or signer.
references:
  - https://attack.mitre.org/techniques/T1053/005/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_schtasks_creation_susp_folders.yml
author: ThreatClaw
date: 2026-06-14
tags:
  - attack.persistence
  - attack.t1053.005
logsource:
  category: process
detection:
  selection_cmd:
    'commandline|contains':
      - 'schtasks'
  selection_create:
    'commandline|contains':
      - '/create'
  selection_target:
    'commandline|contains':
      - '\AppData\Local\'
      - '\AppData\Roaming\'
      - '\ProgramData\'
      - 'C:\Users\Public\'
      - 'C:\Windows\Temp\'
      - 'powershell'
      - 'rundll32'
      - 'mshta'
      - 'wscript'
      - 'cscript'
      - 'cmd.exe /c'
  condition: selection_cmd and selection_create and selection_target
falsepositives:
  - Legitimate MSP / RMM agents (ConnectWise, Datto, NinjaOne) — gate
    by parent image of the agent or by allowlist on task name.
level: high
