title: Kerberos Golden Ticket — RC4 TGT Anomaly
id: win-auth-004
status: stable
description: |
  Detects a Kerberos TGT or TGS issued with the legacy RC4 encryption
  type (0x17). On any reasonably current Domain Controller this should
  be the exception, not the rule — every native Windows client uses
  AES (0x11 or 0x12). RC4 TGTs are a strong indicator of a forged
  Golden Ticket (mimikatz, Rubeus) where the attacker reuses the
  long-lived NTLM hash of the krbtgt account.

  The previous version of this rule searched for "4768", "4769",
  "RC4", "krbtgt" and "golden" inside a process command line — fields
  these tokens never appear in. The rewrite targets the actual
  Security channel events (4768 = TGT request, 4769 = TGS request)
  emitted by the Domain Controller and read by the osquery
  windows_eventlog collector.
references:
  - https://attack.mitre.org/techniques/T1558/001/
  - https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4768
  - https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4769
author: ThreatClaw
date: 2026-06-15
tags:
  - attack.credential_access
  - attack.t1558.001
logsource:
  category: osquery
  product: windows
  service: security
detection:
  ticket_event:
    channel: Security
    eventid:
      - '4768'
      - '4769'
  weak_encryption:
    'data.TicketEncryptionType': '0x17'
  condition: ticket_event and weak_encryption
falsepositives:
  - Legacy systems that genuinely cannot negotiate AES. Document them
    and add a host-scoped exception rather than disabling the rule.
level: critical
