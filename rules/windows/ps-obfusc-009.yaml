title: PowerShell Add-Type Compilation
id: ps-obfusc-009
status: stable
description: |
  Detects inline C# compilation via Add-Type
references:
  - https://attack.mitre.org/techniques/T1027/004/
author: ThreatClaw
date: 2026-06-14
tags:
  - attack.execution
  - attack.t1027.004
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    'commandline|contains':
      - Add-Type
      - DllImport
      - kernel32
      - user32
  condition: selection
falsepositives:
  - Unknown
level: high
