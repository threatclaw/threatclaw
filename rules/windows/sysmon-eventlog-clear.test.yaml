rule: sysmon-eventlog-clear

positive:
  - description: Clear Security log via wevtutil
    event:
      commandline: 'wevtutil cl Security'
  - description: PowerShell Clear-EventLog
    event:
      commandline: 'powershell.exe Clear-EventLog -LogName Security'
  - description: ClearLog API via reflection
    event:
      commandline: 'powershell -c "[System.Diagnostics.Eventing.Reader.EventLogSession]::GlobalSession.ClearLog($_.LogName)"'

negative:
  - description: Listing event logs (read only)
    event:
      commandline: 'wevtutil el'
  - description: Reading event log entries
    event:
      commandline: 'Get-EventLog -LogName Security -Newest 10'
