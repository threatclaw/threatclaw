title: PowerShell Remoting Lateral Movement
id: ps-obfusc-015
status: stable
description: |
  Detects PS remoting for lateral movement
references:
  - https://attack.mitre.org/techniques/T1021/006/
author: ThreatClaw
date: 2026-06-14
tags:
  - attack.lateral_movement
  - attack.t1021.006
logsource:
  category: process
detection:
  selection:
    'commandline|contains':
      - Enter-PSSession
      - Invoke-Command -Computer
      - New-PSSession
      - Enable-PSRemoting
  condition: selection
falsepositives:
  - Unknown
level: high
