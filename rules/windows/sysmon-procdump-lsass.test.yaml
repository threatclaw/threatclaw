rule: sysmon-procdump-lsass

positive:
  - description: ProcDump full memory of LSASS by name
    event:
      commandline: 'procdump64.exe -accepteula -ma lsass.exe c:\temp\out.dmp'
  - description: ProcDump with explicit lsass name and PID
    event:
      commandline: 'procdump -accepteula -ma 712 lsass.dmp'

negative:
  - description: ProcDump against another process
    event:
      commandline: 'procdump.exe -ma w3wp.exe iisdump.dmp'
  - description: PowerShell with no procdump
    event:
      commandline: 'powershell.exe -ExecutionPolicy Bypass Get-Process'
