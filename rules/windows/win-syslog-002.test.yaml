rule: win-syslog-002

# Pins powershell.exe + -EncodedCommand / -enc shape. The rule must
# not fire on plain `powershell.exe -File script.ps1` (legit) or on
# the routine ScriptBlock log emitted by the agent itself.

positive:
  - description: Sysmon Process Create powershell -EncodedCommand
    event:
      ident: Microsoft-Windows-Sysmon
      message: 'Process Create:  Image: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe  CommandLine: "powershell.exe -nop -w hidden -EncodedCommand JABjAGwAaQBlAG4AdAA9AE4AZQB3AC0ATwBiAGoAZQBjAHQAIABTAHkAcwB0AGUAbQAuAE4AZQB0AC4AVwBlAGIAQwBsAGkAZQBuAHQA"'
  - description: Sysmon Process Create with short -enc flag
    event:
      ident: Microsoft-Windows-Sysmon
      message: 'Process Create:  Image: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe  CommandLine: "powershell.exe -nop -enc JABj..."'
  - description: Sysmon Process Create with uppercase -ENC flag
    event:
      ident: Microsoft-Windows-Sysmon
      message: 'Process Create:  Image: C:\Program Files\PowerShell\7\pwsh.exe  CommandLine: "pwsh.exe -ENC JABj..."'

negative:
  - description: Routine powershell launch with -File switch (no encoded)
    event:
      ident: Microsoft-Windows-Sysmon
      message: 'Process Create:  Image: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe  CommandLine: "powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File C:\ProgramData\ThreatClaw\agent-sync.ps1"'
  - description: Sysmon Process Create cmd.exe with -encoded in a path (not a switch)
    event:
      ident: Microsoft-Windows-Sysmon
      message: 'Process Create:  Image: C:\Windows\System32\cmd.exe  CommandLine: "cmd.exe /c type C:\Logs\encoded-payload.log"'
  - description: PowerShell ScriptBlock log (different ident — must not match this rule)
    event:
      ident: Microsoft-Windows-PowerShell
      message: 'Création du texte Scriptblock : powershell -EncodedCommand JABj...'
