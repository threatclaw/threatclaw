rule: win-auth-003
positive:
  - description: 4662 granting DS-Replication-Get-Changes (DCSync)
    event:
      channel: Security
      eventid: '4662'
      data:
        SubjectUserName: attacker
        Properties: 'Control Access {1131f6aa-9c07-11d1-f79f-00c04fc2dcd2}'
negative:
  - description: 4662 for an unrelated directory access (different GUID)
    event:
      channel: Security
      eventid: '4662'
      data:
        Properties: 'Control Access {00000000-0000-0000-0000-000000000000}'
  - description: Command line that happens to contain "4662" (the old false positive)
    event:
      commandline: 'mimikatz.exe "lsadump::dcsync" exit  rem ref 4662'
