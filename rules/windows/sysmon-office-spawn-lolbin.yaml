title: Office Application Spawning LOLBin
id: sysmon-office-spawn-lolbin
status: stable
description: |
  Office applications (Word, Excel, PowerPoint, Outlook, OneNote) very
  rarely spawn scripting hosts or LOLBins in normal use. When they do,
  it is almost always a macro, an embedded object, or an exploit chain
  (Follina, Qakbot, IcedID, Storm-0978 lures). The signal-to-noise
  ratio of "Office parent + scripting child" is among the highest of
  any Windows detection.
references:
  - https://attack.mitre.org/techniques/T1566/001/
  - https://attack.mitre.org/techniques/T1204/002/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_office_susp_child_processes.yml
author: ThreatClaw
date: 2026-06-14
tags:
  - attack.initial_access
  - attack.execution
  - attack.t1566.001
  - attack.t1204.002
logsource:
  category: process
detection:
  selection_office:
    'commandline|contains':
      - WINWORD.EXE
      - EXCEL.EXE
      - POWERPNT.EXE
      - MSACCESS.EXE
      - ONENOTE.EXE
      - OUTLOOK.EXE
      - EQNEDT32.EXE
      - MSPUB.exe
  selection_child:
    'commandline|contains':
      - powershell.exe
      - pwsh.exe
      - cmd.exe
      - wscript.exe
      - cscript.exe
      - mshta.exe
      - rundll32.exe
      - regsvr32.exe
      - bitsadmin.exe
      - certutil.exe
      - msbuild.exe
      - installutil.exe
  condition: selection_office and selection_child
falsepositives:
  - Old corporate macros calling cmd.exe for printing (rare; allowlist
    on signer hash if encountered).
level: high
