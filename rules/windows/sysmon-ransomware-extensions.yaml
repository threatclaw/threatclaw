title: Ransomware File Extension Written
id: sysmon-ransomware-extensions
status: stable
description: |
  Detects file writes whose name suffix matches the public extension
  of a currently-active ransomware family (LockBit, Akira, BlackBasta,
  Cactus, Rhysida, Medusa, Helldown, 8Base...). This is a last-resort
  detection — by the time the rule fires, encryption is already in
  progress on at least one file — but it remains a high-confidence
  trigger to escalate to IR.
references:
  - https://attack.mitre.org/techniques/T1486/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/file/file_event/file_event_win_shell_write_susp_files_extensions.yml
author: ThreatClaw
date: 2026-06-14
tags:
  - attack.impact
  - attack.t1486
logsource:
  category: syslog
detection:
  selection:
    'full_log|contains':
      - '.lockbit'
      - '.akira'
      - '.basta'
      - '.blackcat'
      - '.bsta'
      - '.locked'
      - '.crypted'
      - '.encrypted'
      - '.lokd'
      - '.faust'
      - '.cactus'
      - '.rhysida'
      - '.medusa'
      - '.nightx'
      - '.8base'
      - '.helldown'
  condition: selection
falsepositives:
  - Corporate vault solutions that legitimately write `.encrypted`
    files; exclude by signing path.
level: critical
