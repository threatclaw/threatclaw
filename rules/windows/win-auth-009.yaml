title: Security Log Cleared
id: win-auth-009
status: stable
description: |
  Detects clearing of the Windows Security event log (Event ID 1102) — a
  classic anti-forensics / defense-evasion step (MITRE T1070.001).

  The previous version matched the literal token "1102" (and phrases like
  "audit log was cleared") inside a process COMMAND LINE, on the sysmon
  logsource. No process command line carries this event reliably, and
  "1102" is a bare number that appears in unrelated command lines — most
  notably ThreatClaw's OWN osquery collector query
  (`... eventid IN (4625,4720,4726,4732,4756,1102) ...`), which runs every
  poll cycle. The rule therefore fired CRITICAL every ~5 minutes on every
  monitored host, detecting nothing but the monitoring itself.

  The rewrite targets the actual Security channel produced by the osquery
  windows_eventlog collector and matches Event ID 1102 on the eventid
  field, mirroring win-auth-010.
references:
  - https://attack.mitre.org/techniques/T1070/001/
  - https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-1102
author: ThreatClaw
date: 2026-06-29
tags:
  - attack.defense_evasion
  - attack.t1070.001
logsource:
  category: osquery
  product: windows
  service: security
detection:
  selection:
    channel: Security
    eventid: '1102'
  condition: selection
falsepositives:
  - Legitimate scheduled log archival/clearing by a backup or SIEM
    forwarder. Document the source host and add a host-scoped exception
    rather than disabling the rule.
level: critical
