rule: win-auth-008
positive:
  - description: A service was installed (7045 on the System channel)
    event:
      channel: System
      eventid: '7045'
      data:
        ServiceName: PSEXESVC
        ImagePath: 'C:\Windows\PSEXESVC.exe'
negative:
  - description: 7045 but on the wrong channel (must be System)
    event:
      channel: Security
      eventid: '7045'
  - description: Command line that happens to contain "7045" (the old false positive)
    event:
      commandline: 'sc.exe query state= all  rem audit 7045'
