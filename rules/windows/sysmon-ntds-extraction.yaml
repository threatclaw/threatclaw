title: NTDS.dit Extraction via ntdsutil
id: sysmon-ntds-extraction
status: stable
description: |
  Detects the Active Directory database (NTDS.dit) being exported
  through `ntdsutil` — a domain-take-over technique used in nearly
  every targeted intrusion that reaches a Domain Controller. The
  classic command shape passes an Install From Media (IFM) snapshot
  via `ifm create full`. Volt Typhoon, APT41 and almost every
  big-game ransomware affiliate use this exact pattern.
references:
  - https://attack.mitre.org/techniques/T1003/003/
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-144a
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_ntdsutil_usage.yml
author: ThreatClaw
date: 2026-06-14
tags:
  - attack.credential_access
  - attack.t1003.003
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    'commandline|contains':
      - 'ntdsutil'
  selection_action:
    'commandline|contains':
      - 'ifm'
      - 'create full'
      - 'ac i ntds'
      - 'activate instance ntds'
  condition: selection and selection_action
falsepositives:
  - Legitimate DC backup performed by an administrator off-hours;
    still worth alerting due to the very low base rate.
level: critical
