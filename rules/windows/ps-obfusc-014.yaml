title: PowerShell Execution Policy Bypass
id: ps-obfusc-014
status: stable
description: |
  Detects execution policy bypass
references:
  - https://attack.mitre.org/techniques/T1059/001/
author: ThreatClaw
date: 2026-06-14
tags:
  - attack.defense_evasion
  - attack.t1059.001
logsource:
  category: process
detection:
  selection:
    'commandline|contains':
      - '-ExecutionPolicy Bypass'
      - '-ep bypass'
      - '-exec bypass'
      - Set-ExecutionPolicy Unrestricted
  condition: selection
falsepositives:
  - Unknown
level: medium
