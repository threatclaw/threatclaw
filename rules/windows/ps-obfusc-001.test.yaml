rule: ps-obfusc-001

positive:
  - description: Encoded command long form
    event:
      commandline: 'powershell.exe -EncodedCommand abc123base64='
  - description: Encoded command short flag
    event:
      commandline: 'powershell -enc xyz'
  - description: Lower-case match
    event:
      commandline: 'powershell.exe -encodedcommand abc'
  - description: With other flags around
    event:
      commandline: 'powershell.exe -NoProfile -EncodedCommand abc -ExecutionPolicy Bypass'

negative:
  - description: Plain PowerShell with no encoded flag
    event:
      commandline: 'powershell.exe Get-Service'
  - description: Different binary entirely
    event:
      commandline: 'cmd.exe /c dir'
  - description: The word "encoded" alone (not the flag)
    event:
      commandline: 'powershell.exe Write-Host "encoded message"'
