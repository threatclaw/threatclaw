title: PowerShell Credential Dumping
id: ps-obfusc-012
status: stable
description: |
  Detects Mimikatz-related PowerShell commands
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: ThreatClaw
date: 2026-06-14
tags:
  - attack.credential_access
  - attack.t1003.001
logsource:
  category: process
detection:
  selection:
    'commandline|contains':
      - Invoke-Mimikatz
      - sekurlsa
      - logonpasswords
      - ConvertTo-SecureString
  condition: selection
falsepositives:
  - Unknown
level: critical
