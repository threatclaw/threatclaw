rule: win-auth-004

positive:
  - description: 4768 TGT request with RC4 encryption — canonical Golden Ticket smell
    event:
      channel: Security
      eventid: '4768'
      data:
        TargetUserName: alice
        ServiceName: krbtgt
        TicketEncryptionType: '0x17'
  - description: 4769 TGS request with RC4 encryption
    event:
      channel: Security
      eventid: '4769'
      data:
        TargetUserName: alice
        ServiceName: 'host/srv-fileserver$'
        TicketEncryptionType: '0x17'

negative:
  - description: 4768 with AES256 encryption (legitimate native Windows client)
    event:
      channel: Security
      eventid: '4768'
      data:
        TargetUserName: alice
        TicketEncryptionType: '0x12'
  - description: Successful interactive logon (different event entirely)
    event:
      channel: Security
      eventid: '4624'
      data:
        LogonType: '2'
        TargetUserName: alice
  - description: Process create event that happens to include "RC4" in its command line
    event:
      commandline: 'openssl enc -rc4 -in /tmp/data -out /tmp/out'
