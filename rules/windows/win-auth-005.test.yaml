rule: win-auth-005
positive:
  - description: NTLM network logon (4624 LogonType 3 + NTLM) — pass-the-hash shape
    event:
      channel: Security
      eventid: '4624'
      data:
        LogonType: '3'
        AuthenticationPackageName: NTLM
        TargetUserName: administrator
        IpAddress: 10.77.0.50
negative:
  - description: Kerberos network logon (4624 LogonType 3 but Kerberos, not NTLM)
    event:
      channel: Security
      eventid: '4624'
      data:
        LogonType: '3'
        AuthenticationPackageName: Kerberos
        TargetUserName: alice
  - description: RDP logon (LogonType 10) — not PtH
    event:
      channel: Security
      eventid: '4624'
      data:
        LogonType: '10'
        AuthenticationPackageName: Negotiate
  - description: Command line that happens to contain "4624 NTLM" (the old false positive)
    event:
      commandline: 'powershell -c "Get-WinEvent -FilterHashtable @{Id=4624} | ? { $_.Message -match \"NTLM\" }"'
