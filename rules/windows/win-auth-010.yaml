title: RDP Interactive Logon (Lateral Movement Candidate)
id: win-auth-010
status: stable
description: |
  Detects a successful Remote Desktop logon (Windows Security event
  4624 with LogonType=10, RemoteInteractive). The previous version of
  this rule tried to match the literal strings "4624", "RDP" and
  "Type 10" inside a process command line — fields that never carry
  those tokens — and instead matched on whatever happened to share a
  byte sequence in the rest of the event (a PID, a port number). The
  rewrite targets the actual Security channel produced by the osquery
  windows_eventlog collector. Every successful RDP arrival is alerted;
  a separate workflow correlates the source IP against the asset
  inventory to flag lateral movement specifically.
references:
  - https://attack.mitre.org/techniques/T1021/001/
  - https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4624
author: ThreatClaw
date: 2026-06-15
tags:
  - attack.lateral_movement
  - attack.t1021.001
logsource:
  category: osquery
  product: windows
  service: security
detection:
  selection:
    channel: Security
    eventid: '4624'
    'data.LogonType': '10'
  condition: selection
falsepositives:
  - Operators connecting to jumpbox / VDI / RD Gateway hosts via the
    expected admin IP range. Add an exception scoped to the source IP
    range used by the operations team.
level: medium
