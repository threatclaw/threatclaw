title: certutil Used as HTTP Downloader
id: sysmon-certutil-download
status: stable
description: |
  Detects abuse of `certutil` to download arbitrary files via its
  `-urlcache` or `-verifyctl` flags. certutil's primary documented
  use is certificate manipulation; its presence as a network
  downloader on an endpoint is overwhelmingly malicious — used in
  ransomware stagers, supply-chain installers and APT toolchains.
references:
  - https://attack.mitre.org/techniques/T1105/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_certutil_download.yml
author: ThreatClaw
date: 2026-06-14
tags:
  - attack.command_and_control
  - attack.t1105
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    'commandline|contains':
      - certutil
  selection_flag:
    'commandline|contains':
      - urlcache
      - verifyctl
      - ' -URL '
  selection_url:
    'commandline|contains':
      - 'http'
  condition: selection and selection_flag and selection_url
falsepositives:
  - Some Adobe / Microsoft installers occasionally use certutil for
    CTL verification — gate by parent process if observed.
level: high
