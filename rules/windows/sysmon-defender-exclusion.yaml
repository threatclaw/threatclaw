title: Windows Defender Exclusion Added
id: sysmon-defender-exclusion
status: stable
description: |
  Detects the addition of a Windows Defender exclusion — by path,
  extension, process, or IP — through PowerShell `Add-MpPreference` /
  `Set-MpPreference`. The action is overwhelmingly seen as part of a
  defence evasion step right before a payload is dropped or executed
  (Qakbot, BlackBasta, RansomHub affiliate playbooks). The same
  signal is mirrored on the registry path
  `\Microsoft\Windows Defender\Exclusions\` for direct reg.exe edits.
references:
  - https://attack.mitre.org/techniques/T1562/001/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_powershell_defender_exclusion.yml
author: ThreatClaw
date: 2026-06-14
tags:
  - attack.defense_evasion
  - attack.t1562.001
logsource:
  category: process
detection:
  selection_cmd:
    'commandline|contains':
      - 'Add-MpPreference'
      - 'Set-MpPreference'
      - 'Windows Defender\Exclusions'
      - 'Microsoft Antimalware\Exclusions'
  selection_kind:
    'commandline|contains':
      - 'ExclusionPath'
      - 'ExclusionExtension'
      - 'ExclusionProcess'
      - 'ExclusionIpAddress'
      - 'Exclusions\Paths'
      - 'Exclusions\Extensions'
  condition: selection_cmd and selection_kind
falsepositives:
  - Genuine IT operation when onboarding an EDR or backup agent that
    needs to be excluded from Defender; surface as low severity but
    still alert.
level: high
