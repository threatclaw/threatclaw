title: RMM tool process activity
id: rmm-tool-process
status: stable
description: Detects execution of a known remote monitoring & management (RMM) tool by image name. RMM software is widely abused as C2 by ransomware affiliates against SMBs (T1219). Indicator list derived from the LOLRMM project.
references:
- https://github.com/magicsword-io/LOLRMM
- https://attack.mitre.org/techniques/T1219/
author: ThreatClaw
date: '2026-06-30'
tags:
- attack.execution
- attack.t1219
