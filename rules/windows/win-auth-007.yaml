# Disabled: legacy bare-token authentication rule, pending rewrite to an eventid-anchored detection.
title: Admin Group Membership Change
id: win-auth-007
status: unsupported
description: |
  Detects user added to admin/privileged group
references:
  - https://attack.mitre.org/techniques/T1098/
author: ThreatClaw
date: 2026-06-14
tags:
  - attack.persistence
  - attack.t1098
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    'commandline|contains':
      - 4728
      - 4732
      - 4756
      - added to
      - Administrators
      - Domain Admins
      - Enterprise Admins
  condition: selection
falsepositives:
  - Unknown
level: high
