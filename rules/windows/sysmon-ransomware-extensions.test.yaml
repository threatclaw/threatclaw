rule: sysmon-ransomware-extensions

positive:
  - description: Akira encryption of a document
    event:
      full_log: 'FileCreate C:\Users\bob\Documents\report.docx.akira'
  - description: LockBit-style ransom note dropped
    event:
      full_log: 'FileCreate C:\Users\bob\Desktop\readme.txt.lockbit'
  - description: BlackBasta encryption extension
    event:
      full_log: 'FileCreate D:\Shared\quarterly.xlsx.basta'

negative:
  - description: Legitimate encrypted blob from vendor vault
    event:
      full_log: 'FileCreate C:\Program Files\KeePass\database.kdbx'
  - description: Plain office file write
    event:
      full_log: 'FileCreate C:\Users\bob\Documents\note.docx'
