title: Service Installed
id: win-auth-008
status: stable
description: |
  Detects installation of a Windows service (Event 7045, System channel) — a common
  persistence / lateral-execution step (PsExec, malicious services). Rewritten from
  the legacy bare-token form to the real eventid. NOTE: 7045 is on the SYSTEM channel
  (not Security); the agent must collect the System eventlog — see the Phase 3
  collection plan; this rule is inert until System events are collected.
references:
  - https://attack.mitre.org/techniques/T1543/003/
author: ThreatClaw
date: 2026-06-29
tags:
  - attack.persistence
  - attack.t1543.003
logsource:
  category: osquery
  product: windows
  service: system
detection:
  selection:
    channel: System
    eventid: '7045'
  condition: selection
falsepositives:
  - Legitimate software / driver installs register services. Baseline known ServiceName / ImagePath and scope exceptions.
level: medium
