rule: sysmon-lsass-comsvcs

positive:
  - description: Classic comsvcs MiniDump dump of LSASS
    event:
      commandline: 'rundll32.exe C:\Windows\System32\comsvcs.dll MiniDump 712 C:\Users\Public\lsass.dmp full'
  - description: Ordinal-based form
    event:
      commandline: 'rundll32 comsvcs,#24 712 C:\ProgramData\dump.bin full'

negative:
  - description: Plain rundll32 for legitimate purpose
    event:
      commandline: 'rundll32.exe shell32.dll,Control_RunDLL desk.cpl'
  - description: comsvcs reference without MiniDump (registration)
    event:
      commandline: 'regsvr32 /s comsvcs.dll'
  - description: PowerShell with no LSASS dump
    event:
      commandline: 'powershell.exe Get-Service'
