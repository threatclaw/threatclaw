title: PowerShell Scheduled Task Persistence
id: ps-obfusc-016
status: stable
description: |
  Detects scheduled task creation for persistence
references:
  - https://attack.mitre.org/techniques/T1053/005/
author: ThreatClaw
date: 2026-06-14
tags:
  - attack.persistence
  - attack.t1053.005
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    'commandline|contains':
      - Register-ScheduledTask
      - New-ScheduledTask
      - schtasks /create
  condition: selection
falsepositives:
  - Unknown
level: high
