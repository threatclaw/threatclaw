title: PowerShell WMI Event Subscription
id: ps-obfusc-018
status: stable
description: |
  Detects WMI-based persistence
references:
  - https://attack.mitre.org/techniques/T1546/003/
author: ThreatClaw
date: 2026-06-14
tags:
  - attack.persistence
  - attack.t1546.003
logsource:
  category: process
detection:
  selection:
    'commandline|contains':
      - Register-WmiEvent
      - Set-WmiInstance
      - __EventFilter
      - __EventConsumer
      - CommandLineEventConsumer
  condition: selection
falsepositives:
  - Unknown
level: high
