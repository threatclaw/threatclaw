title: DCSync — Directory Replication
id: win-auth-003
status: stable
description: |
  Detects a DCSync attack: an Event 4662 (Directory Service object access) granting
  the DS-Replication-Get-Changes control access right (GUID
  1131f6aa-9c07-11d1-f79f-00c04fc2dcd2), used to replicate secrets from AD without
  running on the DC. Rewritten from the legacy bare-token form to the real eventid.
  NOTE: 4662 requires the Directory Service Access audit subcategory AND a SACL on
  the domain object (DC-specific) — see the Phase 3 collection plan; this rule is
  inert until 4662 is collected.
references:
  - https://attack.mitre.org/techniques/T1003/006/
author: ThreatClaw
date: 2026-06-29
tags:
  - attack.credential_access
  - attack.t1003.006
logsource:
  category: osquery
  product: windows
  service: security
detection:
  selection:
    channel: Security
    eventid: '4662'
    'data.Properties|contains': '1131f6aa-9c07-11d1-f79f-00c04fc2dcd2'
  condition: selection
falsepositives:
  - Legitimate domain controller replication uses machine accounts (NT AUTHORITY\\SYSTEM / DC$). Scope an exception to known DC computer accounts.
level: critical
