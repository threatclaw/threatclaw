rule: sysmon-shadow-copy-delete

positive:
  - description: vssadmin classic deletion
    event:
      commandline: 'vssadmin.exe delete shadows /all /quiet'
  - description: wmic-driven deletion
    event:
      commandline: 'wmic shadowcopy delete'
  - description: wbadmin catalog wipe
    event:
      commandline: 'wbadmin delete catalog -quiet'
  - description: PowerShell WMI deletion
    event:
      commandline: 'powershell.exe Get-WmiObject Win32_ShadowCopy | ForEach-Object {$_.Delete()}'

negative:
  - description: vssadmin enumeration only
    event:
      commandline: 'vssadmin.exe list shadows'
  - description: Backup software file copy
    event:
      commandline: 'C:\Program Files\Veeam\veeam.backup.manager.exe job=daily'
