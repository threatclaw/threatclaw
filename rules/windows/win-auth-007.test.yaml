rule: win-auth-007
positive:
  - description: Member added to Administrators (4732, group SID ends -544)
    event:
      channel: Security
      eventid: '4732'
      data:
        TargetSid: 'S-1-5-32-544'
        MemberName: 'CN=backdoor,CN=Users,DC=interstellar,DC=local'
        SubjectUserName: attacker
negative:
  - description: Member added to a non-privileged group (RID -1108)
    event:
      channel: Security
      eventid: '4732'
      data:
        TargetSid: 'S-1-5-21-1111111111-2222222222-3333333333-1108'
        MemberName: alice
  - description: Command line that happens to contain "4732" (the old false positive)
    event:
      commandline: 'wevtutil qe Security /c:1 /q:"*[System[(EventID=4732)]]"'
