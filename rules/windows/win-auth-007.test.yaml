rule: win-auth-007
positive:
  - description: Member added to Domain Admins via global group add (4728, group SID ends -512)
    event:
      channel: Security
      eventid: '4728'
      data:
        TargetSid: 'S-1-5-21-1160273732-2650137834-673545717-512'
        MemberName: 'CN=backdoor,CN=Users,DC=interstellar,DC=local'
        SubjectUserName: attacker
negative:
  - description: Local Administrators add (4732) — handled by the native osquery path, not this rule
    event:
      channel: Security
      eventid: '4732'
      data:
        TargetSid: 'S-1-5-32-544'
        MemberName: 'CN=backdoor,CN=Users,DC=interstellar,DC=local'
        SubjectUserName: attacker
  - description: Member added to a non-privileged global group (RID -1108)
    event:
      channel: Security
      eventid: '4728'
      data:
        TargetSid: 'S-1-5-21-1111111111-2222222222-3333333333-1108'
        MemberName: alice
  - description: Command line that happens to contain "4728" (the old false positive)
    event:
      commandline: 'wevtutil qe Security /c:1 /q:"*[System[(EventID=4728)]]"'
