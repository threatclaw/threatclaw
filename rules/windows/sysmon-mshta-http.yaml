title: mshta Executing Remote HTA / URL
id: sysmon-mshta-http
status: stable
description: |
  Detects the use of mshta.exe to execute a remote HTML application
  or script over HTTP / HTTPS / FTP. The technique is one of the
  longest-running LOLBin abuses, still seen in 2024-2026 affiliate
  loaders (BazarLoader, IcedID, Pikabot). Legitimate intranet HTA
  delivery should be allowlisted by domain rather than disabling the
  rule outright.
references:
  - https://attack.mitre.org/techniques/T1218/005/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_mshta_http.yml
author: ThreatClaw
date: 2026-06-14
tags:
  - attack.defense_evasion
  - attack.t1218.005
logsource:
  category: osquery
  product: sysmon
detection:
  selection:
    'commandline|contains':
      - mshta.exe
      - mshta
  protocol:
    'commandline|contains':
      - 'http://'
      - 'https://'
      - 'ftp://'
      - 'javascript:'
      - 'vbscript:'
  condition: selection and protocol
falsepositives:
  - Legacy intranet HTAs delivered from internal HTTP servers; add the
    domain to the exception list.
level: high
