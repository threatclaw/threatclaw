rule: rmm-suspicious-path
positive:
  - description: RMM from AppData Temp (ransomware staging)
    event:
      commandline: 'C:\Users\bob\AppData\Local\Temp\TeamViewer.exe --install'
  - description: RMM from Downloads
    event:
      commandline: 'C:\Users\bob\Downloads\TeamViewer.exe'
negative:
  - description: RMM from Program Files (legitimate)
    event:
      commandline: 'C:\Program Files\TeamViewer\TeamViewer.exe'
  - description: Non-RMM binary from Temp
    event:
      commandline: 'C:\Windows\Temp\my_update_helper.exe /silent'
