title: ProcDump targeting LSASS
id: sysmon-procdump-lsass
status: stable
description: |
  Detects the Sysinternals ProcDump utility being aimed at the LSASS
  process. ProcDump is a legitimate troubleshooting tool but its use
  against LSASS — directly or against the matching PID — is the
  hallmark of a credential-dumping operation. Most affiliates rename
  the binary; the command-line shape stays the same.
references:
  - https://attack.mitre.org/techniques/T1003/001/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_sysinternals_procdump_lsass.yml
author: ThreatClaw
date: 2026-06-14
tags:
  - attack.credential_access
  - attack.t1003.001
logsource:
  category: process
detection:
  selection_flag:
    'commandline|contains':
      - ' -ma '
      - ' -mm '
      - ' -mp '
  selection_target:
    'commandline|contains':
      - lsass
  condition: selection_flag and selection_target
falsepositives:
  - Microsoft support engineers troubleshooting LSASS crashes (rare,
    coordinated, gated by a ticket).
level: critical
