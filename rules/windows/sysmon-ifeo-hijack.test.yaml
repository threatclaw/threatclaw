rule: sysmon-ifeo-hijack

positive:
  - description: Sticky-keys backdoor via IFEO Debugger
    event:
      commandline: 'reg add "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\sethc.exe" /v Debugger /d "cmd.exe" /f'
  - description: IFEO Debugger pointing to malware in ProgramData
    event:
      commandline: 'reg add "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\taskmgr.exe" /v Debugger /d "C:\ProgramData\x.exe"'

negative:
  - description: ProcDump auto-attach (legit)
    event:
      commandline: 'procdump -i -ma c:\dumps'
  - description: Reading IFEO key
    event:
      commandline: 'reg query "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options"'
