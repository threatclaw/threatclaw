title: PowerShell COM Object Creation
id: ps-obfusc-010
status: stable
description: |
  Detects suspicious COM object usage
references:
  - https://attack.mitre.org/techniques/T1059/001/
author: ThreatClaw
date: 2026-06-14
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: process
detection:
  selection:
    'commandline|contains':
      - New-Object -ComObject
      - WScript.Shell
      - Shell.Application
      - MMC20.Application
  condition: selection
falsepositives:
  - Unknown
level: medium
