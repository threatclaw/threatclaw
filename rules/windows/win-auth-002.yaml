title: Brute Force Authentication
id: win-auth-002
status: stable
description: |
  Detects brute force login attempts via Wazuh rules 5551/5503/5710
references:
  - https://attack.mitre.org/techniques/T1110/001/
author: ThreatClaw
date: 2026-06-14
tags:
  - attack.credential_access
  - attack.t1110.001
logsource:
  category: alert
detection:
  selection:
    'commandline|contains':
      - 5551
      - 5503
      - 5710
      - Multiple authentication failures
      - brute force
  condition: selection
falsepositives:
  - Unknown
level: high
