title: PowerShell Reflection Assembly Load
id: ps-obfusc-007
status: stable
description: |
  Detects in-memory .NET assembly loading
references:
  - https://attack.mitre.org/techniques/T1620/
author: ThreatClaw
date: 2026-06-14
tags:
  - attack.defense_evasion
  - attack.t1620
logsource:
  category: process
detection:
  selection:
    'commandline|contains':
      - '[Reflection.Assembly]::Load'
      - Assembly.Load
      - '[System.Reflection.Assembly]'
  condition: selection
falsepositives:
  - Unknown
level: high
