rule: ps-obfusc-011

# Hand-tuned fixture — selection uses [char], +[char], -join, .replace(,
# [string]::join (PowerShell obfuscation primitives).

positive:
  - description: Char array reconstruction
    event:
      commandline: 'powershell.exe -c "$cmd = [char]65 + [char]66; iex $cmd"'
  - description: String join obfuscation
    event:
      commandline: "powershell.exe -c [string]::join('', $arr)"
  - description: Replace-based string rebuild
    event:
      commandline: "powershell.exe $payload.replace('z','a')"

negative:
  - description: Plain PowerShell command
    event:
      commandline: 'powershell.exe Get-Service'
  - description: cmd.exe with no obfuscation primitive
    event:
      commandline: 'cmd.exe /c notepad.exe'
