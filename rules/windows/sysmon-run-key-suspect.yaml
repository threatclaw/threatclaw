title: Registry Run Key Pointing to Writable Folder
id: sysmon-run-key-suspect
status: stable
description: |
  Detects Run / RunOnce persistence pointing to a binary stored under
  a user-writable location (AppData, ProgramData, Public, Temp, etc.).
  These keys are the most common Windows persistence mechanism in
  active 2024-2026 attacker telemetry. The rule looks at the command
  line that establishes the key — reg.exe add or PowerShell
  Set-ItemProperty — which is what Sysmon EID 1 surfaces in our
  Wazuh-forwarded events.
references:
  - https://attack.mitre.org/techniques/T1547/001/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/registry/registry_set/registry_set_susp_run_key_img_folder.yml
author: ThreatClaw
date: 2026-06-14
tags:
  - attack.persistence
  - attack.t1547.001
logsource:
  category: process
detection:
  selection_key:
    'commandline|contains':
      - '\Software\Microsoft\Windows\CurrentVersion\Run'
      - '\WOW6432Node\Microsoft\Windows\CurrentVersion\Run'
      - '\CurrentVersion\Policies\Explorer\Run'
  selection_path:
    'commandline|contains':
      - '\AppData\Local\Temp'
      - '\AppData\Roaming'
      - '\ProgramData\'
      - '\Users\Public'
      - 'C:\Windows\Temp'
      - '%temp%'
      - '%public%'
      - 'C:\PerfLogs'
  condition: selection_key and selection_path
falsepositives:
  - Some vendor installers (Spotify, Teams updater) drop Run keys in
    AppData — allowlist by binary signer hash if seen.
level: high
