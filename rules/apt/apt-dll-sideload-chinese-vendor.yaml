title: DLL Sideload via Chinese Vendor Signed Binary
id: apt-dll-sideload-chinese-vendor
status: stable
description: |
  Detects signed binaries from Chinese vendors (Tencent QQ, Baidu, 360
  Total Security, Sogou) being launched from locations OUTSIDE their
  legitimate install directories. China-nexus APTs — APT41 / Winnti,
  Mustang Panda / Earth Preta, BRONZE STARLIGHT — heavily abuse DLL
  sideloading via these signed carriers (SentinelOne documented the
  pattern in the Asian Gambling Sector report). The signed binary
  appears trusted; the malicious DLL beside it is the real payload.
references:
  - https://attack.mitre.org/techniques/T1574/002/
  - https://www.sentinelone.com/labs/chinese-entanglement-dll-hijacking-in-the-asian-gambling-sector/
author: ThreatClaw
date: 2026-06-14
tags:
  - attack.persistence
  - attack.defense_evasion
  - attack.t1574.002
logsource:
  category: process
detection:
  selection_binary:
    'commandline|contains':
      - 'QQ.exe'
      - 'QQPCRTP.exe'
      - 'BaiduSdSvc.exe'
      - '360tray.exe'
      - '360safe.exe'
      - 'SogouCloud.exe'
      - 'ETDCtrlHelper.exe'
      - 'RasTls.exe'
  selection_path:
    'commandline|contains':
      - '\AppData\'
      - '\ProgramData\'
      - '\Temp\'
      - '\Users\Public\'
  condition: selection_binary and selection_path
falsepositives:
  - Vendor updater relocating its own binary under `\Updates\`; gate
    by signer hash if encountered.
level: high
