rule: apt-flax-typhoon-masquerade

positive:
  - description: SoftEther VPN renamed conhost in Public folder
    event:
      commandline: 'C:\Users\Public\conhost.exe /silent'
  - description: dllhost from AppData Roaming
    event:
      commandline: 'C:\Users\bob\AppData\Roaming\dllhost.exe'
  - description: svchost from ProgramData
    event:
      commandline: 'C:\ProgramData\Update\svchost.exe -k netsvcs'

negative:
  - description: Legitimate conhost from System32
    event:
      commandline: 'C:\Windows\System32\conhost.exe 0xffffffff -ForceV1'
  - description: dllhost from native location
    event:
      commandline: 'C:\Windows\System32\dllhost.exe /Processid:{12345}'
