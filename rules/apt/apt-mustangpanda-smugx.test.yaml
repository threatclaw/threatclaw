rule: apt-mustangpanda-smugx

positive:
  - description: Note Verbale ZIP dropped by msedge
    event:
      full_log: 'ProcessImage=msedge.exe FileCreate=C:\Users\bob\Downloads\Note_Verbale_FR.zip'
  - description: MOFA-themed ISO from chrome
    event:
      full_log: 'ProcessImage=chrome.exe FileCreate=C:\Users\alice\Downloads\MOFA_Briefing_Q1.iso'
  - description: Embassy JS file
    event:
      full_log: 'ProcessImage=msedge.exe FileCreate=C:\Users\bob\Downloads\Embassy_Schedule.js'

negative:
  - description: Plain ZIP download from browser
    event:
      full_log: 'ProcessImage=chrome.exe FileCreate=C:\Users\bob\Downloads\report.zip'
  - description: Regular Office attachment save
    event:
      full_log: 'ProcessImage=OUTLOOK.EXE FileCreate=C:\Users\bob\Documents\contract.docx'
