rule: apt-volttyphoon-netsh-portproxy

positive:
  - description: Classic Volt Typhoon portproxy add command
    event:
      commandline: 'netsh interface portproxy add v4tov4 listenport=9999 listenaddress=0.0.0.0 connectport=8443 connectaddress=192.0.2.10'
  - description: Variant with explicit ports
    event:
      commandline: 'netsh interface portproxy add v4tov4 listenport=445 connectport=445 connectaddress=10.0.0.1'

negative:
  - description: netsh listing interfaces (read only)
    event:
      commandline: 'netsh interface show interface'
  - description: netsh firewall rule add (different operation)
    event:
      commandline: 'netsh advfirewall firewall add rule name=Allow80 protocol=TCP dir=in localport=80 action=allow'
