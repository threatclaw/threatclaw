rule: apt-dll-sideload-chinese-vendor

positive:
  - description: Tencent QQ binary running from AppData (ShadowPad loader chain)
    event:
      commandline: 'C:\Users\bob\AppData\Roaming\QQ.exe'
  - description: ETDCtrlHelper sideload from ProgramData
    event:
      commandline: 'C:\ProgramData\ETDCtrlHelper.exe loader.dll'
  - description: RasTls signed carrier in Users Public
    event:
      commandline: 'C:\Users\Public\RasTls.exe -silent install'

negative:
  - description: QQ launched from legitimate install dir
    event:
      commandline: 'C:\Program Files\Tencent\QQ\QQ.exe'
  - description: Unrelated signed binary
    event:
      commandline: 'C:\Program Files\7-Zip\7zFM.exe'
