rule: apt-shadowpad-scheduled-task

positive:
  - description: Masquerading GoogleUpdate task pointing to ProgramData
    event:
      commandline: 'schtasks /create /tn "GoogleUpdateTaskMachineUA8" /tr "C:\ProgramData\Update\svc.exe" /sc onlogon'
  - description: AdobeUpdate task pointing to AppData
    event:
      commandline: 'schtasks /create /tn "AdobeUpdate12" /tr "C:\Users\bob\AppData\Roaming\loader.exe"'

negative:
  - description: Genuine GoogleUpdate scheduled task
    event:
      commandline: 'schtasks /create /tn "GoogleUpdateTaskMachineUA" /tr "C:\Program Files (x86)\Google\Update\GoogleUpdate.exe /ua /installsource scheduler"'
  - description: Unrelated scheduled task
    event:
      commandline: 'schtasks /create /tn "BackupNightly" /tr "C:\Program Files\Veeam\agent.exe"'
