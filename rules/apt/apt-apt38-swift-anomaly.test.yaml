rule: apt-apt38-swift-anomaly

positive:
  - description: SWIFT process spawning cmd.exe
    event:
      commandline: 'swift_alliance_access.exe | cmd.exe /c whoami'
  - description: AllianceWorkstation spawning powershell
    event:
      commandline: 'AllianceWorkstation.exe | powershell.exe -nop -enc QQA='
  - description: SWIFT writing a .fin record outside hours
    event:
      commandline: 'swift_alliance.exe writing C:\Alliance\messages\fraud.fin'

negative:
  - description: Regular SWIFT operation
    event:
      commandline: 'swift_alliance_access.exe daemon'
  - description: Unrelated process tree
    event:
      commandline: 'explorer.exe | notepad.exe'
