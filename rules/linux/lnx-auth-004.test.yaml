rule: lnx-auth-004

positive:
  - description: unprivileged user refused by sudo
    event:
      ident: sudo
      message: 'alice : user NOT in sudoers ; TTY=pts/0 ; PWD=/home/alice ; USER=root ; COMMAND=/bin/bash'
  - description: standard sudo refusal trailer
    event:
      ident: sudo
      message: 'eve is not in the sudoers file. This incident will be reported.'

negative:
  - description: routine sudo session for an authorised admin
    event:
      ident: sudo
      message: 'admin : TTY=pts/0 ; PWD=/home/admin ; USER=root ; COMMAND=/usr/bin/apt-get update'
  - description: another program quoting the phrase in a config note
    event:
      ident: rsyslogd
      message: 'config note: "is not in the sudoers file" message is forwarded to siem'
  - description: sudo authentication failure (covered by lnx-auth-003)
    event:
      ident: sudo
      message: 'pam_unix(sudo:auth): authentication failure; logname= uid=1000 euid=0'
