title: Account Promoted To UID 0
id: lnx-acct-002
status: stable
description: |
  Detects a real privilege escalation pattern where an existing account
  is reassigned UID 0 via `usermod` (the canonical Linux post-compromise
  persistence move — a non-root user becomes equivalent to root without
  the auditing layer noticing a fresh "root" account creation).
  The rule requires the auth log to be emitted by the `usermod` program
  AND the message body to carry the literal phrase the userdb library
  writes when the UID is changed. Both clauses are mandatory: the
  earlier single-clause version of this rule fired on every PAM SSH
  failure because `uid=0 euid=0` is part of the standard PAM trailer for
  any login attempt targeting root.
references:
  - https://attack.mitre.org/techniques/T1548/
  - https://man7.org/linux/man-pages/man8/usermod.8.html
author: ThreatClaw
date: 2026-06-15
tags:
  - attack.privilege_escalation
  - attack.t1548
logsource:
  category: syslog
detection:
  program:
    ident: usermod
  uid_change:
    'message|contains|all':
      - change user
      - to 0
  condition: program and uid_change
falsepositives:
  - A sysadmin legitimately running `usermod -u 0 <account>` during a
    planned migration. Extremely rare in practice; the action remains
    worth alerting on even when authorized.
level: critical
