rule: proxmox-002

# Needs user=root@pam AND msg containing "successful auth".

positive:
  - description: Successful root@pam login
    event:
      user: 'root@pam'
      msg: 'successful auth from 10.0.0.1'

negative:
  - description: Successful auth but different user
    event:
      user: 'admin@pve'
      msg: 'successful auth from 10.0.0.1'
  - description: root@pam but failed
    event:
      user: 'root@pam'
      msg: 'failed auth'
