rule: lnx-auth-002

# Pins the strict program + root-targeting trailer match so the rule
# does not regress to bare-`sshd` matching on routine SSH messages.

positive:
  - description: Failed password attempt for root from an external IP
    event:
      ident: sshd
      message: 'Failed password for root from 1.2.3.4 port 49222 ssh2'
  - description: Invalid-user attempt targeting root (PermitRootLogin no)
    event:
      ident: sshd
      message: 'Invalid user root from 1.2.3.4 port 50001'
  - description: Failed publickey attempt for root
    event:
      ident: sshd
      message: 'Failed publickey for root from 1.2.3.4 port 50001 ssh2'

negative:
  - description: Routine SSH session opened for a non-root user
    event:
      ident: sshd
      message: 'pam_unix(sshd:session): session opened for user admin(uid=1000) by (uid=0)'
  - description: Failed password for a regular user (not root)
    event:
      ident: sshd
      message: 'Failed password for admin from 1.2.3.4 port 49222 ssh2'
  - description: sshd connection close without root target
    event:
      ident: sshd
      message: 'Received disconnect from 1.2.3.4 port 49222:11: disconnected by user'
  - description: Other program mentioning sshd should not fire
    event:
      ident: systemd
      message: 'sshd.service: Succeeded.'
