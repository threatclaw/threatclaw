title: MAC Policy Disabled
id: lnx-evasion-002
status: stable
description: |
  SELinux switched to permissive or disabled, or AppArmor torn
  down. Both are classic post-compromise steps before deploying
  payload that the MAC policy would otherwise block. Each token
  is anchored on leading whitespace or a strict prefix so the
  rule does not match an inline mention of the command in some
  unrelated log line.
references:
  - https://attack.mitre.org/techniques/T1562/001/
author: ThreatClaw
date: 2026-06-16
tags:
  - attack.defense_evasion
  - attack.t1562.001
logsource:
  category: syslog
detection:
  command:
    'full_log|contains':
      - ' setenforce 0'
      - 'SELINUX=disabled'
      - 'SELINUX=permissive'
      - ' apparmor_parser -R'
      - ' systemctl disable apparmor'
      - ' systemctl stop apparmor'
      - ' aa-disable '
  prose_filter:
    'full_log|contains':
      - 'config note'
      - 'documentation'
      - 'tutorial'
      - 'reference:'
      - 'do not run'
      - 'never run'
      - 'help reference'
  condition: command and not prose_filter
falsepositives:
  - Planned policy migration window temporarily dropping MAC enforcement to ship a new policy. Apply a time-bounded exception for the window.
level: high
