title: SSH Root Login Attempt
id: lnx-auth-002
status: stable
description: |
  Detects an SSH session targeting the root account where the
  authentication was refused. The earlier rewrite still tripped on
  the bare substring `for root from`, which OpenSSH emits on every
  normal session — even on a successful key login (`Accepted
  publickey for root from ...`) or on the routine
  `Postponed publickey for root from ... [preauth]` message that
  signals the preauth phase finished cleanly. We now require sshd
  AND a trailer sshd only writes when the remote side was actually
  rejected, so legitimate root logins do not page the operator.

  Program identifier: OpenSSH 9.x split the daemon into `sshd`
  (master) and `sshd-session` (forked per-connection). The
  refusal trailers are emitted by the latter, so we accept both.
references:
  - https://attack.mitre.org/techniques/T1078/003/
author: ThreatClaw
date: 2026-06-16
tags:
  - attack.initial_access
  - attack.t1078.003
logsource:
  category: syslog
detection:
  program:
    ident:
      - sshd
      - sshd-session
  root_target:
    'message|contains':
      - 'Invalid user root from'
      - 'Failed password for root from'
      - 'Failed publickey for root from'
      - 'Disconnecting authenticating user root'
      - 'Disconnected from authenticating user root'
      - 'User root from'
  condition: program and root_target
falsepositives:
  - Approved root-allowed bastion or jump host (rare). Apply an
    asset-scoped exception when this is the intentional design.
level: high
