title: SSH Root Login Attempt
id: lnx-auth-002
status: stable
description: |
  Detects an SSH session targeting the root account. Most production
  hosts run with `PermitRootLogin=no`; an attempt against root is a
  policy violation worth flagging. The previous version matched on
  the bare token `sshd`, which fired on every normal SSH session
  message. The rewrite requires the log to be emitted by the sshd
  program AND to carry one of the trailers sshd writes only when the
  remote side requested the root account.
references:
  - https://attack.mitre.org/techniques/T1078/003/
author: ThreatClaw
date: 2026-06-16
tags:
  - attack.initial_access
  - attack.t1078.003
logsource:
  category: syslog
detection:
  program:
    ident: sshd
  root_target:
    'message|contains':
      - 'for root from'
      - 'Invalid user root from'
      - 'Failed password for root from'
      - 'Failed publickey for root from'
  condition: program and root_target
falsepositives:
  - Approved root-allowed bastion or jump host (rare). Apply an
    asset-scoped exception when this is the intentional design.
level: high
