rule: lnx-persist-001

# Auto-generated minimal fixture — hand-polish welcome.
# `positive` events must match the rule; `negative` must not.

positive:
  - description: First positive value from the rule selection
    event:
      full_log: crontab
  - description: Second positive value from the rule selection
    event:
      full_log: /etc/cron

negative:
  - description: Unrelated event that should not trigger
    event:
      full_log: operation completed successfully
