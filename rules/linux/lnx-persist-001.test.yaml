rule: lnx-persist-001

# Tight regression fixtures so the rewrite never drifts back to the
# bare-token shape that produced the v1.0.36 false-positive series.

positive:
  - description: root edits its own crontab on a Debian host
    event:
      ident: cron
      message: '(root) REPLACE (root)'
  - description: standard user edits a crontab on a Debian host
    event:
      ident: cron
      message: '(alice) REPLACE (alice)'
  - description: RHEL-family CROND logging the same operation
    event:
      ident: CROND
      message: '(svc-deploy) REPLACE (svc-deploy)'

negative:
  - description: routine PAM session message when cron wakes up for a job
    event:
      ident: cron
      message: 'pam_unix(cron:session): session opened for user root(uid=0) by root(uid=0)'
  - description: routine run-parts dispatch from /etc/cron.hourly
    event:
      ident: cron
      message: '(root) CMD (cd / && run-parts --report /etc/cron.hourly)'
  - description: crontab LIST is a read, not a modification
    event:
      ident: cron
      message: '(root) LIST (root)'
  - description: another program merely mentioning /etc/cron in its output
    event:
      ident: rsyslogd
      message: 'reloading configuration file /etc/cron.d/notify-on-error'
  - description: REPLACE token in an unrelated context (mysql replication)
    event:
      ident: mysqld
      message: 'REPLACE INTO routine_results VALUES (...)'
