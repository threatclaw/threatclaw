title: Host Firewall Disabled
id: lnx-evasion-001
status: stable
description: |
  Detects firewall teardown commands an attacker runs after gaining
  root: iptables flush, ufw disable, nft flush, or firewalld stop.
  Tokens are anchored on leading whitespace so the match only
  fires when the command actually appears on a command line,
  rather than as a substring inside prose (ticket comment,
  documentation log, chat relay).
references:
  - https://attack.mitre.org/techniques/T1562/004/
author: ThreatClaw
date: 2026-06-16
tags:
  - attack.defense_evasion
  - attack.t1562.004
logsource:
  category: syslog
detection:
  command:
    'full_log|contains':
      - ' iptables -F'
      - ' iptables --flush'
      - ' ufw disable'
      - ' systemctl stop firewalld'
      - ' systemctl disable firewalld'
      - ' nft flush ruleset'
      - ' nft delete table'
  prose_filter:
    'full_log|contains':
      - 'config note'
      - 'documentation'
      - 'tutorial'
      - 'reference:'
      - 'do not run'
      - 'never run'
      - 'help reference'
  condition: command and not prose_filter
falsepositives:
  - Planned maintenance window temporarily disabling the host firewall during a config change. Apply a time-bounded exception for the window.
level: high
