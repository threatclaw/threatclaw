rule: lnx-fim-001

# Pins the program-based scope (only the account-management binaries
# that legitimately write to /etc/passwd, /etc/shadow, /etc/sudoers).
# Reads of these files no longer match — they were the bulk of the
# v1.0.36 false-positive flood.

positive:
  - description: New local user added via useradd
    event:
      ident: useradd
      message: 'new user: name=backdoor, UID=0, GID=0, home=/root, shell=/bin/bash'
  - description: Password reset via passwd binary
    event:
      ident: passwd
      message: 'password changed for backdoor'
  - description: Bulk credential rotation via chpasswd
    event:
      ident: chpasswd
      message: 'pam_unix(chpasswd:chauthtok): password changed for admin'
  - description: User removed via userdel
    event:
      ident: userdel
      message: 'delete user oldsvc'
  - description: Sudoers edited via visudo
    event:
      ident: visudo
      message: 'wrote /etc/sudoers.tmp -> /etc/sudoers'

negative:
  - description: A user reads /etc/passwd with cat — must not fire
    event:
      ident: bash
      message: 'cat /etc/passwd'
  - description: Log rotation referencing /etc/shadow as a config path
    event:
      ident: logrotate
      message: 'reading config file /etc/logrotate.d/shadow'
  - description: pam session referencing /etc/passwd while opening a session
    event:
      ident: sshd
      message: 'pam_unix(sshd:session): session opened for user admin(uid=1000) by (uid=0)'
  - description: tail /etc/passwd by an investigator
    event:
      ident: tail
      message: 'tail -f /etc/passwd'
