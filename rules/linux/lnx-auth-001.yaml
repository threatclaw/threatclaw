title: SSH Password Brute Force
id: lnx-auth-001
status: stable
description: |
  Multiple SSH password failures from the same source — classic brute-force probe
references:
  - https://attack.mitre.org/techniques/T1110/001/
author: ThreatClaw
date: 2026-06-14
tags:
  - attack.credential_access
  - attack.t1110.001
logsource:
  category: syslog
detection:
  selection:
    'full_log|contains':
      - Failed password for
      - sshd
      - authentication failure
  condition: selection
falsepositives:
  - Unknown
level: high
