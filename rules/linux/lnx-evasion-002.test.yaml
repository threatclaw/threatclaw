rule: lnx-evasion-002

positive:
  - description: SELinux switched to permissive at runtime
    event:
      ident: audit
      full_log: 'type=EXECVE msg=audit: argc=2 a0="setenforce" a1="0" by uid=0 invoked: setenforce 0'
  - description: AppArmor profile removed via apparmor_parser
    event:
      ident: apparmor
      full_log: 'invoked: apparmor_parser -R /etc/apparmor.d/usr.sbin.sshd'
  - description: SELinux config file edited to disable enforcement
    event:
      ident: vi
      full_log: 'wrote /etc/selinux/config with SELINUX=disabled at request of uid=0'

negative:
  - description: routine SELinux status check via sestatus
    event:
      ident: sestatus
      full_log: 'sestatus returned: SELinux status: enabled, current mode: enforcing'
  - description: man page opened that mentions setenforce in the description
    event:
      ident: man
      full_log: 'opened /usr/share/man/man8/setenforce.8.gz for reading by uid=1000'
  - description: AppArmor service reloading a policy (not disabling)
    event:
      ident: apparmor
      full_log: 'AppArmor: reloading profile /etc/apparmor.d/usr.sbin.sshd'
