title: Local User Created
id: lnx-acct-001
status: stable
description: |
  A local user or group was added via useradd / adduser / groupadd.
  On a production host with no autoscaling or configuration manager
  this is one of the cleanest persistence signals. The previous
  rule matched on bare contains tokens like "useradd" and "new
  user:" anywhere in the log body, which fired on man pages,
  package install changelogs, and any documentation log mentioning
  the binary. Scope the match to the program ident so only the
  binary itself triggers.
references:
  - https://attack.mitre.org/techniques/T1136/001/
author: ThreatClaw
date: 2026-06-16
tags:
  - attack.persistence
  - attack.t1136.001
logsource:
  category: syslog
detection:
  program:
    ident:
      - useradd
      - adduser
      - groupadd
      - addgroup
  condition: program
falsepositives:
  - Configuration management tooling (Ansible, Puppet, Chef, Salt) provisioning service accounts.
  - Auto-scaling group bootstrap scripts creating the application runtime user on first boot.
level: high
