title: User Crontab Replaced
id: lnx-persist-001
status: stable
description: |
  The cron daemon logged a `(USER) REPLACE (FILE)` message, which
  is the syslog signature emitted whenever a user crontab is added
  or modified (`crontab -e`, `crontab <file>`, or the equivalent
  done by an attacker via a shell). Persistence through a scheduled
  task is one of the most common Linux post-compromise techniques.

  The previous version of this rule matched on bare contains tokens
  like "crontab", "/etc/cron", "crond", "LIST" and "REPLACE", which
  fired on every routine cron session message and every log that
  happened to mention `/etc/cron`. Pin the match to the parenthesised
  REPLACE shape that only crond emits and only on a real crontab
  edit.
references:
  - https://attack.mitre.org/techniques/T1053/003/
author: ThreatClaw
date: 2026-06-16
tags:
  - attack.persistence
  - attack.t1053.003
logsource:
  category: syslog
detection:
  program:
    'ident|cased':
      - crond
      - cron
      - CROND
  modification:
    'message|contains|all':
      - ') REPLACE ('
  condition: program and modification
falsepositives:
  - Legitimate administrator editing a user crontab
  - Configuration management tooling (Ansible, Puppet, Chef, Salt) deploying crontabs
level: medium
