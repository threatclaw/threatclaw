title: Sudo — User Not In Sudoers
id: lnx-auth-004
status: stable
description: |
  The sudo binary logged "is not in the sudoers file" — a user
  without authorisation invoked sudo. On a production host this
  is reconnaissance or escalation. The previous rule matched on
  the bare phrase anywhere in the log body, which would also
  match if any other program emitted the same string for any
  reason. Scope to ident=sudo so the rule is unambiguous.
references:
  - https://attack.mitre.org/techniques/T1548/003/
author: ThreatClaw
date: 2026-06-16
tags:
  - attack.privilege_escalation
  - attack.t1548.003
logsource:
  category: syslog
detection:
  program:
    ident: sudo
  not_authorised:
    'message|contains':
      - 'is not in the sudoers file'
      - 'user NOT in sudoers'
  condition: program and not_authorised
falsepositives:
  - Genuine operator mistake on a shared bastion. Apply an asset-scoped exception when noise overwhelms signal.
level: high
