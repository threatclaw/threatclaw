rule: lnx-evasion-001

positive:
  - description: iptables flush via root shell
    event:
      ident: audit
      full_log: 'type=EXECVE msg=audit: argc=2 a0="iptables" a1="-F" by uid=0 pwd=/root running iptables -F'
  - description: ufw disable via root command line
    event:
      ident: ufw
      full_log: 'Jun 16 14:00 host root: invoking ufw disable to prepare for upgrade'
  - description: firewalld stopped via systemctl
    event:
      ident: systemd
      full_log: 'Jun 16 14:01 host systemd[1]: systemctl stop firewalld.service requested by uid=0'

negative:
  - description: someone discussing iptables on a chat relay (no command)
    event:
      ident: slack-relay
      full_log: 'message from #ops: have you tried iptables -L to list the rules?'
  - description: systemd status query of firewalld (not a stop)
    event:
      ident: systemd
      full_log: 'systemctl status firewalld.service returned: active (running)'
  - description: documentation quoted in a config note
    event:
      ident: rsyslogd
      full_log: 'config note: do not run iptables -F on prod without approval'
