rule: m365-ca-policy-modified

positive:
  - description: CA policy state changed to disabled
    event:
      full_log: 'operationName: Update conditional access policy modifiedProperties.state: enabled to disabled'
  - description: User added to MFA exclusion list
    event:
      full_log: 'Update conditional access policy excludeUsers added: attacker@corp.com grantControls relaxed'
  - description: CA policy deleted with state signal
    event:
      full_log: 'Delete conditional access policy displayName: Require MFA state: disabled grantControls removed'

negative:
  - description: Reading CA policy (no modification)
    event:
      full_log: 'Get-MgIdentityConditionalAccessPolicy'
  - description: Plain user sign-in
    event:
      full_log: 'Sign-in success no policy change'
