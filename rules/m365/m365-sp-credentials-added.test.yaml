rule: m365-sp-credentials-added

positive:
  - description: Service principal credential added
    event:
      full_log: 'operationName: Add service principal credentials Category: ApplicationManagement TargetResources.[].modifiedProperties.[].displayName: PasswordCredentials'
  - description: App update via certificates and secrets management
    event:
      full_log: 'Update application Certificates and secrets management KeyDescription added'

negative:
  - description: Reading service principal config
    event:
      full_log: 'Get-MgServicePrincipal -ServicePrincipalId 12345'
  - description: Standard user sign-in
    event:
      full_log: 'Sign-in success userPrincipalName=user@corp.com'
