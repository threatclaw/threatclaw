rule: m365-mailbox-audit-disabled

positive:
  - description: Set-Mailbox disabling audit on CEO
    event:
      full_log: 'Operation: Set-Mailbox Identity: ceo@corp.com Parameters: AuditEnabled: False'
  - description: Unified audit ingestion disabled
    event:
      full_log: 'Set-OrganizationConfig Parameters: UnifiedAuditLogIngestionEnabled=False'
  - description: MailboxAuditBypassAssociation enabled
    event:
      full_log: 'Set-MailboxAuditBypassAssociation Identity: user@corp.com AuditBypassEnabled: True'

negative:
  - description: Set-Mailbox changing display name (audit untouched)
    event:
      full_log: 'Set-Mailbox Identity: user@corp.com DisplayName: New Name'
  - description: Read mailbox config (no mutation)
    event:
      full_log: 'Get-Mailbox Identity: user@corp.com'
