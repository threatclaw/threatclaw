title: eDiscovery Search or Export by Unusual User
id: m365-ediscovery-misuse
status: stable
description: |
  Detects eDiscovery search creation or export operations — the
  technique NOBELIUM / Midnight Blizzard used in 2023-2024 to exfil
  entire mailbox content at scale once an admin role was reached.
  Combined downstream with a baseline of legitimate eDiscovery users,
  ThreatClaw escalates on operations initiated by a user who has not
  run an eDiscovery search in the preceding 90 days.
references:
  - https://attack.mitre.org/techniques/T1114/002/
  - https://www.microsoft.com/en-us/security/blog/2024/01/25/midnight-blizzard-guidance-for-responders-on-nation-state-attack/
author: ThreatClaw
date: 2026-06-14
tags:
  - attack.collection
  - attack.t1114.002
logsource:
  category: m365
  product: purview
  service: audit
detection:
  selection:
    'full_log|contains':
      - 'SearchCreated'
      - 'SearchExported'
      - 'New-ComplianceSearch'
      - 'New-ComplianceSearchAction'
      - 'Start-ComplianceSearch'
      - 'ComplianceSearchCreated'
  selection_record:
    'full_log|contains':
      - 'RecordType: Discovery'
      - 'Workload: SecurityComplianceCenter'
  condition: selection or selection_record
falsepositives:
  - Legal or HR running regulatory DSAR — these users should be on
    the legitimate baseline. The first alert per user is the
    important one; subsequent fires from baselined users can be
    dropped.
level: high
