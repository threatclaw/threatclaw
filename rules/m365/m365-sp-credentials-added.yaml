title: Service Principal Credentials Added — Backdoor Pattern
id: m365-sp-credentials-added
status: stable
description: |
  Detects a credential (client secret or certificate) being added to
  an Entra ID Service Principal. Attackers who reach Application
  Administrator or Cloud Application Administrator privilege use
  this to plant a persistent backdoor: even after a password reset
  on the user side, they can still authenticate as the application
  with the rogue secret. The Red Canary 2024 BEC report and Stratus
  Red Team document this as the dominant cloud-persistence pattern.
references:
  - https://attack.mitre.org/techniques/T1098/001/
  - https://redcanary.com/blog/threat-detection/entra-id-service-principals/
  - https://stratus-red-team.cloud/attack-techniques/entra-id/entra-id.persistence.backdoor-application-sp/
author: ThreatClaw
date: 2026-06-14
tags:
  - attack.persistence
  - attack.t1098.001
logsource:
  category: m365
  product: entra
  service: audit
detection:
  selection:
    'full_log|contains':
      - 'Add service principal credentials'
      - 'Update application – Certificates and secrets management'
      - 'Update application Certificates and secrets management'
  selection_artifact:
    'full_log|contains':
      - 'KeyDescription'
      - 'PasswordCredentials'
      - 'KeyCredentials'
  condition: selection or selection_artifact
falsepositives:
  - Legitimate app secret rotation performed by the development team.
    Rare in SMB environments — investigate every alert.
level: critical
