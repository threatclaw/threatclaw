title: BEC Inbox Rule — Hidden Forward or Delete
id: m365-inbox-rule-forward
status: stable
description: |
  Detects the creation of a malicious mailbox rule used in Business
  Email Compromise (BEC) to hide attacker activity from the user.
  Two patterns are flagged: (1) a rule that forwards or redirects
  messages to an external recipient, and (2) a rule that moves
  messages matching BEC keywords (`invoice`, `payment`, `wire`,
  `IBAN`, `RIB`, `virement`, `facture`, `swift`) to Deleted Items,
  Junk, RSS Feeds or Conversation History. Huntress 2024 / 2025 BEC
  IR data shows hidden inbox rules in 90%+ of compromises.
references:
  - https://attack.mitre.org/techniques/T1564/008/
  - https://www.huntress.com/cybersecurity-insights/microsoft-365-hidden-inbox-rule-detection
author: ThreatClaw
date: 2026-06-14
tags:
  - attack.defense_evasion
  - attack.collection
  - attack.t1564.008
logsource:
  category: m365
  product: exchange
  service: audit
detection:
  selection_op:
    'full_log|contains':
      - 'New-InboxRule'
      - 'Set-InboxRule'
      - 'UpdateInboxRules'
  selection_kind:
    'full_log|contains':
      - 'ForwardTo'
      - 'ForwardAsAttachmentTo'
      - 'RedirectTo'
      - 'MoveToFolder: RSS Feeds'
      - 'MoveToFolder: Conversation History'
      - 'MarkAsRead'
      - 'invoice'
      - 'payment'
      - 'wire'
      - 'virement'
      - 'facture'
      - 'IBAN'
      - 'RIB'
      - 'swift'
  condition: selection_op and selection_kind
falsepositives:
  - Legitimate vacation forwarders set up through the Outlook UI;
    gate by destination external domain.
level: critical
