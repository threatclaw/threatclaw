rule: m365-privileged-role-assigned

positive:
  - description: Direct Global Admin assignment
    event:
      full_log: 'operationName: Add member to role Category: RoleManagement Role: Global Administrator LoggedByService: Core Directory'
  - description: User Administrator assigned to sock-puppet
    event:
      full_log: 'Add member to role TargetResources.modifiedProperties: User Administrator initiatedBy: compromised-admin@corp.com'

negative:
  - description: PIM activation (legitimate JIT)
    event:
      full_log: 'Add member to role Global Administrator initiatedBy: MS-PIM PIM activation'
  - description: Role removal
    event:
      full_log: 'Remove member from role User Administrator'
