rule: opnsense-fw-005

# Block AND dst_port in known C2 / mining list.

positive:
  - description: Block 5555 (sometimes mining pool)
    event:
      action: block
      dst_port: 5555
  - description: Block 7777
    event:
      action: block
      dst_port: 7777

negative:
  - description: Block on a safe port
    event:
      action: block
      dst_port: 443
  - description: Pass on flagged port
    event:
      action: pass
      dst_port: 5555
