title: OPNsense resolver restarted / reconfigured
id: opnsense-dns-004
status: stable
description: |
  unbound was started or reloaded — verify the operator was authorized. On a stable site this should happen at most once a quarter.
author: ThreatClaw
date: 2026-06-14
tags:
  - attack.defense_evasion
logsource:
  category: opnsense
  product: opnsense
detection:
  selection:
    'line|contains':
      - start of service
      - service stopped
      - config file
      - reading config
  condition: selection
falsepositives:
  - Unknown
level: low
