title: OPNsense admin login
id: opnsense-002
status: stable
description: |
  Successful admin login on OPNsense (GUI, SSH, or API). Verify it matches an authorized operator window.
references:
  - https://attack.mitre.org/techniques/T1078/
author: ThreatClaw
date: 2026-06-14
tags:
  - attack.initial_access
  - attack.t1078
logsource:
  category: opnsense
  product: opnsense
detection:
  selection:
    'line|contains':
      - successful login
      - Accepted password
      - Accepted publickey
      - 'user ''root'' logged'
  condition: selection
falsepositives:
  - Unknown
level: low
