rule: opnsense-fw-002

# action=block AND dst_port=3389 AND direction=in (inbound RDP).

positive:
  - description: Inbound RDP blocked
    event:
      action: block
      dst_port: 3389
      direction: in

negative:
  - description: Outbound RDP allowed
    event:
      action: block
      dst_port: 3389
      direction: out
  - description: Block on non-RDP
    event:
      action: block
      dst_port: 22
      direction: in
