title: OPNsense resolver rate-limited
id: opnsense-dns-007
status: stable
description: |
  unbound rejected DNS queries via its rate limiter. Most often: misbehaving internal app loop. Sometimes: attacker probing the resolver.
author: ThreatClaw
date: 2026-06-14
tags:
  - attack.discovery
logsource:
  category: opnsense
  product: opnsense
detection:
  selection:
    'line|contains':
      - rejected by ip ratelimiting
      - ratelimit
      - exceeded the rate limit
  condition: selection
falsepositives:
  - Unknown
level: low
