rule: opnsense-fw-001

# Block action AND dst_port in suspicious list (4444, 31337, ...).

positive:
  - description: Block 4444 metasploit default
    event:
      action: block
      dst_port: 4444
  - description: Block 31337 elite port
    event:
      action: block
      dst_port: 31337

negative:
  - description: Block on safe port
    event:
      action: block
      dst_port: 443
  - description: Pass action on flagged port
    event:
      action: pass
      dst_port: 4444
