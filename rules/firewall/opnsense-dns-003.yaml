title: OPNsense resolver blacklist hit
id: opnsense-dns-003
status: stable
description: |
  unbound refused to answer a query because the target was on a configured blocklist (Mozilla anti-malware / corporate blocklist / configd block list).
references:
  - https://attack.mitre.org/techniques/T1071/004/
author: ThreatClaw
date: 2026-06-14
tags:
  - attack.command_and_control
  - attack.t1071.004
logsource:
  category: opnsense
  product: opnsense
detection:
  selection:
    'line|contains':
      - blocked by
      - blacklisted
      - is blocked
  condition: selection
falsepositives:
  - Unknown
level: medium
