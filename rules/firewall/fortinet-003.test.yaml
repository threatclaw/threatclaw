rule: fortinet-003

# Selection requires both msg containing Edit/Add/Delete AND subtype=config.

positive:
  - description: Config edit event
    event:
      msg: 'Edit firewall policy 13'
      subtype: config
  - description: Config add event
    event:
      msg: 'Add user admin2'
      subtype: config

negative:
  - description: Edit in a non-config subtype
    event:
      msg: 'Edit interface'
      subtype: traffic
  - description: Plain syslog entry
    event:
      msg: 'session closed'
      subtype: traffic
