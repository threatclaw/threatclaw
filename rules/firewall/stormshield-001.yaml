title: Stormshield SNS IPS alarm
id: stormshield-001
status: stable
description: |
  Stormshield SNS raised an IPS/IDS alarm on traffic crossing the firewall. Investigate the alarm class and the src/dst pair.
references:
  - https://attack.mitre.org/techniques/T1046/
author: ThreatClaw
date: 2026-06-21
tags:
  - attack.discovery
  - attack.t1046
logsource:
  category: syslog
detection:
  # SNS logs arrive over syslog; fluent-bit's RFC3164 parser leaves the SNS
  # key=value payload under `message`. `logtype="alarm"` (with the quoted
  # value) is SNS-specific phrasing, so it identifies an SNS IPS alarm without
  # a vendor-specific logsource/tag.
  selection:
    'message|contains': 'logtype="alarm"'
  condition: selection
falsepositives:
  - Benign IPS signatures (auto-updaters, policy probes) — filtered by the Stormshield IDS normalizer
level: high
