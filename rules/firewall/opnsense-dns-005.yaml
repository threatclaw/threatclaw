title: OPNsense DHCP pool exhausted
id: opnsense-dns-005
status: stable
description: |
  dnsmasq could not assign an address — pool genuinely full OR DHCP starvation attack (Yersinia / dhcpig). Verify against the LAN client count.
references:
  - https://attack.mitre.org/techniques/T1499/004/
author: ThreatClaw
date: 2026-06-14
tags:
  - attack.impact
  - attack.t1499.004
logsource:
  category: opnsense
  product: opnsense
detection:
  selection:
    'line|contains':
      - no address range available
      - no free addresses
      - DHCPNAK
  condition: selection
falsepositives:
  - Unknown
level: medium
