title: Block UDP amplification probe
id: opnsense-fw-004
status: stable
description: |
  Block on a known UDP amplification port (Memcached 11211, NTP monlist 123, CLDAP 389)
references:
  - https://attack.mitre.org/techniques/T1498/002/
author: ThreatClaw
date: 2026-06-14
tags:
  - attack.impact
  - attack.t1498.002
logsource:
  category: firewall
  product: opnsense
detection:
  selection:
    action: block
    proto: udp
    dst_port:
      - 11211
      - 1900
      - 389
  condition: selection
falsepositives:
  - Unknown
level: medium
