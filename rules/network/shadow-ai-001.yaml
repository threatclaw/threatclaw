title: Shadow AI — Commercial LLM API (TLS SNI)
id: shadow-ai-001
status: stable
description: |
  Detects TLS handshake (ssl.log) with SNI targeting a known commercial LLM endpoint. May indicate unauthorized ChatGPT/Claude/Gemini/Mistral/Copilot usage. Qualified by skill shadow-ai-monitor against policy whitelist.
references:
  - https://attack.mitre.org/techniques/T1567/004/
author: ThreatClaw
date: 2026-06-14
tags:
  - attack.exfiltration
  - attack.t1567.004
  - ai.governance
  - ai.shadow
  - ai.commercial
logsource:
  category: zeek
detection:
  selection:
    'server_name|contains':
      - api.openai.com
      - chatgpt.com
      - chat.openai.com
      - oaiusercontent.com
      - platform.openai.com
      - api.anthropic.com
      - claude.ai
      - console.anthropic.com
      - generativelanguage.googleapis.com
      - gemini.google.com
      - aistudio.google.com
      - api.mistral.ai
      - chat.mistral.ai
      - le-chat.mistral.ai
      - copilot.microsoft.com
      - api.cohere.ai
      - openrouter.ai
      - api.together.xyz
      - api.together.ai
      - api.groq.com
      - api.fireworks.ai
      - api.perplexity.ai
      - perplexity.ai
      - api.x.ai
      - grok.com
      - api.deepseek.com
      - chat.deepseek.com
      - api-inference.huggingface.co
      - endpoints.huggingface.cloud
      - api.cursor.sh
      - api.githubcopilot.com
      - api.codeium.com
      - api.tabnine.com
      - windsurf.com
  condition: selection
falsepositives:
  - Unknown
level: medium
