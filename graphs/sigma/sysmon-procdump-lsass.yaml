spec_version: cacao-2.0
name: sysmon-procdump-lsass
description: |
  Sigma "ProcDump targeting LSASS" (sysmon-procdump-lsass) : procdump -ma sur
  lsass.exe (T1003.001). Outil legitime detourne pour voler les credentials.
  Toujours INCIDENT critical — reponse containment + forensic (HITL).
trigger:
  sigma_rule: sysmon-procdump-lsass
steps:
  start: { type: start, on_completion: emit_incident }
  emit_incident:
    type: action
    command:
      type: threatclaw-emit-incident
      severity: critical
      proposed_actions:
        - { cmd_id: velociraptor_kill_process, rationale: "Tuer procdump ciblant LSASS", requires_hitl: true }
        - { cmd_id: velociraptor_isolate_host, rationale: "Isoler — vol de credentials en cours", requires_hitl: true }
        - { cmd_id: velociraptor_collect_artifacts, rationale: "Collecter le .dmp genere et la cmdline", requires_hitl: true }
    on_completion: terminal
  terminal: { type: end }
