spec_version: cacao-2.0
name: apt-storm0558-token-forge
description: |
  Sigma "Storm-0558 Token Forging" (apt-storm0558-token-forge) : acces mail
  anormal via token forge (Storm-0558, vol de cle de signature Azure AD).
  INCIDENT critical cloud/identite — revocation + rotation (HITL).
trigger:
  sigma_rule: apt-storm0558-token-forge
steps:
  start: { type: start, on_completion: emit_incident }
  emit_incident:
    type: action
    command:
      type: threatclaw-emit-incident
      severity: critical
      proposed_actions:
        - { cmd_id: azuread_disable_user, rationale: "Suspendre le compte dont le token est forge", requires_hitl: true }
        - { cmd_id: azuread_reset_password, rationale: "Revoquer sessions + rotation credentials (revoir cles de signature)", requires_hitl: true }
    on_completion: terminal
  terminal: { type: end }
