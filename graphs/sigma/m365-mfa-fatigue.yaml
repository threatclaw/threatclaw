spec_version: cacao-2.0
name: m365-mfa-fatigue
description: |
  Sigma "MFA Fatigue Denied Push Then Accepted" (m365-mfa-fatigue) : MFA fatigue (push refuses puis accepte) — compromission probable du compte.
  Detection identite/cloud haute-fidelite -> INCIDENT high, containment identite (HITL).
trigger:
  sigma_rule: m365-mfa-fatigue
steps:
  start: { type: start, on_completion: emit_incident }
  emit_incident:
    type: action
    command:
      type: threatclaw-emit-incident
      severity: high
      proposed_actions:
        - { cmd_id: azuread_disable_user, rationale: "Suspendre le compte implique le temps de l investigation", requires_hitl: true }
        - { cmd_id: azuread_reset_password, rationale: "Revoquer les sessions + rotation du mot de passe", requires_hitl: true }
    on_completion: terminal
  terminal: { type: end }
