spec_version: cacao-2.0
name: apt-chinachopper-webshell
description: |
  Sigma "China Chopper Webshell Pattern" (apt-chinachopper-webshell) : pattern de webshell China Chopper (w3wp/httpd lance cmd/powershell) — acces distant attaquant.
  Detection nommee haute-fidelite -> INCIDENT critical direct, containment + forensic (HITL).
trigger:
  sigma_rule: apt-chinachopper-webshell
steps:
  start: { type: start, on_completion: emit_incident }
  emit_incident:
    type: action
    command:
      type: threatclaw-emit-incident
      severity: critical
      proposed_actions:
        - { cmd_id: velociraptor_kill_process, rationale: "Tuer le process malveillant", requires_hitl: true }
        - { cmd_id: velociraptor_isolate_host, rationale: "Isoler l endpoint compromis", requires_hitl: true }
        - { cmd_id: velociraptor_collect_artifacts, rationale: "Collecter arbre de process + chronologie", requires_hitl: true }
    on_completion: terminal
  terminal: { type: end }
