spec_version: cacao-2.0
name: powershell-suspicious
description: |
  Sigma "PowerShell suspect" (osquery-win-powershell-suspicious) : patterns PowerShell suspects (remote-download, encoded, etc.) — bruyant (admins legitimes).
  Triage : asset critique (>=7) OU activite corroboree (>=2 alertes/1h) -> INCIDENT ;
  sinon -> investigation LLM (jamais d'auto-archive d'un signal PowerShell).
trigger:
  sigma_rule: osquery-win-powershell-suspicious
steps:
  start: { type: start, on_completion: check_criticality }
  check_criticality:
    type: if-condition
    condition: "asset.criticality_score >= 7"
    on_true: emit_incident
    on_false: check_corroborated
  check_corroborated:
    type: if-condition
    condition: "signals.corroborated"
    on_true: emit_incident
    on_false: route_llm
  emit_incident:
    type: action
    command:
      type: threatclaw-emit-incident
      severity: high
      proposed_actions:
        - { cmd_id: velociraptor_isolate_host, rationale: "PowerShell suspect confirme/critique — isoler", requires_hitl: true }
        - { cmd_id: velociraptor_collect_artifacts, rationale: "PS history + parent process + script", requires_hitl: true }
    on_completion: terminal
  route_llm:
    type: action
    command:
      type: threatclaw-investigate-llm
      timeout_secs: 1500
    on_completion: terminal
  terminal: { type: end }
