spec_version: cacao-2.0
name: m365-mailbox-audit-disabled
description: |
  Sigma "Mailbox Audit Logging Disabled" (m365-mailbox-audit-disabled) :
  desactivation de l audit mailbox — anti-forensic typique post-compromis.
  INCIDENT critical — reactiver l audit + suspendre l acteur (HITL).
trigger:
  sigma_rule: m365-mailbox-audit-disabled
steps:
  start: { type: start, on_completion: emit_incident }
  emit_incident:
    type: action
    command:
      type: threatclaw-emit-incident
      severity: critical
      proposed_actions:
        - { cmd_id: azuread_disable_user, rationale: "Suspendre l acteur ayant desactive l audit", requires_hitl: true }
    on_completion: terminal
  terminal: { type: end }
