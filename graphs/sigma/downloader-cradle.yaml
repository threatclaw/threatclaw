spec_version: cacao-2.0
name: downloader-cradle
description: |
  Sigma "Sysmon Process Create With Downloader-Cradle Command Line"
  (win-syslog-003) : cmdline de telechargement-execution (IEX DownloadString,
  certutil -urlcache, bitsadmin /transfer...). Stager de payload. INCIDENT
  critical — containment + collecte de la 2e charge (HITL).
trigger:
  sigma_rule: win-syslog-003
steps:
  start: { type: start, on_completion: emit_incident }
  emit_incident:
    type: action
    command:
      type: threatclaw-emit-incident
      severity: critical
      proposed_actions:
        - { cmd_id: velociraptor_isolate_host, rationale: "Isoler — stager de payload actif", requires_hitl: true }
        - { cmd_id: velociraptor_kill_process, rationale: "Tuer le downloader", requires_hitl: true }
        - { cmd_id: velociraptor_collect_artifacts, rationale: "URL/payload telecharge + parent", requires_hitl: true }
    on_completion: terminal
  terminal: { type: end }
