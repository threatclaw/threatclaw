spec_version: cacao-2.0
name: m365-ca-policy-modified
description: |
  Sigma "Conditional Access Policy Disabled or Weakened" (m365-ca-policy-modified)
  : affaiblissement d une policy d acces conditionnel — l attaquant baisse les
  defenses. INCIDENT critical — restaurer la policy + suspendre l acteur (HITL).
trigger:
  sigma_rule: m365-ca-policy-modified
steps:
  start: { type: start, on_completion: emit_incident }
  emit_incident:
    type: action
    command:
      type: threatclaw-emit-incident
      severity: critical
      proposed_actions:
        - { cmd_id: azuread_disable_user, rationale: "Suspendre l acteur ayant modifie la CA policy (restaurer la policy)", requires_hitl: true }
    on_completion: terminal
  terminal: { type: end }
