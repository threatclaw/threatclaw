spec_version: cacao-2.0
name: lnx-mac-policy-disabled
description: |
  Sigma "MAC Policy Disabled" (lnx-evasion-002) : desactivation SELinux/AppArmor
  (T1562.001) — l attaquant baisse les defenses. INCIDENT high, reactiver (HITL).
trigger:
  sigma_rule: lnx-evasion-002
steps:
  start: { type: start, on_completion: emit_incident }
  emit_incident:
    type: action
    command:
      type: threatclaw-emit-incident
      severity: high
      proposed_actions:
        - { cmd_id: velociraptor_collect_artifacts, rationale: "Qui a desactive SELinux/AppArmor + chronologie", requires_hitl: true }
    on_completion: terminal
  terminal: { type: end }
