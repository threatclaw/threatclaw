spec_version: cacao-2.0
name: lnx-sudo-not-sudoers
description: |
  Sigma "Sudo User Not In Sudoers" (lnx-auth-004) : tentative sudo par un user
  hors sudoers (T1548.003) — escalade de privilege tentee. INCIDENT high.
trigger:
  sigma_rule: lnx-auth-004
steps:
  start: { type: start, on_completion: emit_incident }
  emit_incident:
    type: action
    command:
      type: threatclaw-emit-incident
      severity: high
      proposed_actions:
        - { cmd_id: velociraptor_collect_artifacts, rationale: "auth.log + historique shell du compte", requires_hitl: true }
    on_completion: terminal
  terminal: { type: end }
