spec_version: cacao-2.0
name: ps-credential-dumping
description: |
  Sigma "PowerShell Credential Dumping" (ps-obfusc-012) : patterns de dump de
  credentials via PowerShell (Mimikatz/Invoke-, sekurlsa, lsass). Toujours
  INCIDENT critical — containment + forensic (HITL).
trigger:
  sigma_rule: ps-obfusc-012
steps:
  start: { type: start, on_completion: emit_incident }
  emit_incident:
    type: action
    command:
      type: threatclaw-emit-incident
      severity: critical
      proposed_actions:
        - { cmd_id: velociraptor_kill_process, rationale: "Tuer le PowerShell de dump", requires_hitl: true }
        - { cmd_id: velociraptor_isolate_host, rationale: "Isoler — credentials potentiellement voles", requires_hitl: true }
        - { cmd_id: velociraptor_collect_artifacts, rationale: "PS history + parent process", requires_hitl: true }
    on_completion: terminal
  terminal: { type: end }
