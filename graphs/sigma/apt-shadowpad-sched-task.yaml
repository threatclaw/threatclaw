spec_version: cacao-2.0
name: apt-shadowpad-sched-task
description: |
  Sigma "ShadowPad Persistence Updater-Themed Scheduled Task" (apt-shadowpad-scheduled-task) : tache planifiee themee updater (ShadowPad) — persistance.
  Detection nommee haute-fidelite -> INCIDENT high direct, containment + forensic (HITL).
trigger:
  sigma_rule: apt-shadowpad-scheduled-task
steps:
  start: { type: start, on_completion: emit_incident }
  emit_incident:
    type: action
    command:
      type: threatclaw-emit-incident
      severity: high
      proposed_actions:
        - { cmd_id: velociraptor_isolate_host, rationale: "Isoler l endpoint compromis", requires_hitl: true }
        - { cmd_id: velociraptor_collect_artifacts, rationale: "Collecter arbre de process + persistance + chronologie", requires_hitl: true }
    on_completion: terminal
  terminal: { type: end }
