spec_version: cacao-2.0
name: apt-flax-typhoon-masquerade
description: |
  Sigma "Flax Typhoon Conhost / Dllhost Masquerading" (apt-flax-typhoon-masquerade) : masquerading conhost/dllhost (Flax Typhoon, APT chinois) — persistance furtive.
  Detection nommee haute-fidelite -> INCIDENT critical direct, containment + forensic (HITL).
trigger:
  sigma_rule: apt-flax-typhoon-masquerade
steps:
  start: { type: start, on_completion: emit_incident }
  emit_incident:
    type: action
    command:
      type: threatclaw-emit-incident
      severity: critical
      proposed_actions:
        - { cmd_id: velociraptor_isolate_host, rationale: "Isoler l endpoint compromis", requires_hitl: true }
        - { cmd_id: velociraptor_collect_artifacts, rationale: "Collecter arbre de process + persistance + chronologie", requires_hitl: true }
    on_completion: terminal
  terminal: { type: end }
