spec_version: cacao-2.0
name: reflective-loader
description: |
  Sigma "PowerShell ScriptBlock With Reflective Loader Pattern" (win-syslog-004)
  : chargement reflectif d'assembly en memoire (T1620, in-memory execution).
  Technique d'evasion typique des loaders/C2. INCIDENT critical — containment
  + forensic memoire (HITL).
trigger:
  sigma_rule: win-syslog-004
steps:
  start: { type: start, on_completion: emit_incident }
  emit_incident:
    type: action
    command:
      type: threatclaw-emit-incident
      severity: critical
      proposed_actions:
        - { cmd_id: velociraptor_isolate_host, rationale: "Isoler — execution en memoire (loader/C2)", requires_hitl: true }
        - { cmd_id: velociraptor_kill_process, rationale: "Tuer le PowerShell hote", requires_hitl: true }
        - { cmd_id: velociraptor_collect_artifacts, rationale: "Dump memoire + PS history", requires_hitl: true }
    on_completion: terminal
  terminal: { type: end }
