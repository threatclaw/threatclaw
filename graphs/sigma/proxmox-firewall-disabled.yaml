spec_version: cacao-2.0
name: proxmox-firewall-disabled
description: |
  Sigma "Proxmox firewall disabled" (proxmox-005) : firewall Proxmox desactive — defense de l hyperviseur baissee.
  INCIDENT critical — restaurer le controle + investiguer l acteur (revert manuel cote infra).
trigger:
  sigma_rule: proxmox-005
steps:
  start: { type: start, on_completion: emit_incident }
  emit_incident:
    type: action
    command: { type: threatclaw-emit-incident, severity: critical }
    on_completion: terminal
  terminal: { type: end }
