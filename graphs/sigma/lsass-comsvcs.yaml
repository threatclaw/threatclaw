spec_version: cacao-2.0
name: lsass-comsvcs
description: |
  Sigma "LSASS MiniDump via comsvcs.dll" (sysmon-lsass-comsvcs) : dump de la
  memoire LSASS via rundll32 comsvcs.dll MiniDump (T1003.001). Quasi-zero FP —
  technique de vol de credentials. Toujours INCIDENT critical.
  Reponse : isoler l'endpoint + tuer le process + collecter (HITL).
trigger:
  sigma_rule: sysmon-lsass-comsvcs
steps:
  start: { type: start, on_completion: emit_incident }
  emit_incident:
    type: action
    command:
      type: threatclaw-emit-incident
      severity: critical
      proposed_actions:
        - { cmd_id: velociraptor_kill_process, rationale: "Tuer le process qui dumpe LSASS", requires_hitl: true }
        - { cmd_id: velociraptor_isolate_host, rationale: "Isoler l'endpoint — credentials potentiellement voles", requires_hitl: true }
        - { cmd_id: velociraptor_collect_artifacts, rationale: "Collecter le dump + l'arbre de process parent", requires_hitl: true }
    on_completion: terminal
  terminal: { type: end }
