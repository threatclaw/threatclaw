spec_version: cacao-2.0
name: fortinet-policy-disabled
description: |
  Sigma "FortiGate policy disabled" (fortinet-004) : policy firewall FortiGate desactivee — defense baissee (post-compromis probable).
  INCIDENT critical — restaurer le controle + investiguer l acteur (revert manuel cote infra).
trigger:
  sigma_rule: fortinet-004
steps:
  start: { type: start, on_completion: emit_incident }
  emit_incident:
    type: action
    command: { type: threatclaw-emit-incident, severity: critical }
    on_completion: terminal
  terminal: { type: end }
