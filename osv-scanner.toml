# osv-scanner config — GHSA/OSV gate for the Rust dependency tree.
# Adds coverage cargo-audit (RUSTSEC-only) lacks: osv-scanner reads the OSV
# database (GHSA included), which is what caught the openssl HIGH that RUSTSEC
# missed (2026-06-27). Keep these ignores in sync with .cargo/audit.toml.
#
# All entries below are optional-feature transitives (libsql/bedrock/import, not
# in the default build) or have no upstream fix. Same rationale as audit.toml.

